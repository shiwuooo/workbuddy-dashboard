<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>网盘推广 · 工作台</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; margin:0; background:#f4f6fb; color:#1f2430; }
  header { background:linear-gradient(135deg,#16a085,#1abc9c); color:#fff; padding:14px 18px; }
  header h1 { margin:0; font-size:19px; }
  header p { margin:4px 0 0; font-size:12px; opacity:.92; }
  .wrap { max-width:1000px; margin:0 auto; padding:14px; }
  .tabs { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  .tabs button { background:#eef1f6; color:#333; border:none; border-radius:8px; padding:9px 14px; font-size:13px; cursor:pointer; }
  .tabs button.on { background:#16a085; color:#fff; }
  .card { background:#fff; border-radius:10px; padding:14px; margin-bottom:14px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
  .card h2 { margin:0 0 10px; font-size:15px; color:#16a085; }
  label { display:block; font-size:13px; margin:8px 0 4px; color:#444; }
  input[type=text],input[type=number],textarea,select { width:100%; padding:8px; border:1px solid #d6dae2; border-radius:6px; font-size:13px; font-family:inherit; }
  textarea { min-height:60px; resize:vertical; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:8px; }
  button { cursor:pointer; border:none; border-radius:6px; padding:8px 14px; font-size:13px; background:#16a085; color:#fff; }
  button.sec { background:#7f8c9a; }
  button.ghost { background:#eef1f6; color:#333; }
  button:hover { opacity:.9; }
  .item { border:1px solid #e6e9ef; border-radius:8px; padding:10px; margin-top:10px; }
  .item .top { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .item .meta { font-size:12px; color:#888; }
  .item .body { font-size:13px; white-space:pre-wrap; margin-top:6px; }
  .pill { display:inline-block; background:#e8f8f4; color:#16a085; border:1px solid #b8e6dd; border-radius:10px; padding:2px 8px; font-size:12px; margin:2px 4px 2px 0; }
  .pill.gray { background:#eef1f6; color:#555; border-color:#dde2ea; }
  .hint { font-size:12px; color:#999; margin-top:6px; }
  .stat { display:flex; gap:14px; flex-wrap:wrap; margin-top:6px; }
  .stat b { color:#16a085; }
  .hidden { display:none; }
  .red { color:#c0392b; }
</style>
</head>
<body>
<header>
  <h1>网盘推广 · 工作台（合并光鸭 / 夸克 / 副业思路）</h1>
  <p>赛道库 · 思路库（我的/大佬）· 账号登记 · 作品数据分析 · 按爆款逻辑生成小红书/抖音脚本。所有内容可随时自己增删改，数据留本地。</p>
</header>
<div class="wrap">

  <div class="tabs">
    <button class="on" data-t="sai" onclick="switchTab('sai')">赛道库</button>
    <button data-t="idea" onclick="switchTab('idea')">思路库</button>
    <button data-t="acc" onclick="switchTab('acc')">账号登记</button>
    <button data-t="work" onclick="switchTab('work')">作品数据</button>
    <button data-t="gen" onclick="switchTab('gen')">生成脚本</button>
    <button class="ghost" onclick="exportAll()">导出备份</button>
  </div>

  <!-- 赛道库 -->
  <div class="card" id="tab-sai">
    <h2>赛道库（选题方向）</h2>
    <div class="grid">
      <div><label>方向名（如：壮阳/小孩聪明/明星相关）</label><input type="text" id="sai_dir"></div>
      <div><label>标签（逗号分隔）</label><input type="text" id="sai_tags"></div>
    </div>
    <label>我的理解 / 为什么能转化</label><textarea id="sai_note"></textarea>
    <label>实操备注</label><textarea id="sai_tip"></textarea>
    <div style="margin-top:10px"><button onclick="addItem('sai')">+ 添加赛道</button></div>
    <div id="sai_list"></div>
  </div>

  <!-- 思路库 -->
  <div class="card hidden" id="tab-idea">
    <h2>思路库（粘贴链接或内容，自动归类）</h2>
    <div class="grid">
      <div><label>归属</label>
        <select id="idea_who"><option value="我的">我的思路</option><option value="大佬">大佬思路</option></select>
      </div>
      <div><label>关联赛道</label><input type="text" id="idea_dir" placeholder="留空则按内容自动猜"></div>
    </div>
    <label>内容 / 链接（直接粘贴，含 http 链接会自动识别平台）</label>
    <textarea id="idea_content" placeholder="粘贴大佬的笔记链接、或你自己的思路……"></textarea>
    <div style="margin-top:10px"><button onclick="addItem('idea')">+ 添加思路</button></div>
    <div id="idea_list"></div>
  </div>

  <!-- 账号登记 -->
  <div class="card hidden" id="tab-acc">
    <h2>账号登记管理</h2>
    <div class="grid">
      <div><label>平台</label>
        <select id="acc_plat"><option>小红书</option><option>抖音</option><option>快手</option><option>视频号</option><option>微博</option><option>其他</option></select>
      </div>
      <div><label>账号名</label><input type="text" id="acc_name"></div>
      <div><label>状态</label>
        <select id="acc_status"><option>运营中</option><option>限流</option><option>养号中</option><option>弃用</option></select>
      </div>
      <div><label>绑定网盘</label>
        <select id="acc_pan"><option>光鸭</option><option>夸克</option><option>两者</option><option>无</option></select>
      </div>
    </div>
    <label>备注（设备/IP/隔离方案等）</label><textarea id="acc_note"></textarea>
    <div style="margin-top:10px"><button onclick="addItem('acc')">+ 登记账号</button></div>
    <div id="acc_list"></div>
  </div>

  <!-- 作品数据 -->
  <div class="card hidden" id="tab-work">
    <h2>作品数据分析</h2>
    <div class="grid">
      <div><label>平台</label><input type="text" id="w_plat"></div>
      <div><label>标题</label><input type="text" id="w_title"></div>
      <div><label>链接</label><input type="text" id="w_link"></div>
    </div>
    <div class="grid">
      <div><label>播放/阅读</label><input type="number" id="w_play"></div>
      <div><label>点赞</label><input type="number" id="w_like"></div>
      <div><label>评论</label><input type="number" id="w_cm"></div>
      <div><label>转化(拉新/人)</label><input type="number" id="w_conv"></div>
      <div><label>收益(元)</label><input type="number" id="w_income"></div>
      <div><label>日期</label><input type="text" id="w_date" placeholder="2026-08-01"></div>
    </div>
    <label>备注</label><textarea id="w_note"></textarea>
    <div style="margin-top:10px"><button onclick="addItem('work')">+ 记录作品</button></div>
    <div id="work_list"></div>
    <p class="hint">互动率=点赞/播放；转化率=转化/播放。数据越多越能看出哪个赛道/账号能跑。</p>
  </div>

  <!-- 生成脚本 -->
  <div class="card hidden" id="tab-gen">
    <h2>按爆款逻辑生成脚本</h2>
    <div class="grid">
      <div><label>平台</label>
        <select id="g_plat"><option>小红书</option><option>抖音</option></select>
      </div>
      <div><label>赛道/角度</label><input type="text" id="g_dir" placeholder="如：小孩聪明-记忆力"></div>
    </div>
    <label>核心卖点（你的网盘能解决什么）</label><input type="text" id="g_sell" placeholder="如：XX资料免费存，整理好的合集">
    <div style="margin-top:10px; display:flex; gap:8px;">
      <button onclick="genScript()">生成脚本框架</button>
      <button class="sec" onclick="exportGen()">导出发 WorkBuddy 精修</button>
      <button class="ghost" onclick="saveGenAsIdea()">存为思路</button>
    </div>
    <label style="margin-top:10px">脚本框架</label>
    <textarea id="g_out" style="min-height:180px"></textarea>
  </div>

</div>

<script>
let state = { records: [] };
const $ = id => document.getElementById(id);
const TYPES = { sai:"赛道", idea:"思路", acc:"账号", work:"作品" };

async function load() {
  try { const r = await fetch("/api/load"); state = await r.json(); } catch(e){}
  if (!state.records) state.records = [];
  renderAll();
}
async function save() { try { await fetch("/api/save",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(state)}); } catch(e){ alert("保存失败:"+e); } }
function uid(){ return Date.now()+"_"+Math.random().toString(36).slice(2,7); }
function recsOf(t){ return state.records.filter(r=>r.type===t); }

function switchTab(t){
  document.querySelectorAll(".tabs button[data-t]").forEach(b=>b.classList.toggle("on", b.dataset.t===t));
  ["sai","idea","acc","work","gen"].forEach(x=>$("tab-"+x).classList.toggle("hidden", x!==t));
}

function addItem(t){
  let r = { id:uid(), type:TYPES[t], ts:new Date().toISOString() };
  if (t==="sai"){
    r.dir=$("sai_dir").value.trim(); r.tags=$("sai_tags").value.trim(); r.note=$("sai_note").value.trim(); r.tip=$("sai_tip").value.trim();
    if(!r.dir){ alert("填方向名"); return; }
    ["sai_dir","sai_tags","sai_note","sai_tip"].forEach(i=>$(i).value="");
  } else if (t==="idea"){
    r.who=$("idea_who").value; let c=$("idea_content").value.trim(); r.content=c;
    if(!c){ alert("粘贴内容/链接"); return; }
    let dir=$("idea_dir").value.trim();
    if(!dir){ dir = guessDir(c); }
    r.dir=dir; r.link = extractLink(c);
    $("idea_content").value=""; $("idea_dir").value="";
  } else if (t==="acc"){
    r.plat=$("acc_plat").value; r.name=$("acc_name").value.trim(); r.status=$("acc_status").value; r.pan=$("acc_pan").value; r.note=$("acc_note").value.trim();
    if(!r.name){ alert("填账号名"); return; }
    ["acc_name","acc_note"].forEach(i=>$(i).value="");
  } else if (t==="work"){
    r.plat=$("w_plat").value.trim(); r.title=$("w_title").value.trim(); r.link=$("w_link").value.trim();
    r.play=+$("w_play").value||0; r.like=+$("w_like").value||0; r.cm=+$("w_cm").value||0; r.conv=+$("w_conv").value||0; r.income=+$("w_income").value||0; r.date=$("w_date").value.trim()||new Date().toISOString().slice(0,10); r.note=$("w_note").value.trim();
    if(!r.title && !r.link){ alert("至少填标题或链接"); return; }
    ["w_plat","w_title","w_link","w_play","w_like","w_cm","w_conv","w_income","w_date","w_note"].forEach(i=>$(i).value="");
  }
  state.records.push(r); save(); renderAll();
}
function guessDir(text){
  const map=[["壮阳","壮阳"],["补肾","壮阳"],["增硬","壮阳"],["小孩","小孩聪明"],["聪明","小孩聪明"],["记忆力","小孩聪明"],["学生","小孩聪明"],["明星","明星相关"],["八卦","明星相关"],["减肥","减肥瘦身"],["瘦身","减肥瘦身"],["考研","考研考公"],["考公","考研考公"],["公考","考研考公"]];
  for(const [k,v] of map){ if(text.includes(k)) return v; }
  return "未分类";
}
function extractLink(t){ const m=t.match(/https?:\/\/[^\s]+/); return m?m[0]:""; }
function platformOf(link){ if(!link) return ""; if(link.includes("xiaohongshu")) return "小红书"; if(link.includes("douyin")) return "抖音"; if(link.includes("bilibili")) return "B站"; if(link.includes("kuaishou")) return "快手"; return "链接"; }

function renderAll(){ renderSai(); renderIdea(); renderAcc(); renderWork(); }
function renderSai(){
  const c=$("sai_list"); c.innerHTML="";
  recsOf("赛道").forEach(r=>{
    const d=document.createElement("div"); d.className="item";
    let tags=(r.tags||"").split(",").filter(Boolean).map(t=>'<span class="pill">'+t+'</span>').join("");
    d.innerHTML='<div class="top"><b>'+r.dir+'</b><span class="meta"></span></div><div>'+tags+'</div>'
      +'<div class="body">'+(r.note||"")+'</div>'
      + (r.tip?'<div class="body" style="background:#f0faf8;padding:8px;border-radius:6px"><b>实操：</b>'+(r.tip||"")+'</div>':'')
      + '<div style="margin-top:8px"><button class="sec" onclick="del(\''+r.id+'\')">删除</button></div>';
    c.appendChild(d);
  });
}
function renderIdea(){
  const c=$("idea_list"); c.innerHTML="";
  recsOf("思路").forEach(r=>{
    const d=document.createElement("div"); d.className="item";
    const pf = r.link? '<span class="pill gray">'+platformOf(r.link)+'</span>':'';
    d.innerHTML='<div class="top"><b>['+r.who+'] '+ (r.dir||"未分类") +'</b><span class="meta"></span></div>'
      + '<div>'+pf+(r.link?' <a href="'+r.link+'" target="_blank">链接</a>':'')+'</div>'
      + '<div class="body">'+escapeHtml(r.content)+'</div>'
      + '<div style="margin-top:8px"><button class="sec" onclick="del(\''+r.id+'\')">删除</button></div>';
    c.appendChild(d);
  });
}
function renderAcc(){
  const c=$("acc_list"); c.innerHTML="";
  recsOf("账号").forEach(r=>{
    const d=document.createElement("div"); d.className="item";
    const st = r.status==="限流"?'<span class="red">限流</span>':r.status;
    d.innerHTML='<div class="top"><b>'+r.plat+' · '+r.name+'</b><span class="meta">'+st+' · 绑'+r.pan+'</span></div>'
      + (r.note?'<div class="body">'+escapeHtml(r.note)+'</div>':'')
      + '<div style="margin-top:8px"><button class="sec" onclick="del(\''+r.id+'\')">删除</button></div>';
    c.appendChild(d);
  });
}
function renderWork(){
  const c=$("work_list"); c.innerHTML="";
  const list=recsOf("作品").sort((a,b)=>b.date.localeCompare(a.date));
  list.forEach(r=>{
    const d=document.createElement("div"); d.className="item";
    const inter = r.play? (r.like/r.play*100).toFixed(2)+"%":"—";
    const conv = r.play? (r.conv/r.play*100).toFixed(3)+"%":"—";
    d.innerHTML='<div class="top"><b>'+(r.title||"无标题")+'</b><span class="meta">'+r.date+' · '+r.plat+'</span></div>'
      + '<div class="stat"><span>播放 <b>'+r.play+'</b></span><span>点赞 <b>'+r.like+'</b></span><span>评论 <b>'+r.cm+'</b></span><span>转化 <b>'+r.conv+'</b></span><span>收益 <b>'+r.income+'</b></span></div>'
      + '<div class="stat"><span>互动率 '+inter+'</span><span>转化率 '+conv+'</span>'+(r.link?'<a href="'+r.link+'" target="_blank">链接</a>':'')+'</div>'
      + (r.note?'<div class="body">'+escapeHtml(r.note)+'</div>':'')
      + '<div style="margin-top:8px"><button class="sec" onclick="del(\''+r.id+'\')">删除</button></div>';
    c.appendChild(d);
  });
  if(list.length){ // 汇总
    let tp=0,tl=0,tc=0; list.forEach(r=>{tp+=r.play;tl+=r.like;tc+=r.conv;});
    const sum=document.createElement("div"); sum.className="hint";
    sum.innerHTML="汇总：总播放 "+tp+"，总点赞 "+tl+"，总转化 "+tc+(tp?("，整体互动率 "+(tl/tp*100).toFixed(2)+"% / 转化率 "+(tc/tp*100).toFixed(3)+"%"):"");
    c.appendChild(sum);
  }
}
function del(id){ if(!confirm("删除？")) return; state.records=state.records.filter(r=>r.id!==id); save(); renderAll(); }
function escapeHtml(s){ return (s||"").replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

function genScript(){
  const plat=$("g_plat").value, dir=$("g_dir").value.trim()||"（赛道）", sell=$("g_sell").value.trim()||"（你的网盘能提供的价值）";
  let s="";
  if(plat==="小红书"){
    s += "【标题】"+dir+"｜亲测能用的资料包，存好不迷路\n";
    s += "【封面】大字：「"+dir+"资料合集」+ 网盘图标\n";
    s += "【正文】\n";
    s += "最近很多姐妹问"+dir+"的资料在哪找，整理了这份合集👇\n";
    s += "✅ "+sell+"\n";
    s += "✅ 已按模块分好类，直接存\n";
    s += "📁 网盘领取：见评论区 / 主页\n";
    s += "【结尾】觉得有用点个收藏，后续持续更～\n";
    s += "【话题】#"+dir+" #资料分享 #网盘 #自学";
  } else {
    s += "【黄金3秒】别再到处找"+dir+"的资料了，这一个网盘全搞定\n";
    s += "【正文】\n";
    s += "我是怎么整理的："+sell+"\n";
    s += "痛点切入→展示合集→引导存网盘\n";
    s += "【引导】左下角/评论区拿链接，存完回来谢我\n";
    s += "【钩子】下期讲怎么用这套资料见效，关注不迷路";
  }
  $("g_out").value=s;
}
function exportGen(){
  const s=$("g_out").value.trim(); if(!s){ alert("先生成脚本"); return; }
  const b=new Blob([s],{type:"text/plain;charset=utf-8"}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download="脚本_发给WorkBuddy精修.txt"; a.click();
}
function saveGenAsIdea(){
  const s=$("g_out").value.trim(); if(!s){ alert("先生成脚本"); return; }
  state.records.push({ id:uid(), type:"思路", who:"我的", dir:guessDir($("g_dir").value), content:"【生成脚本】\n"+s, ts:new Date().toISOString() });
  save(); renderIdea(); alert("已存为思路。");
}
function exportAll(){ const b=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download="网盘推广全部数据.json"; a.click(); }

load();
</script>
</body>
</html>

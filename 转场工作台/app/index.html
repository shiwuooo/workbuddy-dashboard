<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>转场工作台</title>
<style>
:root{
  --bg:#f5f7fa; --panel:#ffffff; --ink:#1f2430; --muted:#6b7280;
  --line:#e5e7eb; --accent:#2563eb; --accent2:#7c3aed;
  --chip:#eef2ff; --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,sans-serif;
  background:var(--bg);color:var(--ink);font-size:14px}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
  padding:12px 18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
h1{font-size:17px;margin:0;font-weight:700;white-space:nowrap}
h1 .em{color:var(--accent)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-left:auto}
input,select,textarea,button{font-family:inherit;font-size:13px}
.search{flex:1;min-width:160px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
select{padding:8px 8px;border:1px solid var(--line);border-radius:8px;background:#fff}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;color:var(--ink)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.ghost{background:#fff}
button:hover{filter:brightness(.97)}
.wrap{padding:18px;max-width:1280px;margin:0 auto}
.count{color:var(--muted);font-size:12px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);
  cursor:pointer;transition:transform .12s,box-shadow .12s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.10)}
.thumb-wrap{position:relative;aspect-ratio:9/16;background:#0f1320;display:flex;align-items:center;justify-content:center}
.thumb-wrap video{width:100%;height:100%;object-fit:cover;display:block;background:#0f1320}
.thumb-ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#9aa3b2;font-size:12px;gap:6px;background:repeating-linear-gradient(45deg,#11162a,#11162a 10px,#141a30 10px,#141a30 20px)}
.badges{position:absolute;top:8px;left:8px;display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:11px;padding:3px 7px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff}
.badge.t{background:rgba(37,99,235,.85)}
.badge.p{background:rgba(124,58,237,.85)}
.stars{position:absolute;top:8px;right:8px;color:#fbbf24;font-size:13px;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.card-body{padding:10px 12px}
.card-title{font-weight:600;font-size:13.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{margin-top:6px;color:var(--muted);font-size:12px}
.empty{text-align:center;color:var(--muted);padding:60px 20px}
.overlay{position:fixed;inset:0;background:rgba(15,19,32,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:18px}
.overlay.show{display:flex}
.modal{background:var(--panel);border-radius:14px;width:min(880px,96vw);max-height:92vh;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:0}
@media(max-width:720px){.modal{grid-template-columns:1fr}}
.modal-l{padding:0;background:#0f1320;display:flex;align-items:center;justify-content:center}
.modal-l video{max-width:100%;max-height:60vh;background:#000}
.modal-r{padding:18px;display:flex;flex-direction:column;gap:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.field textarea{min-height:120px;resize:vertical;line-height:1.5}
.row{display:flex;gap:10px}.row>*{flex:1}
.rating{font-size:22px;color:#d1d5db;cursor:pointer;user-select:none}
.rating span.on{color:#fbbf24}
.modal-head{display:flex;align-items:center;justify-content:space-between}
.modal-head h2{margin:0;font-size:16px}
.x{border:none;background:none;font-size:22px;color:var(--muted);cursor:pointer;line-height:1}
.actions{display:flex;gap:8px;margin-top:4px}
.actions .primary{flex:1}
.tip{font-size:11px;color:var(--muted);line-height:1.5}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .25s;z-index:80;pointer-events:none}
.toast.show{opacity:.95}
</style>
</head>
<body>
<header>
  <h1>🎬 <span class="em">转场工作台</span></h1>
  <input id="q" class="search" placeholder="搜索标题 / 复刻步骤 / 标签…">
  <select id="fType"></select>
  <select id="fPlatform"></select>
  <div class="tools">
    <button id="btnScan" class="ghost">⇩ 扫描新视频</button>
    <button id="btnAdd" class="primary">＋ 新建</button>
    <button id="btnExport" class="ghost">⤓ 备份</button>
  </div>
</header>
<div class="wrap">
  <div class="count" id="count"></div>
  <div id="grid" class="grid"></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-l"><video id="mVideo" controls preload="metadata" playsinline></video></div>
    <div class="modal-r">
      <div class="modal-head"><h2 id="mTitleHead">编辑</h2><button class="x" id="mClose">×</button></div>
      <div class="row">
        <div class="field"><label>标题</label><input id="mTitle"></div>
        <div class="field"><label>来源平台</label><select id="mPlatform"></select></div>
      </div>
      <div class="row">
        <div class="field"><label>转场类型</label><select id="mType"></select></div>
        <div class="field"><label>难度</label><select id="mDiff"></select></div>
      </div>
      <div class="field"><label>风格 / 关键词</label><input id="mStyle" placeholder="如：电影感、卡点、清新…"></div>
      <div class="field"><label>评分</label><div class="rating" id="mRating"></div></div>
      <div class="field"><label>标签（逗号分隔）</label><input id="mTags" placeholder="遮罩, 推拉镜头, 剪映"></div>
      <div class="field"><label>本地视频文件（离线/预览用，可选）</label><input type="file" id="mFile" accept="video/*"></div>
      <div class="field"><label>怎么复刻这个转场（步骤 / 用的功能 / 参数 / 注意点）</label>
        <textarea id="mNotes" placeholder="例：&#10;1. 用【画中画】功能叠加两段素材&#10;2. 上层加【线性蒙版】做左右擦除&#10;3. 关键帧：蒙版从 0% 扫到 100%&#10;4. 配 0.2s 缓动，对齐鼓点"></textarea></div>
      <div class="actions">
        <button class="primary" id="mSave">保存</button>
        <button class="ghost" id="mDelete">删除</button>
      </div>
      <div class="tip">数据全部存在你本机 D:/workbuddy/转场工作台/data/transitions.json（服务器模式），或浏览器本地（离线模式），不上传任何服务器。</div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const TYPES=["遮罩转场","运镜转场","特效转场","转场技巧","待分类"];
const PLATFORMS=["抖音","小红书","B站","未知"];
const DIFFS=["简单","中等","困难","未知"];
// 内置示例：即使离线打开也能立刻看到带复刻笔记的卡片
const DEMO=[
  {"id":"demo1","title":"黑白遮罩转场：画面擦除切换","file":"","platform":"抖音","transitionType":"遮罩转场","difficulty":"简单","style":"电影感 / 卡点","rating":4,"tags":["遮罩","擦除","剪映"],"notes":"1. 两段素材叠放，上层加【线性蒙版】\n2. 蒙版从画面一侧 0% 擦除到 100%\n3. 加 0.15s 缓动，对齐鼓点\n4. 可叠一层黑白噪点提升质感","dateAdded":"2026-07-31"},
  {"id":"demo2","title":"运镜甩动转场：镜头甩出接下一镜","file":"","platform":"小红书","transitionType":"运镜转场","difficulty":"中等","style":"vlog / 快节奏","rating":5,"tags":["甩镜头","方向匹配","节奏"],"notes":"1. 上一镜结尾做一个快速甩镜（手机/稳定器横甩）\n2. 下一镜开头从同方向甩入\n3. 两段在甩的最高速度处用【闪白/模糊】衔接\n4. 注意甩动方向要一致，否则会跳戏","dateAdded":"2026-07-31"},
  {"id":"demo3","title":"缩放模糊转场：Z轴推近穿越","file":"","platform":"抖音","transitionType":"特效转场","difficulty":"困难","style":"科技感 / 卡点","rating":3,"tags":["缩放","径向模糊","穿越"],"notes":"1. 素材A做【放大+径向模糊】到 150%\n2. 在最高模糊处切到素材B\n3. 素材B从 60% 放大回 100% 并去模糊\n4. 配 whoosh 音效增强穿越感","dateAdded":"2026-07-31"}
];
let items=[];
let curId=null;
let curRating=0;
let apiOK=true;

const $=id=>document.getElementById(id);
function fillSelect(el,arr){
  if(el.id.startsWith('f')){el.innerHTML='<option value="全部">全部</option>'+arr.map(a=>'<option>'+a+'</option>').join('');}
  else{el.innerHTML=arr.map(a=>'<option>'+a+'</option>').join('');}
}
fillSelect($('fType'),TYPES);fillSelect($('fPlatform'),PLATFORMS);
fillSelect($('mType'),TYPES);fillSelect($('mPlatform'),PLATFORMS);fillSelect($('mDiff'),DIFFS);

function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}

async function load(){
  try{
    const r=await fetch('/api/items');
    if(!r.ok) throw 0;
    items=await r.json(); apiOK=true;
  }catch(e){
    apiOK=false;
    try{items=JSON.parse(localStorage.getItem('transitions')||'[]');}catch(_){items=[];}
    if(!items.length){items=JSON.parse(JSON.stringify(DEMO));localStorage.setItem('transitions',JSON.stringify(items));}
  }
  render();
}
function filters(){
  const q=$('q').value.trim().toLowerCase();
  const t=$('fType').value, p=$('fPlatform').value;
  return items.filter(it=>{
    if(t!=='全部'&&it.transitionType!==t)return false;
    if(p!=='全部'&&it.platform!==p)return false;
    if(q){
      const hay=(it.title+' '+(it.notes||'')+' '+(it.tags||[]).join(' ')+' '+(it.style||'')).toLowerCase();
      if(!hay.includes(q))return false;
    }
    return true;
  });
}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function starStr(n){let s='';for(let i=1;i<=5;i++)s+= i<=n?'★':'☆';return s;}

function render(){
  const list=filters();
  $('count').textContent='共 '+items.length+' 条，当前显示 '+list.length+' 条'+(apiOK?'':'（离线模式：浏览器本地存储）');
  const g=$('grid');
  if(!list.length){g.innerHTML='<div class="empty">没有匹配的转场。点「＋ 新建」或启动服务器后点「⇩ 扫描新视频」开始。</div>';return;}
  g.innerHTML=list.map(it=>{
    const hasV=!!it.file;
    const thumb=hasV
      ? '<video src="/videos/'+encodeURIComponent(it.file)+'" muted preload="metadata" playsinline onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'"></video>'
      : '';
    const ph='<div class="thumb-ph" style="'+(hasV?'display:none':'display:flex')+'">🎬<br>视频未下载</div>';
    const rt=it.rating>0?'<div class="stars">'+starStr(it.rating)+'</div>':'';
    return '<div class="card" data-id="'+esc(it.id)+'">'
      +'<div class="thumb-wrap">'+thumb+ph
      +'<div class="badges"><span class="badge t">'+esc(it.transitionType)+'</span>'
      +(it.platform&&it.platform!=='未知'?'<span class="badge p">'+esc(it.platform)+'</span>':'')+'</div>'
      +rt+'</div>'
      +'<div class="card-body"><div class="card-title">'+esc(it.title||'(无标题)')+'</div>'
      +(it.style?'<div class="card-meta">'+esc(it.style)+'</div>':'')+'</div>'
      +'</div>';
  }).join('');
  g.querySelectorAll('.card').forEach(c=>c.onclick=()=>openModal(c.dataset.id));
}

$('q').oninput=render;
$('fType').onchange=render;
$('fPlatform').onchange=render;

function renderRating(n){const r=$('mRating');r.innerHTML='';for(let i=1;i<=5;i++){const s=document.createElement('span');s.textContent='★';if(i<=n)s.className='on';s.onclick=()=>{curRating=i;renderRating(i);};r.appendChild(s);}}

function openModal(id,isNew){
  curId=id;
  const it=isNew?{id:'id_'+Date.now(),title:'',file:'',platform:'未知',transitionType:'待分类',difficulty:'未知',style:'',rating:0,tags:[],notes:'',dateAdded:new Date().toISOString().slice(0,10)}
    : items.find(x=>x.id===id);
  $('mTitle').value=it.title||'';
  $('mPlatform').value=it.platform||'未知';
  $('mType').value=it.transitionType||'待分类';
  $('mDiff').value=it.difficulty||'未知';
  $('mStyle').value=it.style||'';
  $('mTags').value=(it.tags||[]).join(', ');
  $('mNotes').value=it.notes||'';
  curRating=it.rating||0; renderRating(curRating);
  const v=$('mVideo'); const f=$('mFile'); f.value='';
  if(it.file){v.src='/videos/'+encodeURIComponent(it.file);v.style.display='block';}
  else{v.removeAttribute('src');v.style.display='none';}
  $('mTitleHead').textContent=isNew?'新建转场':'编辑：'+(it.title||'');
  $('mDelete').style.display=isNew?'none':'';
  $('overlay').classList.add('show');
}
$('mClose').onclick=closeModal;
$('overlay').onclick=e=>{if(e.target===$('overlay'))closeModal();};
function closeModal(){$('overlay').classList.remove('show');$('mVideo').pause();}

$('mFile').onchange=e=>{const f=e.target.files[0];if(f){const u=URL.createObjectURL(f);$('mVideo').src=u;$('mVideo').style.display='block';}};

$('btnAdd').onclick=()=>openModal(null,true);
$('mSave').onclick=async()=>{
  const it=items.find(x=>x.id===curId);
  const data={
    id:curId,title:$('mTitle').value.trim(),platform:$('mPlatform').value,
    transitionType:$('mType').value,difficulty:$('mDiff').value,style:$('mStyle').value.trim(),
    rating:curRating,tags:$('mTags').value.split(',').map(s=>s.trim()).filter(Boolean),
    notes:$('mNotes').value,file:it?it.file:'',dateAdded:it?it.dateAdded:new Date().toISOString().slice(0,10)
  };
  if(it){Object.assign(it,data);}else{items.unshift(data);}
  await persist();closeModal();toast('已保存');
};
$('mDelete').onclick=async()=>{
  if(!confirm('确定删除这条转场？'))return;
  items=items.filter(x=>x.id!==curId);await persist();closeModal();toast('已删除');
};
async function persist(){
  if(apiOK){
    await fetch('/api/items',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(items)});
  }else{
    localStorage.setItem('transitions',JSON.stringify(items));
  }
  await load();
}
$('btnScan').onclick=async()=>{
  if(!apiOK){toast('需先启动工作台服务器才能扫描文件夹');return;}
  const r=await fetch('/api/scan');const d=await r.json();await load();
  toast(d.added>0?('扫描到 '+d.added+' 个新视频'):'没有新视频');
};
$('btnExport').onclick=()=>{
  const blob=new Blob([JSON.stringify(items,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='transitions-backup.json';a.click();
  toast('已导出备份');
};

load();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>碎片关联地图</title>
<style>
  :root{--bg:#f7f8fa;--card:#fff;--ink:#1f2329;--sub:#6b7280;--line:#e5e7eb;
    --growth:#10b981;--values:#3b82f6;--idea:#f59e0b;--cardc:#8b5cf6}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);padding:18px}
  .wrap{max-width:1000px;margin:0 auto}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--sub);font-size:13px;margin-bottom:12px;line-height:1.6}
  svg{width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:12px}
  .node rect{fill:#fff;stroke:var(--line);stroke-width:1.5}
  .node.growth rect{stroke:var(--growth)} .node.values rect{stroke:var(--values)}
  .node.idea rect{stroke:var(--idea)} .node.card rect{stroke:var(--cardc);stroke-width:2.5}
  .node.hold rect{stroke:var(--hold,#9ca3af);stroke-dasharray:4 3}
  .node text{font-size:12px;fill:var(--ink)}
  .node .t{font-size:10px;fill:var(--sub)}
  .lane{fill:#fafafa;stroke:#eef0f3}
  .llabel{font-size:13px;font-weight:700;fill:var(--sub)}
  .edge{stroke:#cbd5e1;stroke-width:1.5;fill:none}
  .edge.cross{stroke:#94a3b8;stroke-width:2;stroke-dasharray:5 4}
  .edge.hi{stroke:var(--accent,#3b82f6);stroke-width:3}
  .node.hi rect{stroke-width:3}
  .node.dim{opacity:.16} .edge.dim{opacity:.1}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--sub)}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .flabel{font-size:12px;color:var(--sub);margin:12px 0 6px}
  .filters{display:flex;gap:8px;flex-wrap:wrap}
  .filters button{border:1px solid var(--line);background:#fff;color:var(--ink);padding:6px 14px;border-radius:20px;cursor:pointer;font-size:13px}
  .filters button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <h1>🕸️ 碎片关联地图</h1>
  <div class="sub">由 AI 对散存碎片做智能分类后生成。节点 = 精炼卡片 / 暂挂片段，连线 = 关联。鼠标悬停任一节点可高亮它的关系网；或用下方主题标签筛选。紫色=已精炼卡片，虚线=跨主题关联。</div>

  <div class="flabel">按主题标签筛选（只看属于该主题的卡片与连线）</div>
  <div class="filters" id="filtersTopic"></div>

  <svg id="svg" viewBox="0 0 1000 920" xmlns="http://www.w3.org/2000/svg"></svg>
  <div class="legend">
    <span><i style="background:var(--cardc)"></i>已精炼卡片（12 张）</span>
    <span><i style="background:#9ca3af"></i>暂挂 outlier（不进主库）</span>
    <span><i style="background:#94a3b8"></i>虚线=跨主题关联</span>
  </div>
</div>
<script>
const NS='http://www.w3.org/2000/svg';
const PNAME={card:'已精炼卡片',hold:'暂挂·不进主库'};
const TOPICS=['#沟通社交','#自我成长','#心态看开','#内容运营','#理财搞钱','#健康','#学习'];
const LANES=[
  {x:60,y:200,w:220,h:440,fill:'#ecfdf5',label:'A · 行动·执行'},
  {x:390,y:180,w:220,h:660,fill:'#eff6ff',label:'B · 自我叙事·看开'},
  {x:720,y:330,w:220,h:250,fill:'#fffbeb',label:'C · 内容·运营'},
];
const nodes=[
  // 簇 A · 行动·执行
  {id:'c1',label:'唯唯诺诺训练卡',sub:'card',x:170,y:250,cls:'card',topics:['#沟通社交','#自我成长','#心态看开']},
  {id:'k10',label:'#10 行动力微决策',sub:'card',x:170,y:360,cls:'card',topics:['#自我成长','#沟通社交']},
  {id:'k12',label:'#12 自律三原则',sub:'card',x:170,y:470,cls:'card',topics:['#自我成长']},
  {id:'k13',label:'#13 跳过情绪直接做',sub:'card',x:170,y:580,cls:'card',topics:['#自我成长','#心态看开']},
  // 簇 B · 自我叙事·看开
  {id:'c2',label:'生活主线过滤器',sub:'card',x:500,y:230,cls:'card',topics:['#自我成长','#心态看开']},
  {id:'k01',label:'#01 脸面变现',sub:'card',x:500,y:320,cls:'card',topics:['#心态看开','#自我成长']},
  {id:'k03',label:'#03 烦恼是投射',sub:'card',x:500,y:410,cls:'card',topics:['#心态看开','#自我成长']},
  {id:'k04a',label:'#04a 勇气开道',sub:'card',x:500,y:500,cls:'card',topics:['#心态看开','#自我成长']},
  {id:'k04b',label:'#04b 希望不灭',sub:'card',x:500,y:590,cls:'card',topics:['#心态看开','#自我成长']},
  {id:'k06',label:'#06 原地重生',sub:'card',x:500,y:680,cls:'card',topics:['#心态看开','#自我成长']},
  {id:'k07',label:'#07 活在当下',sub:'card',x:500,y:770,cls:'card',topics:['#心态看开','#自我成长']},
  // 簇 C · 内容·运营
  {id:'k02',label:'#02 反着做标题',sub:'card',x:830,y:380,cls:'card',topics:['#内容运营']},
  {id:'k11',label:'#11 转发传播原理',sub:'card',x:830,y:500,cls:'card',topics:['#内容运营']},
  // 暂挂 outlier（不进主库）
  {id:'o05',label:'#05 猫·治愈',sub:'hold',x:170,y:860,cls:'hold',topics:['#沟通社交']},
  {id:'o08',label:'#08 除法速算',sub:'hold',x:500,y:860,cls:'hold',topics:['#学习']},
  {id:'o09',label:'#09 屎尿屁吐槽',sub:'hold',x:830,y:860,cls:'hold',topics:[]},
];
const edges=[
  {f:'c1',t:'k10',cross:0},{f:'c1',t:'c2',cross:1},
  {f:'k10',t:'k12',cross:0},{f:'k10',t:'k13',cross:0},{f:'k12',t:'k13',cross:0},
  {f:'k13',t:'k07',cross:1},{f:'k04a',t:'k13',cross:1},
  {f:'c2',t:'k01',cross:0},{f:'c2',t:'k03',cross:0},{f:'c2',t:'k06',cross:0},
  {f:'k01',t:'k03',cross:0},{f:'k03',t:'k06',cross:0},{f:'k04b',t:'k06',cross:0},
  {f:'k02',t:'k11',cross:0},{f:'k07',t:'c2',cross:0},
];
const byId={};nodes.forEach(n=>byId[n.id]=n);
const adj={};nodes.forEach(n=>adj[n.id]=[]);
edges.forEach(e=>{adj[e.f].push(e);adj[e.t].push(e)});
const svg=document.getElementById('svg');

LANES.forEach(L=>{
  const r=document.createElementNS(NS,'rect');
  r.setAttribute('x',L.x);r.setAttribute('y',L.y);r.setAttribute('width',L.w);
  r.setAttribute('height',L.h);r.setAttribute('rx',14);r.setAttribute('class','lane');
  r.setAttribute('fill',L.fill);svg.appendChild(r);
  const t=document.createElementNS(NS,'text');t.setAttribute('x',L.x+L.w/2);t.setAttribute('y',L.y+22);
  t.setAttribute('text-anchor','middle');t.setAttribute('class','llabel');
  t.textContent=L.label;svg.appendChild(t);
});
// 暂挂区标签
const ot=document.createElementNS(NS,'text');
ot.setAttribute('x',60);ot.setAttribute('y',835);ot.setAttribute('class','llabel');
ot.textContent='⏸ 暂挂 outlier（保留原文·不进主库）';svg.appendChild(ot);

function mkEdge(e){
  const a=byId[e.f],b=byId[e.t];
  const p=document.createElementNS(NS,'path');
  const x1=a.x,y1=a.y,x2=b.x,y2=b.y,my=(y1+y2)/2;
  p.setAttribute('d',`M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}`);
  p.setAttribute('class','edge'+(e.cross?' cross':''));p.dataset.f=e.f;p.dataset.t=e.t;
  return p;
}
edges.forEach(e=>svg.appendChild(mkEdge(e)));

const nodeEls={};
nodes.forEach(n=>{
  const g=document.createElementNS(NS,'g');g.setAttribute('class','node '+n.cls);g.dataset.id=n.id;
  const w=200,h=44;
  const r=document.createElementNS(NS,'rect');
  r.setAttribute('x',n.x-w/2);r.setAttribute('y',n.y-h/2);r.setAttribute('width',w);
  r.setAttribute('height',h);r.setAttribute('rx',9);g.appendChild(r);
  const t=document.createElementNS(NS,'text');t.setAttribute('x',n.x);t.setAttribute('y',n.y-2);
  t.setAttribute('text-anchor','middle');t.textContent=n.label;g.appendChild(t);
  const s=document.createElementNS(NS,'text');s.setAttribute('x',n.x);s.setAttribute('y',n.y+14);
  s.setAttribute('text-anchor','middle');s.setAttribute('class','t');s.textContent=PNAME[n.sub];
  g.appendChild(s);
  g.addEventListener('mouseenter',()=>hi(n.id));g.addEventListener('mouseleave',unhi);
  svg.appendChild(g);nodeEls[n.id]=g;
});

let curTopic='all';
function hi(id){
  document.querySelectorAll('.edge').forEach(p=>{p.classList.toggle('hi',p.dataset.f===id||p.dataset.t===id)});
  const set=new Set([id]);adj[id].forEach(e=>{set.add(e.f);set.add(e.t)});
  document.querySelectorAll('.node').forEach(g=>g.classList.toggle('hi',set.has(g.dataset.id)));
}
function unhid(){document.querySelectorAll('.edge,.node').forEach(x=>x.classList.remove('hi'));applyTopic(curTopic)}
function applyTopic(t){
  curTopic=t;
  document.querySelectorAll('.node').forEach(g=>{
    const n=byId[g.dataset.id];
    const on = t==='all' || (n.topics&&n.topics.includes(t));
    g.classList.toggle('dim',!on);
  });
  document.querySelectorAll('.edge').forEach(p=>{
    const a=byId[p.dataset.f],b=byId[p.dataset.t];
    const on = t==='all' || (a.topics&&a.topics.includes(t)) || (b.topics&&b.topics.includes(t));
    p.classList.toggle('dim',!on);
  });
}
function renderFilters(){
  document.getElementById('filtersTopic').innerHTML=['all',...TOPICS].map(t=>
    `<button class="${t===curTopic?'active':''}" onclick="setT('${t}')">${t==='all'?'全部主题':t}</button>`).join('');
}
function setT(t){curTopic=t;renderFilters();applyTopic(t);}
renderFilters();applyTopic('all');
</script>
</body>
</html>

<style>
  :root{--bg:#f5f6f8;--card:#fff;--bd:#e2e5ea;--tx:#1f2329;--mut:#8a909c;--b:#2f6fed;--gp:#1a8f4c;--lo:#c9821a;--rd:#d9534f;}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.6 -apple-system,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--tx)}
  header{padding:18px 22px;background:#fff;border-bottom:1px solid var(--bd)}
  h1{margin:0;font-size:20px}
  .sub{color:var(--mut);font-size:12px;margin-top:4px}
  .wrap{max-width:1080px;margin:0 auto;padding:18px 16px 60px}
  .grp{margin:22px 0 6px;font-size:13px;font-weight:700;color:var(--mut);letter-spacing:.5px}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px 16px;margin-bottom:12px;position:relative}
  .top{display:flex;align-items:flex-start;gap:10px;justify-content:space-between}
  .nm{font-size:16px;font-weight:700}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
  .tag{font-size:11px;padding:2px 8px;border-radius:20px;background:#eef2fb;color:var(--b)}
  .tag.gp{background:#e7f6ec;color:var(--gp)}
  .tag.lo{background:#fbf0dc;color:var(--lo)}
  .tag.rd{background:#fbeaea;color:var(--rd)}
  .url{font-size:12px;word-break:break-all}
  .url a{color:var(--b);text-decoration:none}
  .url a:hover{text-decoration:underline}
  .meta{font-size:12px;color:var(--mut);margin:6px 0}
  .desc{font-size:13px;margin:6px 0}
  .note{font-size:12px;background:#fff8e6;border-left:3px solid var(--lo);padding:6px 10px;margin-top:8px;border-radius:4px;display:none}
  .note.show{display:block}
  .ops{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  button{font:12px sans-serif;border:1px solid var(--bd);background:#fff;color:var(--tx);border-radius:6px;padding:4px 10px;cursor:pointer}
  button:hover{background:#f0f2f5}
  button.dg{color:var(--rd);border-color:#f0c9c7}
  .mv{display:flex;flex-direction:column;gap:2px}
  .mv button{padding:1px 7px;line-height:1.2}
  .restore{margin-top:20px;font-size:12px;color:var(--mut)}
  .restore a{color:var(--rd);cursor:pointer}
  .stat{font-size:12px;color:var(--mut);margin:10px 0}
</style>
</head>

const GP_LIVE=["xiangqu-qingdan","daqing-travel","shangantong-papers-v4-shared","shangantong-papers-v4-c1","shangantong-papers-v1-c1","shangantong-papers-v4-c5","shangantong-papers-v4-c4","shangantong-papers-v4-c3","shangantong-papers-v4-c2","shangantong-papers-v3-c3","shangantong-papers-v3","shangantong-papers-v3-c2","shangantong-papers-v3-c1","shangantong-papers-v2","shangantong-papers-v2-c2","shangantong-papers-v2-c1","shangantong-papers-v1-c2","shangantong-papers-v1","workbuddy-dashboard","xingce-ai-coach","zimeiti-hub","shangantong","qiushi-shenlun","shangantong-papers","yidongyunpan","yidongxin","yidongyun","yidong","shiyan","-","quark","quark-page","1dfee52d08f5a985","deploy_site","5ecc3cdfb2edeee6","deploy","考公刷题网站_cloud","考公刷题网站_deploy","deploy_a1f143"];
const KEY="deploy_websites_v1";
let S=load();
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
S.order=S.order||BASE.map(b=>b.id);
S.renames=S.renames||{};S.notes=S.notes||{};S.deleted=S.deleted||[];
function byId(id){return BASE.find(b=>b.id===id)}
function statusCls(b){if(S.deleted.includes(b.id))return"";if(GP_LIVE.includes(b.id))return b.status.indexOf("异常")>=0?"lo":"gp";return"lo"}
function render(){
 let html="",liveN=0;
 const vis=S.order.filter(id=>!S.deleted.includes(id));
 // 公网组
 html+='<div class="grp">公网部署（GitHub Pages / CloudStudio）</div>';
 vis.forEach((id,i)=>{
   const b=byId(id);if(!b||!GP_LIVE.includes(id))return;liveN++;
   html+=card(b,i,vis,GP_LIVE.includes(id));
 });
 html+='<div class="grp">仓库 / 本地（未确认公网部署）</div>';
 vis.forEach((id,i)=>{
   const b=byId(id);if(!b||GP_LIVE.includes(id))return;
   html+=card(b,i,vis,false);
 });
 document.getElementById("list").innerHTML=html;
 document.getElementById("stat").textContent="共 "+BASE.length+" 个 · 已显示 "+(BASE.length-S.deleted.length)+" 个 · 公网 "+liveN+" 个 · 编辑仅存本机浏览器";
 // 恢复区
 const del=S.deleted.map(id=>'<a onclick="restore(\''+id+'\')">'+byId(id).name+'</a>').join(" 、 ");
 document.getElementById("restore").innerHTML=S.deleted.length?'<div>已删除：'+del+' （点击恢复）</div>':'';
}
function card(b,i,vis,live){
 const nm=S.renames[b.id]||b.name;
 const note=S.notes[b.id]||"";
 const cls=statusCls(b);
 const up=i>0?'<button onclick="mv('+i+',-1)">↑</button>':'<button disabled>↑</button>';
 const dn=i<vis.length-1?'<button onclick="mv('+i+',1)">↓</button>':'<button disabled>↓</button>';
 const isRepo=/^https:\/\/github\.com/.test(b.url);
 const link=isRepo?'<a href="'+b.url+'" target="_blank">'+b.url+'</a>':'<a href="'+b.url+'" target="_blank">'+b.url+'</a>';
 return '<div class="card">'+
   '<div class="top"><div><div class="nm">'+nm+'</div>'+
   '<div class="tags"><span class="tag '+(live?'gp':'lo')+'">'+b.plat+'</span><span class="tag '+cls+'">'+b.status+'</span></div></div>'+
   '<div class="mv">'+up+dn+'</div></div>'+
   '<div class="url">'+link+'</div>'+
   '<div class="meta">部署：'+b.date+' ｜ 来源会话：'+b.session+'</div>'+
   '<div class="desc">'+b.desc+'</div>'+
   '<div class="note '+(note?'show':'')+'" id="note_'+b.id+'">'+(note?('📝 '+note):'')+'</div>'+
   '<div class="ops"><button onclick="rn(\''+b.id+'\')">重命名</button>'+
   '<button onclick="nt(\''+b.id+'\')">备注</button>'+
   '<button class="dg" onclick="del(\''+b.id+'\')">删除</button></div>'+
   '</div>';
}
function rn(id){const v=prompt("重命名为：",S.renames[id]||byId(id).name);if(v!==null){S.renames[id]=v.trim()||byId(id).name;save();render()}}
function nt(id){const v=prompt("添加备注：",S.notes[id]||"");if(v!==null){S.notes[id]=v.trim();save();render()}}
function del(id){if(confirm("删除「"+byId(id).name+'」？可在底部恢复')){S.deleted.push(id);save();render()}}
function restore(id){S.deleted=S.deleted.filter(x=>x!==id);save();render()}
function mv(i,d){const a=S.order.slice();const j=i+d;if(j<0||j>=a.length)return;const t=a[i];a[i]=a[j];a[j]=t;S.order=a;save();render()}
render();
</script>

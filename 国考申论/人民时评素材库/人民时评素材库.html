*{box-sizing:border-box;margin:0;padding:0}

header{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,#9b2c2c,#c0392b);color:#fff;padding:14px 22px;box-shadow:0 2px 8px rgba(0,0,0,.15)}

nav .tlink{display:flex;justify-content:space-between;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13px}
nav .tlink:hover{background:var(--red-soft)}
nav .tlink.on{background:var(--red-soft);color:var(--accent);font-weight:700}

.card .bd .lab{font-weight:700;color:var(--accent);margin-top:6px}
.card .bd ul{margin:2px 0 2px 18px}
.card .bd li{padding:2px 0;line-height:1.78}
mark{background:var(--hl);padding:0 2px;border-radius:2px}

.subj{font-size:12.5px;color:var(--sub);margin:-6px 0 10px 14px}
.empty{text-align:center;color:var(--sub);padding:60px 0}
#top{position:fixed;right:26px;bottom:26px;width:40px;height:40px;border-radius:50%;background:var(--red);color:#fff;border:none;cursor:pointer;font-size:18px;box-shadow:0 3px 10px rgba(0,0,0,.25);display:none}
.yearchips{display:flex;gap:4px;flex-wrap:wrap}
.yearchips button{border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;border-radius:14px;padding:4px 10px;font-size:12px;cursor:pointer}
.yearchips button.on{background:#fff;color:var(--red);font-weight:700;border-color:#fff}
.kw{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;background:var(--blue-soft);color:#4338ca;margin:2px 3px 0 0}

.tabs{display:flex;gap:0;background:var(--bg);padding:10px 22px 0;position:sticky;top:0;z-index:9;border-bottom:1px solid var(--line)}

.tabs button:last-child{border-radius:0 8px 0 0}
.tabs button.on{background:var(--red);color:#fff;border-color:var(--red)}
.subnav{display:flex;gap:6px;flex-wrap:wrap;padding:8px 22px;background:var(--bg)}
.subnav button{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:5px 14px;font-size:12.5px;cursor:pointer;color:var(--sub)}
.subnav button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.aggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.agcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}

      "depth": "full",
      "tiYan": "宜宾从“化工围江”蝶变为动力电池高地，题眼在“区域协同”——各地唯有融入国家区域发展战略、在战略叠加中捕捉机遇，才能走出差异化发展之路、积累发展胜势。",
      "guJia": [

        "第二层·区域协调加速要素流通，为创新聚合势能：长三角一体化之于长江经济带，G60科创走廊打造创新策源地，形成“研发在长三角、转化在长江经济带”格局，各美其美、美美与共。",

      "title": "将“就业友好”融入发展过程",
      "url": "https://opinion.people.com.cn/n1/2026/0722/c461529-40765326.html",

      ],
      "depth": "full",
      "tiYan": "把“就业友好”理念嵌入发展全过程，题眼在“政策取向一致性”——管产业就要管就业、上项目就要扩就业，让高质量发展与高质量充分就业同频共振。",
      "guJia": [
        "引题立论：就业是民生之本，习近平总书记强调“构建就业友好型发展方式”，设问如何把理念落到发展实际。",
        "第一层·嵌入决策全过程：湖南印发稳岗扩容提质措施，深化就业影响评估机制，全年就业政策一致性评价不少于500件次，实现产业升级与劳动力转岗平稳过渡。",
        "第二层·剖析结构性矛盾根源：“有活没人干”与“有人没活干”并存，症结在产业规划与教育布局、就业安排未能统筹。",
        "第三层·树立硬约束标尺：浙江天台重大项目就业影响评估让决策有“含岗量”硬标尺；贵州“六六就业稳岗计划”促目标深度融合，从决策把关到精准服务再到制度创新。",
        "第四层·政策协调联动：宏观政策是财政、货币、就业、产业、区域、科技、环保的复杂体系，需投资政策投资于人、财政政策补贴减税激励民企吸纳、科技领域推广“科技成果+创业”。",
        "结尾升华：“就业是家事，更是国事”，增强宏观政策取向一致性，是塑造中国经济新优势的必然要求。"
      ],
      "jieWei": "增强宏观政策取向一致性和有效性，让产业转型升级与就业扩容提质互促共进，让高质量发展与高质量充分就业同频共振，这是塑造中国经济新优势的必然要求。",
      "jinJu": [
        "管产业就要管就业、促消费就要促就业、上项目就要扩就业。",
        "就业是家事，更是国事。",
        "确保各类政策相互衔接、有机统一，是提升宏观经济治理效能的题中应有之义。",
        "让高质量发展与高质量充分就业同频共振。",
        "使就业优先成为“硬约束”，让经济增长始终蕴含“就业友好”的温度。"

      "depth": "full",
      "tiYan": "“车大位小”、AI智能体权责边界、预制菜争议等热点串起同一命题——新技术新业态层出不穷，须以治理效能更好激发创新效益，用预见性、精准度、“小快灵”让制度既兜住底线又拓宽空间。",

        "分论点一·增强预见性，既兜住底线又拓宽空间：针对动力电池规模化退役，国家有关部门早有预判、前瞻制定国家标准，引导易拆解易回收的产品设计；登高望远、下好先手棋。",
        "分论点二·提高精准度，既“管得好”又“放得活”：AI拟人化互动服务采取包容审慎、分类分级监管，划红线严禁危害国家安全内容，也为文化、养老等民生领域留探索空间；因地制宜不搞“一刀切”，兼顾制度刚性与弹性。",

      "title": "在重拾耕读中感悟知行合一",

      "tiYan": "从高校重拾耕读传统切入，论述唯有\"耕\"与\"读\"相贯通，才能让年轻人在实践中体悟知行合一。",
      "guJia": [
        "现象+设问：清华、北大、中央民族大学等高校耕读实践悄然流行，引出\"现代大学教育为何要重拾耕读\"，点破知识获取依赖屏幕、知识与体验割裂的现代教育共性问题。",
        "正面立论：耕读回归补上\"脚踏实地\"这一课——民大学生下田摘毛豆、北大学生种植物遇大风\"只能重新来过\"，庄稼不等人的道理到泥土中一学就会。",
        "递进深化：耕读不能仅停留在体验农活，\"耕\"与\"读\"相贯通才能凸显价值——清华马院小凉山茶园白天采茶、晚上研读《摆脱贫困》，让书本理论与脚下土地对接。",
        "反面警示+落脚：警惕一两天参观、拍照打卡、今天摘茶明天插秧的浮光掠影，\"深度比广度更重要\"；评价标尺不在学分多少，而在能否重建自我与脚下土地的联系，升华至知行合一。"
      ],
      "jieWei": "\"耕读传家\"本质上体现着知行合一理念，创设条件、完善机制、突出实效，让学生在田地感受四季轮回更替、在村庄读懂时代变迁，耕读教育的价值与潜力难以估量。",
      "jinJu": [
        "耕读传家久，诗书继世长。",
        "知识与体验割裂开来，无异于让人在\"空中楼阁\"学习世界如何运转。",
        "和土地、人民相联系的学术研究才更有生命力。",
        "让年轻人在弯腰与抬头之间，在内心重建自我和脚下土地的联系。"
      ],
      "zhengLun": [

      "id": "rmsp_2026-05-20_xiaodian",
      "title": "给小店支招，护市井烟火",
      "url": "https://opinion.people.com.cn/n1/2026/0520/c461529-40723222.html",
      "date": "2026-05-20",
      "author": "人民时评",
      "column": "人民时评",
      "themes": [
        "民生保障与共同富裕",
        "改革开放与新发展格局"
      ],
      "depth": "full",
      "tiYan": "“小店支招人”新业态兴起，折射小微经营主体的现实需求——以专业赋能与系统扶持提升小店续航力，守护市井烟火气。",
      "guJia": [
        "现象切入：各大平台“小店支招人”通过直播连麦、线上卖课为街边小店“在线把脉、开方支招”，轻量化商务咨询十分接地气。",
        "背景分析：创业图景更加多元，“一人公司”“超级个体”涌现，动机分谋生型、体验型、兴趣驱动型；但经营是需要系统能力的行当，小本经营抗风险能力低、试错机会少。",
        "设问过渡：“如何提升小店的续航力，更好守护市井烟火气？”",
        "对策一：以专业赋能锻长板、补短板——采购成本高、融资难、数字化能力弱等短板需低成本、轻量级的外部支持，平台机构是重要赋能者。",
        "对策二：以系统扶持增活力、挖潜力——从准入监管、金融服务、生态培育等方面系统布局，构建长效发展支持体系。",
        "辩证辨析：优胜劣汰是市场基本法则，扶持小店并非阻止淘汰，而在于帮助其适应现代商业生态。",
        "升华收束：小店是优化供需、畅通循环的经济细胞，也是互相守望的生活节点，扶持即守护商业生态多样性。"
      ],
      "jieWei": "便民小生意，发展大活力。扶持小店，就是守护商业生态的多样性；活跃小店，就是点亮热气腾腾的生活。",
      "jinJu": [
        "便民小生意，发展大活力。",
        "街道上的小店，是优化供需、畅通循环的经济细胞，也是一个个持续在场、互相守望的生活节点。",
        "扶持它们，就是守护商业生态的多样性；活跃它们，就是点亮热气腾腾的生活。",
        "扶持小店，并非阻止淘汰，而在于帮助它们更好地适应现代商业生态，让更多有潜力的经营者在公平竞争中脱颖而出。",
        "这是一个专业化赛道，而不是博流量的舞台。"

      "tiYan": "“中国式安全感”海外圈粉，源于制度、成于治理、根植民心，本质上是一种深植于发展与信任的安全感。",

        "维度二（开放）：聚四海之气借八方之力，越开放越能实现“从0到1”突破，嫦娥六号、中国环流三号国际参与。",
        "维度三（协同）：推动科技与产业创新融合，“核心城市研发、周边城市转化”，京津冀案例。",

      "themes": [
        "民生保障与共同富裕"
      ],
      "depth": "full",
      "tiYan": "以'医保目录药品仅占2%'谣言被澄清为引，论医保'保基本'宗旨与以有限资源最大程度守护生命健康的制度逻辑，须健全多层次医疗保障体系。",
      "guJia": [

        "立论：医保是三重保障框架，'保基本'是基金可持续基础，须加大政策宣传解读。",
        "扩容：连续多年目录调整新增835种药，肿瘤/罕见病/儿童用药持续优化。",

        "挑战：老龄化与医疗革新下张力凸显，须构建多层次医疗保障体系。",
        "结尾升华：保障基本、合理筹资、稳健运行，让商业保险等各显其能守护14亿人健康。"
      ],
      "jieWei": "让基本医保守住'保基本'的安全线，让商业保险、个人自付、慈善等各显其能，才是对14亿多人生命健康最负责任的制度安排。改革仍在路上，奋力解除全体人民疾病医疗后顾之忧。",
      "jinJu": [
        "保基本，是医保基金可持续运行、医保制度可持续发展的基础。",
        "每一分钱都想着买最多的健康，而不是买最贵的药。",
        "在发展中保障和改善民生，坚持尽力而为、量力而行。",
        "以有限资源最大程度守护生命健康。"
      ],
      "zhengLun": [
        "数据论证：医保目录3159种药约占全国市场63%（非2%）；国家医保局成立后新增835种药进目录。",

      "url": "https://opinion.people.com.cn/n1/2025/1107/c1003-40598515.html",
      "date": "2025-11-07",
      "author": "人民时评",
      "column": "人民时评",
      "themes": [
        "基层治理与社会治理",
        "改革开放与新发展格局"
      ],
      "depth": "full",
      "tiYan": "以尊湃侵犯华为海思商业秘密案为引，论证保护商业秘密不是企业“私事”而是关系营商环境、创新生态、发展安全的“公事”，是“统筹发展与安全、优化营商环境”的申论命题。",
      "guJia": [
        "案例引入：上海三中院一审宣判尊湃侵犯华为海思芯片技术商业秘密案，14人获刑、罚金1350万元，筑牢保护网适逢其时。",
        "重要性（统筹发展安全）：商业秘密深度融入企业全链条，侵犯会抑制创新活力、破坏公平竞争环境、阻碍高质量发展。",
        "定性（公私之辩）：保护商业秘密不是企业“私事”，而是关系营商环境、创新生态、发展安全的“公事”。",
        "体系（三位一体）：建立健全自我保护、行政保护、司法保护一体的保护体系（2024年查办143件、建近3万服务站点）。",
        "主体（企业防线）：企业是第一道防线，在人员管理、技术创新、信息流通、保密教育全链条管理（苏州企业定密分级）。",
        "协同（多方共治）：长三角联盟、天津“区块链存证+保险”等放大多主体协同效能；制度创新驱动创新补齐短板。",
        "升华：保护商业秘密就是爱护创新火种，形成政府社会企业多方共治合力。"
      ],
      "keTaoKuangJia": "案例引入（司法判决）→ 论证重要性（统筹发展安全）→ 定性公私之辩 → 体系（三位一体）+ 企业防线 + 多方协同 → 升华爱护创新火种。",
      "jieWei": "保护商业秘密，就是爱护创新火种。形成政府、社会、企业多方参与的共治合力，推动企业创新与经济社会高质量发展更好同频共振，这是以新安全格局保障新发展格局的题中应有之义。",
      "zhengLun": [
        "举例论证：尊湃侵犯华为海思芯片技术商业秘密案（14人获刑、罚金1350万）；苏州企业定密分级管理；长三角智能制造业商业秘密保护联盟；天津南开“区块链存证+商业秘密保险”。",
        "数据论证：2024年市场监管总局查办侵犯商业秘密案件143件；全国已建商业秘密保护服务站点近3万个。",
        "道理论证：“在发展中固安全，在安全中谋发展”“保护商业秘密不是企业的‘私事’，而是关系营商环境、创新生态、发展安全的‘公事’”。",
        "引用论断：“法治是最好的营商环境”“以新安全格局保障新发展格局”。"

      "title": "清单“瘦身”能带来什么",
      "url": "https://opinion.people.com.cn/n1/2025/0514/c1003-40479111.html",

      "tiYan": "市场准入负面清单从117项缩减至106项，以“非禁即入”释放活力、带来机遇、提振信心，彰显破除准入壁垒的改革决心，进一步释放超大规模市场的创新创造潜力。",
      "guJia": [

        "清单之变：《市场准入负面清单（2025年版）》事项由117项缩减至106项，“一张清单”是观察全面深化改革的窗口。",

        "带来机遇：破解民企“看到政策无法享受”等困境，让民企有规则“融入”广阔市场。",

      "jinJu": [
        "一张清单，就是一扇观察进一步全面深化改革的窗口。",

    {
      "id": "rmsp_2025-05-13_jiegan",
      "title": "“秸”尽其用折射现代农业密码",
      "url": "https://opinion.people.com.cn/n1/2025/0513/c1003-40478344.html",
      "date": "2025-05-13",
      "author": "人民时评",
      "column": "人民时评",
      "themes": [
        "乡村振兴与三农",
        "生态文明与绿色发展"
      ],
      "depth": "full",
      "tiYan": "秸秆从“一烧了之”到“秸”尽其用，背后是发展理念的深刻转变、科技创新的支撑、国家政策的精准引导与农业产业体系的坚实托举，折射现代农业循环产业体系升级的密码。",
      "guJia": [
        "数据底气：全国秸秆产生量8.67亿吨、可收集7.33亿吨、综合利用率达88.3%。",
        "科学还田：加装粉碎抛撒装置配合旋耕深翻，秸秆变滋养土地的有机肥，提升耕地有机质与保水保肥能力。",
        "饲料化利用：青贮秸秆成牛羊“压缩饼干”，年利用量1.73亿吨、利用率年升2个百分点，降本增效、农牧结合。",
        "能源与基料：打捆直燃、热解气化、沼气成清洁能源契合“双碳”；作培养基种食用菌“点草成金”，拓展产业链。",
        "体系升级：秸秆利用贯穿生产加工能源环保多环节，形成绿色循环产业链，是农业产业体系升级的生动体现。",
        "政策护航：《加快建设农业强国规划》提全链条升级；今年中央一号文件支持秸秆综合利用，目标从“能用”到“好用”到“高值化利用”。"
      ],
      "jieWei": "从“能用”到“好用”，再到“高值化利用”，秸秆的“七十二变”还将继续上演。有理由相信，只要我们持续探索、久久为功，就一定能让每一株秸秆都物尽其用，让广袤的田野持续焕发出勃勃生机，为农业强国建设奠定坚实基础。",
      "jinJu": [
        "秸秆是粮食生产的废弃物，还是放错了地方的资源——这个问题有了新答案。",
        "从“一烧了之”到“秸”尽其用，这一变化的背后，有发展理念的深刻转变，有科技创新的有力支撑，更有国家政策的精准引导和农业产业体系的坚实托举。",
        "秸秆化作牲畜“口粮”，助力畜牧业降本增效，这种“农牧结合、种养循环”的模式，正是现代生态农业的题中应有之义。",
        "农业的未来，正在于不断健全现代农业产业体系。"

        "本质定位：文物核心价值在以物证史、以物叙史，讲解服务不是简单知识服务，而承担筑牢历史记忆、传承文化的重任。",
        "属性之辨：讲解兼具经济与文化属性，以文化人、以文育人、以文聚力、以文兴业的文化属性是根基，脱离根基产业难做强。",

      ],
      "jieWei": "守护文化根基，摒弃功利浮躁，以制度刚性守住历史底线，以人文温度激活文化肌理，才能让文博解说和景区讲解成为连接古今的纽带，让“文博热”真正成为凸显文化自信、彰显文化自强的生动注脚。当游客不再仅仅满足于“听段子、拍照片”，文物便能够从“橱窗标本”化作“精神原乡”。",

      "guJia": [

        "成长密码：开放激发后发优势（桑塔纳国产、合资产业链），创新支撑换道超车（三电、激光雷达、混动），从跟随到领跑。",

      "title": "投资于人，促高质量充分就业",
      "url": "https://opinion.people.com.cn/n1/2025/0429/c1003-40470344.html",
      "date": "2025-04-29",
      "author": "人民时评",
      "column": "人民时评",
      "themes": [
        "民生保障与共同富裕",
        "高质量发展"
      ],
      "depth": "full",
      "tiYan": "推动更多资金资源“投资于人”、服务于民生，让就业政策服务与人的需求直接挂钩，提升劳动者素质、保障人的尊严，形成经济发展与民生改善良性循环。",
      "guJia": [
        "场景切入：堂弟大学毕业感慨就业不易但服务到位、岗位精准推送暖心；“金三银四”是就业窗口期。",
        "数据底气：一季度3月全国城镇调查失业率5.2%、环比降0.2个百分点，就业平稳向好离不开精准服务。",
        "供需匹配：每年新增千万人就业，须提升就业政策体系整体效能，让人培与社会需求交集更大、对接成本更低。",
        "政策导向：今年政府工作报告提“推动更多资金资源投资于人、服务于民生”；人社部财政部推“岗位需求+技能培训+技能评价+就业服务”四位一体项目化培训。",
        "系统思维：针对康养托育、先进制造、现代服务、新职业等重点领域授之以渔、以技赋能。",
        "政策温度：陕西宝鸡总工会把“劳动法律监督服务岗亭”搬招聘会现场，靠前主动服务减少劳动争议。",
        "升华：加大力度投资于人关乎当下生活、更为未来储备潜力，让人的全面发展与高质量发展同频共振。"
      ],
      "jieWei": "就业是最大的民生。随着经济社会发展，加大力度“投资于人”，不仅关乎当下群众生活，更是在为未来储备发展潜力。进一步聚焦群众需求，完善配套政策，加大各类资金资源统筹支持力度，定能不断拓宽就业渠道、提高就业质量，让人的全面发展与经济社会高质量发展同频共振。",
      "jinJu": [
        "提升就业服务质量，需要让就业政策、服务与人的需求直接挂钩，提高资金资源使用效率，不断提升劳动者素质，更好保障人的尊严，创造更多发展机会，形成经济发展和民生改善的良性循环。",
        "促就业，归根结底是让需要找工作的人与需要找人的工作匹配起来。",

      "tiYan": "破解高校毕业生就业难题，须全链条优化培养供给与就业服务、适度前瞻，以实招细招促进人才供需适配，让“学有所成”迈向“业有所就”。",

      "title": "“冷门”“热门”辩证看",
      "url": "https://opinion.people.com.cn/n1/2026/0731/c461529-40771231.html",
      "date": "2026-07-31",
      "author": "人民时评",
      "column": "人民时评",
      "themes": [
        "高质量发展"
      ],
      "depth": "full",
      "tiYan": "一些曾被视为“冷门”的学科正被重新认识甚至备受追捧，折射学科交叉融合、社会人才需求变化与长期主义价值的回归。",
      "guJia": [
        "国家与社会对人才的需求变了——端牢饭碗、盐碱地利用、极端天气应对等课题，把实验室与生产一线连在一起，让“冷门”专业价值可感可知（农学、地质、考古、测绘皆然）。",
        "学科交叉融合加速，边界模糊、关联变高——农业×机器人→智能农机，生物×信息→智慧育种，渔业×数字→智能监测，拓展了传统学科用武之地。",
        "专业劳动被更多人看见——田间试验视频、文物修复直播、深海科考连线，把“冷门”成果带到公众眼前，揭示其知识价值与社会价值。",
        "从“冷门”到“热门”需理性看待——基础训练不能省，不能只用就业薪资标价，要看知识厚度与科学内涵，坚持长期主义、抑制功利思维。"
      ],
      "jieWei": "学科有冷热，职业有分工，但求真务实是每个奋斗者的必备品格。真正托举一个行业的，从来不是一阵热搜，而是一代代人把“冷板凳”坐热、把寻常事做深。",
      "jinJu": [
        "真正托举一个行业的，从来不是一阵热搜，而是一代代人把“冷板凳”坐热、把寻常事做深。",
        "没有“冷门”时期的甘于清苦，便没有“热门”时期的万众瞩目。",
        "一门学问的价值高低，并非由就业薪资、行业前景简单标价，而需要由其知识厚度、科学内涵来准确定义。",
        "守护“冷门”学问的沉静底色，亟须我们抑制功利思维、坚持长期主义。"
      ],
      "zhengLun": [
        "数据论证：84.8%感觉涉农专业看法改观，83.2%认为智慧农业提升报考意愿；农用无人机年作业面积破4.6亿亩，自主选育品种占比超95%，农业科技进步贡献率超64%。",

      "id": "rmsp_2026-07-22_chengshigengxin",
      "title": "壹时评：把“人”写进城市更新的每一个细节",
      "url": "http://opinion.people.com.cn/n1/2026/0722/c223228-40766015.html",
      "date": "2026-07-22",
      "author": "壹时评",
      "column": "壹时评",
      "themes": [
        "基层治理与社会治理",
        "民生保障与共同富裕"
      ],
      "depth": "full",
      "tiYan": "题眼在“人”与“细节”——以“微改造、微更新”为切口，论证城市发展从“大拆大建”转向以人为本的内涵式发展。",
      "guJia": [
        "现象开篇：地铁站化身活力驿站、老旧厂区变文化打卡地、畸零地块蝶变口袋公园，“微改造、微更新”风靡各地。",
        "背景分析：开发边界收紧、土地红利收窄，“摊大饼”式扩围难以为继，下足绣花功夫、在存量中挖掘增量成为必由之路。",
        "分论一，城市空间妙用蕴藏高质量发展的逻辑：从“工程师思维”转向“园艺师思维”，成都、重庆、南京三例佐证挖潜增效。",
        "分论二，城市空间妙用彰显以人民为中心的思想：一方面精准对接“急难愁盼”，另一方面传承城市文脉、活化历史建筑。",
        "分论三，微更新是社会治理模式创新：从“干部干、群众看”到“群众点单、政府上菜”，再到多元主体共建共治。",
        "结尾回扣题眼：方寸天地大有可为，把“人”写进更新的每一个细节。"
      ],
      "jieWei": "以一处处微小改造织补城市肌理，把“人”写进更新的每一个细节，方能持续提升城市的宜居度与生命力，让城市真正成为人民群众高品质生活的空间。",
      "jinJu": [
        "围棋有“金角银边”之说，没有绝对无用的空间，只有放错位置的棋子。",
        "从追求规模的“工程师思维”转向讲究精细的“园艺师思维”。",
        "从“干部干、群众看”到“群众点单、政府上菜”。",
        "下足绣花功夫，在存量中挖掘增量。",
        "方寸天地，大有可为。"
      ],
      "zhengLun": [
        "比喻论证：以围棋“金角银边”喻城市空间无绝对无用；以“工程师思维”与“园艺师思维”喻发展方式之变。",
        "事例论证：成都立交桥下闲置空间变篮球公园、重庆塔坪小区“飞线下地”打造青年文创街、南京小西湖片区渐进式微更新。",
        "事例论证：福州三坊七巷、北京白塔寺周边修旧如旧，让历史建筑在活化利用中重现活力。",
        "对比论证：“大拆大建”的粗放扩张 vs 质量优先、以人为本的内涵式发展。",
        "递进论证：物理空间改造→民生需求回应→社会治理模式创新，层层升维。"
      ],
      "keTaoKuangJia": "现象—背景—双维论证—治理升维—升华式：摆热点现象→析转型背景→分论“发展逻辑”与“人民立场”两个维度→升维到治理创新→回扣题眼收尾。城市治理、民生类题目通用。",

      "tiYan": "题眼在“围猎场”三字——剑指APP以福利券诱导借贷的营销套路，呼吁线上信贷回归客观、审慎、透明。",
      "guJia": [
        "现象开篇：领小额立减券、兑换视频会员看似福利，背后却是贷款导流套路，抖音、美团、爱奇艺等平台被媒体曝光。",
        "先立后破：合规信贷产品与适度推介有助于提升消费便利度，但不能走向“凡支付必植入贷款、凡福利必捆绑借贷”的极端。",

        "亮出新规：8月1日施行《个人贷款业务明示综合融资成本规定》、9月30日施行《金融产品网络营销管理办法》，直指痛点。",
        "开出药方：平台守住合规底线、监管专项排查整治、畅通投诉举报、加大处罚，构建全链条闭环治理格局。",
        "结尾辩证收束：规范不是否定消费金融价值，而是约束急功近利的诱导套路。"
      ],
      "jieWei": "规范线上信贷营销绝不是否定消费金融的价值，而是约束急功近利的诱导套路；惟有平台合规运作、消费者提高警惕，才能守护好群众钱包与个人信用，促进网上信贷服务健康发展。",
      "jinJu": [
        "不能走向“凡支付必植入贷款、凡福利必捆绑借贷”的极端。",

        "政策论证：8月1日实施的《个人贷款业务明示综合融资成本规定》要求向借款人展示综合融资成本明示表。",

        "自惊艳全球的《哪吒之魔童闹海》以后，中国能否再出更多类似的爆款作品，影迷极为关注。比爆款何时问世更值得关注的话题，是加快推进国产动画产业的精品化、协作化、智能化，努力走出一条“高原”耸起、“高峰”林立的自主创新之路。这不仅是文化产业升级的必然选择，也是推动中华优秀传统文化创造性转化、创新性发展的实践要求。",
        "精品化是国产动画的生命线。唯有内容精良、制作考究的精品，才能收获票房与口碑的双赢。",
        "从暑期档影片看，《八仙！》刻画8个有私欲、有缺点的市井小人物，重新定义“仙”的内涵：不是刀枪不入、长生不老，而是心怀苍生、坚守善良。类似作品深入提炼传统文化中的哲思与情感精髓，用动画语言真诚探讨爱、成长、勇气等命题，受到观众青睐。",
        "创造性改编传统题材故事，让经典元素同当代生活相连接；以三维渲染叠加手绘笔触，营造东方美学特效；探索使用混合媒介，依靠声场变化提升观众体验；复刻真人电影长焦景深、虚实镜头语言……坚持精品化，意味着在剧本创意、制作技术及文化内涵上精耕细作、拒绝浮躁。精品化走深走实，文化出海将水到渠成。",
        "如果说精品化回答了“做什么”，那么协作化回答的就是“怎么做”。通过跨团队协同、上下游资源联动，整合导演、美术、技术、音效多方力量，建立高效分工与共创机制，精彩创意才能落地，进而转化为市场效益。",
        "在产业一线，“10分钟协作圈”正成为现实。以四川成都高新区天府长岛数字文创园为例，集聚数十家动画创作及数字视效企业，从创意策划到后期配音的全流程均可在园区内高效协同完成。把分散的创作力量拧成一股绳，构建起覆盖全链条的协同生产体系，国产动画才能告别“爆款靠运气”。",
        "国产动画能否弯道超车，除了增进精品化的追求、打造标准化的流程，还需激活智能化的引擎。",
        "当下，超七成动漫头部企业已引入AI（人工智能），技术覆盖剧本生成、概念设计、角色建模、特效合成等全环节。2026年全网上线AI微短剧已超20万部。多模态视频模型持续迭代，在角色一致性、音画同步能力上实现明显突破。从辅助工具到全流程赋能，智能化的落地，有助于让创作者从重复劳动中解放出来，将更多精力倾注于叙事打磨与美学创新。",
        "站在当下回望，国产动画的崛起绝非偶然。从拿来主义走向文化自信自强，从人力密集模式迈向技术驱动创新，国产动画向着极致视觉美感、成熟叙事表达与深厚艺术质感持续进阶，探索出的必是体现中国审美的产业路径和发展逻辑。",
        "有理由相信，国产动画的下一场“闹海”，就在不远的未来。",
        "分享让更多人看到"
      ]
    },
    {
      "id": "rmsp_20260805_无边剧场为民现场",
      "title": "“无边”剧场  为民“现场”",
      "url": "https://opinion.people.com.cn/n1/2026/0805/c461529-40773944.html",
      "date": "2026-08-05",
      "author": "人民时评",
      "column": "人民时评",
      "themes": [
        "高质量发展"
      ],
      "depth": "index",
      "tiYan": "（待 AI 五步拆解）",
      "body": [
        "点击播报本文，约",
        "从街头剧到直播间，剧场物理形态在变，但文艺与人民的关系始终不变。演员在场、观众在线，有连接、有共鸣，生活的艺术融入了艺术的生活",
        "不少短视频用户发现，“团播”最近变了。",
        "昆曲水磨调婉转低回，国风舞袖飒爽利落，舞剧《只此青绿》的“青绿腰”在竖屏中舒展，《醒·狮》的刚劲舞步在方寸间跃动……专业文艺院团纷纷“下场”，让直播领域的“团播”赛道迎来一股清流。",
        "“团播”，是指以团队化运营方式开展的直播形态。据统计，截至今年5月，全国已有576家国有文艺院团入驻头部短视频平台，累计开播超106万场。专业文艺院团开辟“云端”剧场，延伸“第二舞台”，以专业编导、运镜、灯光对经典剧目进行呈现，观众不用去剧场，就能获得良好的观赏体验。这是演艺行业对新业态的主动拥抱，也是对“人民需要文艺，文艺需要人民”的生动践行。",
        "过去，《黄河大合唱》在延安窑洞里唱响，抗战时期街头剧《放下你的鞭子》随时随地开演，观众在哪里，舞台就在哪里。如今，数字技术打破了传统剧场的时空边界，文艺从未像现在这样如此便捷地触达众多观众。通勤路上、闲暇时刻，刷到就进来、爱看就留下，生活现场处处有文艺。无论是土地里长出的歌声、生活中浓缩的诗句，还是专业人士的呕心力作，伴随亿万用户的指尖滑动，成就的都是文艺为民的“现场”。",
        "文艺“专业队”开“团播”，正重塑文化供给与消费模式。镜头放大了表演的颗粒感，弹幕拉近了观演距离，好作品的呈现方式变多了。在江苏省歌剧舞剧院，文艺工作者对原创舞蹈诗《水墨江南》按照竖屏传播规律重新编排；在浙江歌舞剧院，“浙里知时节”创造性展现西湖水的“柔”与钱塘江的“刚”，方寸屏幕拥有了不一般的格调。",
        "文艺与技术的融合，也让演艺行业能更好满足群众需求。透过直播镜头，演员把后台搬到前台，增加讲解和导赏，曲高不再和寡。文艺院团带来优质内容，提高了“团播”赛道的内容水准，吸引了线下的潜在观众。高雅艺术搭乘数字技术“飞入寻常百姓家”，“线上破圈”便会和“线下落地”形成互补。据了解，陕西省歌舞剧院的“团播”带动线下票房增长约10%，江苏省歌剧舞剧院今年“五一”假期的线下门票直接售罄。",
        "手机屏幕虽小，“云端”剧场却可以很大。2022年，北京人民艺术剧院建院70年纪念版《茶馆》曾试水开通高清实时直播，创下5000万人次在线观看纪录。“十五五”规划纲要提出，发展线上演播等新型文化业态。日新月异的时代为文艺工作者创造出一个又一个“无边”的剧场，推动优质文化资源抵达更多受众。",
        "作为新生事物，“团播”也需警惕内容风险。今年1月，中国演出行业协会发布《网络表演团体直播运营管理要求》。中央网信办不久前启动“清朗·网络娱乐团播乱象整治”专项行动，剑指低俗内容、诱导打赏等问题。这提醒跃跃欲试的入场者，守标准、练内功，才能跑通“专业输出—流量转化—价值增值”的链条。",
        "从街头剧到直播间，剧场物理形态在变，但文艺与人民的关系始终不变。演员在场、观众在线，有连接、有共鸣，生活的艺术融入了艺术的生活。我们期待，每一个“云端”剧场，都能让文艺更接地气，让人民群众文化生活更加丰富、精神世界更加充盈。",
        "分享让更多人看到"
      ]

      "body": [
        "点击播报本文，约",
        "随着新经济组织、新社会组织大量涌现，以平台经济为代表的新业态蓬勃兴起，新就业形态劳动者规模持续扩大。在新兴领域把党的组织建起来、把党的工作做深入、把治理效能提上来，成为紧迫任务。",
        "比如，聚焦快递物流、网约车等细分领域，实现从“党建空白”到“行业党组织”的跨越；摸排、归队流动党员，组建流动党员党支部，实现“党员流动不流失、管理不断档”；打造党建指导站、设立党建指导员，把关爱服务、权益保障等纳入社会工作内容……",
        "增强党组织在新兴领域的号召力凝聚力影响力，不仅能引领带动新经济、新行业健康发展，更能为做好社会工作、强化社会治理提供“定盘星”与“主动力”。",
        "《关于加强新时代社会工作的意见》提出：“加强新兴领域党的建设。推动党的组织覆盖和工作覆盖有形有效。”党建工作做实了就是战斗力，做细了就是凝聚力。",
        "织密服务网络，让“流动的人”找到“温暖的家”。新就业群体流动性强、工作节奏快，传统的组织覆盖方式难以奏效。破题之道在于，先把服务做到位，再把党建带起来。",
        "在河南南阳市，当地依托暖“新”驿站为快递员、网约车司机等提供各类服务，并构建三级党组织架构，让流动党员找到组织归属。当党组织的关怀化作日常的温暖，新就业群体从“过客”变为“自家亲人”，政治引领与为民服务就此实现深度融合。",
        "激活参与意识，让“治理末梢”变“前哨力量”。新就业群体熟悉社情，是社会治理天然的“流动网格员”。将党组织的引领作用嵌入这一群体，不仅能让他们感受到“家”的温暖，更能引导他们有序参与治理，实现个体价值与社会价值的统一。",
        "在山西右玉县，快递员、外卖骑手多了“流动网格员”的身份，通过“随手拍”上报路面破损、安全隐患等问题，与职能部门形成快速响应闭环。当新就业群体从单纯的服务对象转变为治理的参与力量，城市治理的感知触角便能更加灵敏。",
        "点燃红色引擎，让“社会组织”成为“共治增量”。加强新经济组织、新社会组织的党建工作，核心在于以党组织为纽带，将各类组织的专业优势转化为服务群众的实际效能。",
        "安徽合肥市社会组织综合党委从破解“规模小、党员少、流动性大”等问题入手，在社区治理中搭建“网格员点单、孵化园派单、社会组织接单”的服务模式。党建引领让社会组织有了“主心骨”，有助于它们在共建共治共享中找准定位、彰显价值。",
        "党建下沉到社会组织，全面从严治党各项工作需同步强化。新兴领域党组织覆盖点多面广、工作对象复杂，权力监督必须同步跟上。山东滨州市将新兴领域党建工作纳入市委重点工作调度、巡察监督体系，推动责任层层传导。以制度刚性倒逼责任落实，让社会工作在阳光下运行，党的领导的政治优势在新兴领域得到更好彰显。",
        "新兴领域党建是一项系统工程，意味着必须提高在复杂社会环境下做群众工作的能力和水平。坚持党建引领社会工作，以服务凝聚人心，以引导激发活力，新兴领域将为中国式现代化贡献更多正能量。",

    {
      "id": "rmsp_20260811_读懂文物微笑背后",
      "title": "读懂“文物微笑”背后的意涵",
      "url": "https://opinion.people.com.cn/n1/2026/0811/c461529-40777126.html",
      "date": "2026-08-11",
      "author": "人民时评",
      "column": "人民时评",
      "themes": [
        "高质量发展"
      ],
      "depth": "index",
      "tiYan": "（待 AI 五步拆解）",
      "body": [
        "点击播报本文，约",
        "专业的考古发现与研究成果，唯有通过契合时代语境的创造性转化，才能更好从学术象牙塔走向大众心灵，成为滋养文化自信的源头活水",
        "乐呵呵的陶俑、有趣的吉器、绢帛上的可爱稚童……最近，辽宁省博物馆联合全国多家文博机构，汇聚300余件陶器、玉器、青铜器、石刻造像、绘画、雕塑类文物和作品，推出“微笑——文物里的中国精神印记”特展，获得文化迷、文博粉的持续点赞。",
        "文物是固态的历史，镌刻特定时期的民族记忆，承载一代代人的情感内核。比如，中国国家博物馆的东汉击鼓说唱俑，一手持鼓、一手举槌，肢体松弛又富有张力，艺人模样被刻画得淋漓尽致；成都博物馆的东汉陶庖厨俑在朴素烟火中劳作、创造美味，形象生动。一件件文物上的“微笑”穿越时空，勾勒着安乐自如的市井图景，生动诠释了中国人的乐观天性。",
        "文化自信不是一句抽象的口号，而是源自一砖一瓦的精神建构。我们的文化底气，内藏于文物的盈盈“笑意”中，沉淀在万千文物承载的生活信念里。从动荡岁月里陶俑留存的从容欢愉，到寻常市井间吉器寄托的美好祈愿，再到婴童图像承载的生生之望，一脉相承的是向善向暖、热爱生活的民族底色。心怀所爱、笃守良善，正是中华民族屡经磨难、愈挫愈勇的密钥。揭示并传承文物之中的精神力量，有助于我们在时代浪潮中笃定前行，让文明薪火生生不息、绵延不绝。",
        "长久以来，不少文物陈列止步于年代、材质、用途的基础介绍，文物承载的精神意涵被埋没。近年来，我国文博事业逐步超越静态陈列，进入价值深度阐释与创造性转化的新境界。在器物形制、年代的浅层研究之外，深挖文物神态背后的民族心理、精神特质，不仅让千年陶俑的笑意成为可触摸、可共情的精神范本，更有力证明严肃的学术研究与生动的现代表达并非不可兼容。",
        "故宫博物院考古研究秉持“最小干预、微创发掘”的活态遗产保护理念，通过“边发掘、边展示”的现场转化与专题展览，将紫禁城地下的元明清“三叠层”遗迹化为公众可感知的考古实证；宝鸡青铜器博物院深挖何尊“宅兹中国”铭文内涵，借助数字化手段让青铜重器“开口说话”，将晦涩的考古语言转化为百姓听得懂的故事。专业的考古发现与研究成果，唯有通过契合时代语境的创造性转化，才能更好从学术象牙塔走向大众心灵，成为滋养文化自信的源头活水。",
        "值得关注的是，辽宁省博物馆这场“微笑”主题的文物特展，建立在全国38家文博机构携手合作的基础之上。想要让更多沉睡文物“开口说话”，需打通研究、传播、普及三重路径，汇集各方智慧、资源与行动。",
        "文博院所联合考古、文史学者深挖器物背后精神内涵，不止步于年代形制等浅层解读，提炼文物承载的深层寓意；借助数字化技术打造线上展厅，推出文物解读直播，用通俗叙事消解历史距离感；推出研学课堂、主题特展与文创美育，把抽象精神转化为大众可共情的故事……构建多层次、立体化的文物解读体系，能够让文物更巧妙地“开口”，帮助今天的我们在读懂文物中厚植文化自信。",
        "器物无声，文化深流。各类文物不仅是古代生活的鲜活遗存，更是中华民族精神品格的具象载体。深耕文物阐释、创新文博传播，透过器物明晰文明赓续的深层底气，必能进一步凝聚起磅礴的文化力量。",
        "分享让更多人看到"
      ]
    },
    {
      "id": "rmsp_20260820_生活服务要讲究不",
      "title": "生活服务要“讲究”不要“将就”",
      "url": "https://opinion.people.com.cn/n1/2026/0820/c461529-40782727.html",
      "date": "2026-08-20",

      "column": "人民时评",
      "themes": [
        "高质量发展"
      ],
      "depth": "index",
      "tiYan": "（待 AI 五步拆解）",
      "body": [
        "点击播报本文，约",
        "生活性服务业，一头连着千家万户的柴米油盐，一头连着经济大盘的稳进提质。今年上半年，生活性服务业扩围提质是一个鲜明特征。",
        "上半年批发和零售业、住宿和餐饮业的增加值规模都在扩大，文化企业实现营业收入同比增长4.6%。成绩单背后，是无数小店的热气腾腾，是养老托育服务的悉心发力，是文旅体商的好戏连台。",
        "也要看到，当“有没有”的问题基本解决，“好不好”的期盼愈发紧迫。以家政服务业为例，尽管从业人员超过3000万，但“好阿姨不好找”的问题仍困扰许多消费者。提及生活性服务业，大家受困扰的共同话题都是：优质供给不足，只能退而求其次被动“将就”，难以实现有质感的“讲究”生活。",
        "前不久，商务部等9部门印发《关于促进家政服务业高质量发展的若干政策措施》，19条具体举措覆盖从业人员权益保障、服务价格规范监管、经营主体信用查询、服务质量综合评价等多个维度，靶向破解家政服务业发展面临的堵点难点。",
        "打造供给充足、品质优良的“讲究”服务，让消费者不再“将就”，一条必经之路是促进生活性服务业高品质多样化便利化发展。",
        "规模是基础，品质是核心。不打磨品质，规模再大也无法持续。紧跟居民消费需求迭代趋势，推动供给结构与需求结构精准匹配，方能实现总量扩张与品质跃升的同频共振。",
        "海南制定家政地方服务规范，搭建家政信用信息平台，着力培育家政劳务品牌“椰嫂”，截至目前已带动近5万人就业。实践表明，扩量与提质如同车之两轮，只有协同转动，才能让消费者既有更多选择，也有更好选择。",
        "普惠打底，特色增色。“普惠”为的是兜牢基本民生底线，保障群众刚性基础需求；特色为的是顺应持续升级的消费浪潮，满足差异化、个性化诉求。",
        "江苏苏州依托老旧街区改造打造宠物主题文旅消费街区，满足青年群体新兴消费需求；贵州多地把咖啡厅搬进溶洞、天坑，培育壮大山地微度假新业态。特色化创新探索，不仅有效满足群众多元化消费需求，更为行业持续发展开辟出全新蓝海。",
        "生活性服务业点多面广、经营主体分散，既需要放活，激发活力；也需要管好，守住底线。",
        "走进辽宁沈阳和平区和平新村社区食堂，刚出锅的三鲜馅包子香气四溢。社区通过盘活闲置空间自办食堂，招募居民志愿者参与，常态化为辖区老人提供助餐服务。现如今，沈阳全市共建成老年人助餐点200多个，让老年群体在家门口就能收获暖胃又暖心的幸福味道。",
        "政策有温度、监管有厚度，行业发展才能更“讲究”。一方面，持续优化营商环境，吸引民营企业、社会组织、个体经营者参与进来，强化养老托育、家政便民、社区照料、文体休闲等领域供给。另一方面，健全监管体系，完善行业服务标准、信用评价、溯源管理和纠纷调解机制，加快形成良币驱逐劣币的良性循环。",
        "从“将就”到“讲究”，是服务标准和发展理念的深刻转变，更是对治理能力的全面考验。把“将就”的短板补齐，把“讲究”的长板拉长，每一分对生活品质的追求，都将化作百姓心头的获得感。",
        "分享让更多人看到"
      ]

      "id": "rmsp_20260824_从追问出发向未来",
      "title": "从追问出发，向未来而行",
      "url": "https://opinion.people.com.cn/n1/2026/0824/c461529-40784628.html",
      "date": "2026-08-24",
      "author": "人民时评",
      "column": "人民时评",
      "themes": [
        "高质量发展"
      ],
      "depth": "index",
      "tiYan": "（待 AI 五步拆解）",
      "body": [
        "点击播报本文，约",
        "追问的意义不在于找到一个放之四海而皆准的模式，而在于从他人的成功之中寻找镜鉴、找到方向，进而激发本地争先创优、干事创业的精气神",
        "十年突围，一朝惊艳，宇树科技迎来IPO时刻。从成立到上市，企业的快速成长之路让人惊叹，也引发更多思考：各地如何培养自己的“宇树科技”？",
        "这样的发问，我们并不陌生。DeepSeek出圈之时，许多科教资源发达的城市就在追问：为何本地没有培育出DeepSeek？",
        "追问本身就是有意义的。从“DeepSeek之问”到“宇树之问”，追问的意义不在于找到一个放之四海而皆准的模式，而在于从他人的成功之中寻找镜鉴、找到方向，进而激发本地争先创优、干事创业的精气神。在这个意义上，追问恰恰是比学赶超的一个逻辑起点，指向的是奋勇争先、敢于超越的进取意识。",
        "成功需要运气，但成功的底气从来不是运气。十几年前，上海在“为什么出不了BAT”的追问中，抢抓互联网发展机遇，积极实施“互联网+”行动。如今，信息传输、软件和信息技术服务业已跃升为上海第三大产业。",
        "产业的“逆袭”，从来不是偶然的，而是战略眼光、前瞻布局结出的硕果。紧扣国家战略，深刻洞察发展大势，在大棋局中找到精准落子处，在大潮流中找准发展方向，产业升级的密码正藏于此。",
        "产业升级，关乎眼光，也关乎时间。有经济学者提出一个观点，越是“冬天”，越是在更大范围布局的好时机。因为“冬天”投资成本低。不过，从“冬天”到“春天”，并不是一个随随便便就能抵达的过程。它需要敢为人先的勇毅，也需要厚积薄发的沉淀。因此，对于“有为政府”而言，既要有战略眼光，也要有战略定力。就拿杭州来说，以“包容十年不鸣，静待一鸣惊人”的耐心“陪跑”，才让更多年轻人成就“年轻的事业”。",
        "培育和发展产业，不能急就章、追求“短平快”，而需要沉淀和积累。发扬“功成不必在我、功成必定有我”的精神，不“翻烧饼”，不动辄“换频道”，保持政策稳定性、连续性，才能收获产业硕果。",
        "再往里深看一层，企业的崛起，得益于自身的拼搏，也离不开产业生态的协同。",
        "前不久，中国工程院院士王坚谈及和英伟达首席执行官黄仁勋的一场对话。对方好奇地问：“杭州是中国的硅谷，对吗？”王坚没有直接回复，而是用了另一个表述：“杭州成了全球的创新中心。”不仅孕育科创企业，更培育科创生态，今天的杭州，不只有“六小龙”，还有科技企业“新八骏”、人工智能社区“五小凤”，这正是创新生态演化的结果。",
        "再看湖北武汉，我国第一根石英光纤在这里诞生。由此起步，武汉持续深耕光电子信息产业，聚集了超60万从业人员、1.7万余家产业链企业。聚“光”成“链”，集“链”成“群”，武汉光谷成为全国最大的光电器件生产基地、光通信技术研发基地和激光设备生产基地的历程，也是产业生态跃迁的发展进程。",
        "培育一个创新企业，体现城市活力；培育一方热带雨林式的“创新沃土”，则关乎发展后劲。立足自身特点，从营商环境、政策支持、人才培养等入手，创造更优的创新环境，就有可能实现创新企业的千帆竞渡。",
        "无需艳羡他人。每个地区都有其独特的生态，适合不同种类的“苗”生长。从追问出发，向未来而行，用行动作答，每一座城市都有机会培育自己的创新企业。",
        "分享让更多人看到"
      ]

      "id": "rmsp_20260821_从电力账本看经济",
      "title": "从“电力账本”看经济向好",
      "url": "https://opinion.people.com.cn/n1/2026/0821/c461529-40783453.html",
      "date": "2026-08-21",
      "author": "人民时评",
      "column": "人民时评",
      "themes": [
        "高质量发展"
      ],
      "depth": "index",
      "tiYan": "（待 AI 五步拆解）",
      "body": [
        "点击播报本文，约",
        "细看中国“电力账本”，几个“首次”令人印象深刻：",
        "今年5月底，我国发电总装机容量首次突破40亿千瓦；上半年，全国可再生能源发电量占全部发电量的比例首次超四成，煤电发电量占比首次降至50%以下……",
        "一本电力账，关系万家冷暖，反映经济晴雨，记录的不仅是电流的走向、负荷的起伏，更是中国经济的韧、新、优。",
        "一个经济体的韧性，往往在承压时更能显现。今年以来国际能源市场剧烈波动，油气供应不确定性增加；7月初以来全国出现较大范围持续性高温天气，用电负荷连创历史新高，较去年极值增长约4500万千瓦。一面是外部“风浪”冲击，一面是内部负荷攀升，内外考验都没难倒我们——上半年，全国电力供需总体平衡，中国经济向新向好。",
        "韧性，从何而来？规模庞大的电力装机发挥了关键作用。40.1亿千瓦的装机规模超过美国、欧盟、印度、日本、俄罗斯发电装机总和，占全球总装机量比重近三成。外部风浪袭来时立得住，内部负荷冲高时顶得上，我们以电力底座的可靠性巩固了经济发展的确定性。",
        "由此更能理解，为何说“中国经济是一片大海，而不是一个小池塘”。因为中国经济体量足够大、体系足够全，具有充足的稳定性与抗压能力，具备动态应对外部环境变化的能力。",
        "新，藏在用电结构的“增量”里。用电量的增量在哪里，经济的新动能往往就在哪里。上半年，算力、新能源、高端制造正在成为用电增长的新引擎，互联网数据服务用电量同比增长44%，充换电服务业用电量同比增长56.9%，高技术及装备制造业用电量同比增长9.8%，均高于全社会用电量的增长速度。",
        "数据背后是趋势，电力消费的变化映射产业结构的变迁：眼下，“人工智能+”行动加速推进，一个个智算中心拔地而起；新能源汽车保有量持续攀升，充电网络越织越密；高端制造加快升级，中国智造多点开花。数据中心的服务器昼夜运转，充电桩在街巷间不断铺设，智造工厂里的机械臂不知疲倦地挥舞……中国经济高质量发展的图景，正徐徐铺展开来。",
        "优，显在发电结构的“消长”中。煤电发电量与可再生能源发电量的“一消一长”，折射中国经济运行的绿色转型。过去谈发展，往往离不开传统化石能源的大量消耗；现在，我们以更低的环境代价，支撑起经济的持续增长。",
        "煤电之降，降的是对传统能源的依赖；风光之升，升的是可持续发展的底气。中国经济之优，优在增长不以透支环境为代价，而是在绿色发展轨道上不断跑出加速度。",
        "7月30日召开的中共中央政治局会议强调：“坚定信心，迎难而上，用好各种机遇和优势，推动高质量发展行稳致远。”透过“电力账本”，可以看到中国经济在转型中保持定力、在变革中积蓄动能、在挑战中砥砺前行的壮阔图景。以绿为底、向新向优，相信中国经济巨轮定能在高质量发展的航道上乘风破浪、稳健前行。",
        "分享让更多人看到"
      ]
    },

      "id": "rmsp_20260825_新益求新话创新",
      "title": "“新益求新”话创新",
      "url": "https://opinion.people.com.cn/n1/2026/0825/c461529-40785358.html",
      "date": "2026-08-25",
      "author": "人民时评",
      "column": "人民时评",
      "themes": [
        "科技创新与新质生产力"
      ],
      "depth": "index",
      "tiYan": "（待 AI 五步拆解）",
      "body": [
        "点击播报本文，约",
        "近期的两则地方产业发展动态，合起来看，颇有启发。",
        "吉林大安，风光绿电变为卖得俏的绿氨，有效破解绿电消纳难题；宁夏中卫，凭借清洁电力供应，推动算力服务升级。",
        "依托相似的资源禀赋，走出迥异的产业新路。两地的发展实践，既是中国经济动能向新、结构向优的一道剪影，也为其他地方培育壮大新质生产力、加快新旧动能转换提供启示。",
        "如何理解“新”？对比中更清晰。",
        "同样有好“风光”，大安在传统石化的“根”上，嫁接绿色化工的“苗”，长出蓬勃向上的新产业；中卫借“凉”，顺势承接“热”产业，实现从输出资源到输出服务的升级……思维革新，换羽新生，对比两地路径，一个认识更加清晰：一把钥匙开一把锁，找准那把“开锁的钥匙”，才是向新发展、向上攀高的正确方式。",
        "“向新”不能脱离实际。陕西融入高质量共建“一带一路”，对共建国家进出口同比增长1.1倍；安徽发力先进制造业，高技术制造业增加值增速达44.6%……研读各省份经济半年报可以看出，有的在存量扩张上做文章，有的在资源转化上找出路，立足实际、错位发展，各美其美、各展其长，才可能挑大梁、抢先机。",
        "“新”从何处来？深入看有答案。",
        "绿电变绿氨，看似简单的转化背后，凝结着30多项专利，创造多项全球之最，最终形成产业闭环；“绿电+算力”，通过创新算电协同服务模式，让澎湃绿能汇入算力蓝海。无论技术突破还是模式探索，根基都在创新。",
        "新质生产力，显著特点是创新。唯有持续激活创新引擎，才能为经济发展注入源源不断的内生动力。细看近段时间的创新突破，华为发布半导体领域“韬定律”，震撼全球产业界；朱雀三号成功回收，我国在重复使用火箭关键技术上取得重大突破；人工智能、机器人、创新药迎来“爆发时刻”……从企业到产业，从制造到“智造”，经济发展新动能愈发强劲，离不开创新的支撑。",
        "创新，既包括技术层面，也涵盖业态模式层面。“新益求新”，必须继续做好创新这篇大文章，推动科技创新和产业创新深度融合，让更多创新从“实验室”走向“大市场”。",
        "“新”何以致远？长镜头看才真切。",
        "新产品下线、新工厂落地，只是第一步。新赛道可持续，新模式跑得通，才是新质生产力茁壮成长、起势成势的关键所在。无论是实现“从0到1”的科技创新，还是推进“把1拉长”的产业创新，都有赖于长期主义的坚守、广阔市场的哺育和良好环境的支撑。",
        "拉开时间镜头，从“一五”起步，于“一穷二白”奋起，中国何以在几十载迎头赶上，从跟跑转向并跑、领跑？靠的既是自立自强、守正创新，也是脚踏实地、一步一步向上走。“新益求新”，必须怀揣历史耐心，看准了就持续深耕，避免盲目追风口、频繁换赛道。",
        "“中国是一个高度创新的国家”，瑞士《新苏黎世报》如此评价。持续释放创新红利，将创新优势转化为发展优势，离不开每一个地区的共同努力。因地制宜谋势争先、锚定创新接续奋斗，各地充分发挥比较优势，必将形成推动高质量发展的蓬勃胜势。",
        "分享让更多人看到"
      ]
    }

          "统筹推进教育科技人才一体化"
        ],
        "anLi": [
          "中国青年数学家首获菲尔兹奖"
        ],
        "jinJu": [
          "越向上生长越往深处扎根"
        ]
      },
      "score": "一类文中",
      "improve": "结尾升华可引入'中国式现代化'高度",
      "newMaterial": ""
    }
  ]
}
</script>
<script>
const DATA=JSON.parse(document.getElementById('data').textContent);
const SCOPES=["全部","已拆解范文","待拆解清单"];
const AGTABS=[["fenlun","分论点总库"],["biaoda","规范表达总库"],["duice","对策总库"],["anli","案例库"],["jinju","金句总库"]];
let state={view:"articles",ag:"fenlun",scope:"全部",ym:"全部",theme:"",q:"",limit:120};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function hi(s,terms){let h=esc(s);if(!terms.length)return h;
  terms.forEach(t=>{if(!t)return;const r=new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi");h=h.replace(r,m=>"\x01"+m+"\x02");});
  return h.replace(/\x01/g,"<mark>").replace(/\x02/g,"</mark>");}
function monthsFor(){
  const s=new Set();DATA.articles.forEach(a=>{if(a.date&&a.date.length>=7)s.add(a.date.slice(0,7));});
  return[...s].sort().reverse();
}
function buildYearChips(){
  const yc=document.getElementById('years');yc.innerHTML="";
  ["全部",...monthsFor()].forEach(y=>{
    const b=document.createElement('button');b.textContent=y==="全部"?"全部月份":y;
    b.classList.toggle('on',y===state.ym);
    b.onclick=()=>{state.ym=y;state.limit=120;render();};yc.appendChild(b);});
}
function init(){
  document.getElementById('metaInfo').textContent=
    `共 ${DATA.articles.length} 篇（已拆解 ${DATA.articles.filter(a=>a.depth==='full').length} · 待拆解 ${DATA.articles.filter(a=>a.depth==='index').length}）· 12 母题 · 源：人民网观点频道 · 构建 ${DATA.meta.built}`;
  const sc=document.getElementById('scopes');
  SCOPES.forEach(s=>{const b=document.createElement('button');b.textContent=s;
    b.onclick=()=>{state.scope=s;state.theme="";state.ym="全部";state.limit=120;render();};sc.appendChild(b);});
  let timer;document.getElementById('q').addEventListener('input',e=>{
    clearTimeout(timer);timer=setTimeout(()=>{state.q=e.target.value.trim();state.limit=120;render();},200);});
  window.addEventListener('scroll',()=>{document.getElementById('top').style.display=scrollY>500?'block':'none';});
  document.querySelectorAll('#tabs button').forEach(b=>{b.onclick=()=>{state.view=b.dataset.v;state.ag="fenlun";state.theme="";state.scope="全部";state.ym="全部";state.q="";document.getElementById('q').value="";render();};});
  render();
}
function filtered(){
  const terms=state.q?state.q.split(/\s+/).filter(Boolean):[];
  let as=DATA.articles.filter(a=>
    (state.scope==="全部"||(state.scope==="已拆解范文"?a.depth==='full':a.depth==='index'))&&
    (state.ym==="全部"||(a.date||"").slice(0,7)===state.ym)&&
    (!state.theme||(a.themes||[]).includes(state.theme)));
  if(terms.length){
    as=as.filter(a=>{const blob=[a.title,(a.themes||[]).join(" "),a.tiYan||"",
      (a.guJia||[]).join(" "),(a.jinJu||[]).join(" "),(a.keYongYu||[]).join(" "),
      (a.zhengLun||[]).join(" "),a.keTaoKuangJia||""].join(" ").toLowerCase();
      return terms.every(t=>blob.includes(t.toLowerCase()));});
  }
  return {as,terms};
}
function render(){
  const v=state.view;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  const nav=document.getElementById('nav'),sb=document.getElementById('scopes'),yc=document.getElementById('years'),sn=document.getElementById('subnav'),sr=document.getElementById('searchbar');
  if(v==='articles'){nav.style.display='';sb.style.display='';yc.style.display='';sn.style.display='none';sr.style.display='';buildArticles();}
  else if(v==='aggregate'){nav.style.display='none';sb.style.display='none';yc.style.display='none';sr.style.display='none';sn.style.display='flex';buildSubnav();buildAggregate();}
  else{nav.style.display='none';sb.style.display='none';yc.style.display='none';sn.style.display='none';sr.style.display='none';buildExam();}
}
function buildSubnav(){
  const sn=document.getElementById('subnav');sn.innerHTML='';
  AGTABS.forEach(([k,label])=>{const b=document.createElement('button');b.textContent=label;b.classList.toggle('on',k===state.ag);b.onclick=()=>{state.ag=k;buildAggregate();};sn.appendChild(b);});
}
function buildArticles(){
  document.querySelectorAll('#scopes button').forEach(b=>b.classList.toggle('on',b.textContent===state.scope));
  buildYearChips();
  const {as,terms}=filtered();
  const counts={};
  DATA.articles.forEach(a=>{
    if((state.scope==="全部"||(state.scope==="已拆解范文"?a.depth==='full':a.depth==='index'))&&
       (state.ym==="全部"||(a.date||"").slice(0,7)===state.ym))
      (a.themes||[]).forEach(t=>counts[t]=(counts[t]||0)+1);});
  let h='<h3>母题 · 12 类</h3>';
  h+=`<div class="tlink ${!state.theme?'on':''}" onclick="state.theme='';state.limit=120;render()"><span>全部母题</span></div>`;
  DATA.themes.forEach(t=>{if(!(t in counts))return;
    h+=`<div class="tlink ${state.theme===t?'on':''}" onclick="state.theme='${t.replace(/'/g,"\\'")}';state.limit=120;render();scrollTo(0,0)">
      <span>${esc(t)}</span><span class="n">${counts[t]}</span></div>`;});
  document.getElementById('nav').innerHTML=h;
  const box=document.getElementById('content');
  document.getElementById('stats').textContent=
    `${state.scope} · ${state.ym==="全部"?"全部月份":state.ym}${state.theme?" · "+state.theme:""}${state.q?" · 搜索“"+state.q+"”":""} — 命中 ${as.length} 篇`;
  if(!as.length){box.innerHTML='<div class="empty">没有匹配内容，换个关键词试试</div>';return;}
  const show=as.slice(0,state.limit);
  let html="",lastTheme=null;
  for(const a of show){
    if(!state.q&&!state.theme&&a.themes&&a.themes[0]!==lastTheme){html+=`<div class="themeHead">${esc(a.themes[0])}</div>`;lastTheme=a.themes[0];}
    const ym=(a.date||"").slice(0,7);
    const tags=(a.themes||[]).map(t=>`<span class="tag">${hi(t,terms)}</span>`).join("");
    const head=`<div class="hd">
      <span class="tag lib">${hi(a.column||"",terms)}</span>
      <span class="tag">${a.date||""}</span>
      ${tags}
      <b>${a.url?`<a href="${esc(a.url)}" target="_blank" style="color:var(--txt);text-decoration:none">${hi(a.title,terms)}</a>`:hi(a.title,terms)}</b>
      ${a.depth==='index'?'<span class="tag idx">待深度拆解</span>':''}
    </div>`;
    let body='<div class="bd">';
    if(a.tiYan)body+=`<div><span class="lab">① 看标题·题眼/核心论点：</span>${hi(a.tiYan,terms)}</div>`;
    if(a.depth==='full'){
      if(a.guJia&&a.guJia.length)body+=`<div class="lab">② 理结构·骨架（分论点）</div><ul>${a.guJia.map(g=>'<li>'+hi(g,terms)+'</li>').join("")}</ul>`;
      if(a.jieWei)body+=`<div><span class="lab">③ 抓观点·结尾升华：</span>${hi(a.jieWei,terms)}</div>`;
      if(a.jinJu&&a.jinJu.length)body+=`<div class="lab">④ 学表达·金句</div><ul>${a.jinJu.map(j=>'<li>'+hi(j,terms)+'</li>').join("")}</ul>`;
      if(a.zhengLun&&a.zhengLun.length)body+=`<div class="lab">④ 学表达·论证手法/句式</div><ul>${a.zhengLun.map(z=>'<li>'+hi(z,terms)+'</li>').join("")}</ul>`;
      if(a.keTaoKuangJia)body+=`<div><span class="lab">② 理结构·可套框架：</span>${hi(a.keTaoKuangJia,terms)}</div>`;
      if(a.keYongYu&&a.keYongYu.length)body+=`<div><span class="lab">⑤ 积素材·可用于：</span>${a.keYongYu.map(k=>'<span class="kw">'+hi(k,terms)+'</span>').join("")}</div>`;
    }else{
      body+=`<div style="color:var(--gray)">已采集原文，点击标题跳转人民网阅读；如需五步拆解请在对话中让我“拆解第X篇”。</div>`;
    }
    body+='</div>';
    html+=`<div class="card">${head}${body}</div>`;
  }
  if(as.length>state.limit)
    html+=`<button class="more" style="display:block;margin:14px auto;padding:8px 26px;border:1px solid var(--line);background:var(--panel);border-radius:20px;cursor:pointer;color:var(--accent);font-size:13px" onclick="state.limit+=200;render()">加载更多（还有 ${as.length-state.limit} 篇）</button>`;
  box.innerHTML=html;
}
function buildAggregate(){
  const terms=state.q?state.q.split(/\s+/).filter(Boolean):[];
  const full=DATA.articles.filter(a=>a.depth==='full');
  const box=document.getElementById('content');
  const LAB={fenlun:'分论点',biaoda:'规范表达',duice:'对策',anli:'案例',jinju:'金句'};
  document.getElementById('stats').textContent=`聚合总库 · ${LAB[state.ag]} — 源自 ${full.length} 篇已拆解范文`;
  let html='<div class="aggrid">';
  if(state.ag==='fenlun'){
    const byTheme={};full.forEach(a=>(a.themes||[]).forEach(t=>{(byTheme[t]=byTheme[t]||[]).push(a);}));
    Object.keys(byTheme).sort().forEach(t=>{
      html+=`<div class="agcard"><div class="h">${esc(t)}</div>`;
      byTheme[t].forEach(a=>{html+=`<div class="src">▸ ${esc(a.title)}</div>`;
        (a.guJia||[]).forEach(g=>html+=`<div class="row">• ${hi(g,terms)}</div>`);});
      html+='</div>';});
  }else if(state.ag==='biaoda'){
    const items=[];full.forEach(a=>(a.biaoDa||[]).forEach(b=>items.push({...b,src:a.title})));
    const byF={};items.forEach(b=>{(byF[b.f]=byF[b.f]||[]).push(b);});
    const order=["重要性表述","对策动词","开头","过渡","结尾","比喻","金句","机制表述","目标任务"];
    Object.keys(byF).sort((x,y)=>order.indexOf(x)-order.indexOf(y)).forEach(f=>{
      html+=`<div class="agcard"><div class="h">${esc(f)}</div>`;
      byF[f].forEach(b=>html+=`<div class="row"><span class="f">${esc(b.theme)}</span>${hi(b.t,terms)} <span style="color:var(--sub);font-size:11px">（${esc(b.src)}）</span></div>`);
      html+='</div>';});
  }else if(state.ag==='duice'){
    const items=[];full.forEach(a=>(a.duiCe||[]).forEach(d=>items.push({...d,src:a.title})));
    const byField={};items.forEach(d=>{(byField[d.field]=byField[d.field]||[]).push(d);});
    Object.keys(byField).sort().forEach(f=>{
      html+=`<div class="agcard"><div class="h">${esc(f)}领域</div>`;
      byField[f].forEach(d=>{html+=`<div class="row"><b>${hi(d.t,terms)}</b> <span class="f">${esc(d.subject)}</span></div>`;
        html+=`<div class="row" style="color:var(--sub);padding-left:8px">${hi(d.steps,terms)}</div>`;
        html+=`<div class="src">▸ ${esc(d.src)}</div>`;});
      html+='</div>';});
  }else if(state.ag==='anli'){
    const items=[];full.forEach(a=>(a.anLi||[]).forEach(c=>items.push({...c,src:a.title})));
    items.forEach(c=>{
      html+=`<div class="agcard"><div class="h">${hi(c.name,terms)}</div>`;
      html+=`<div class="row"><span class="lab">主体</span>：${esc(c.subject)}</div>`;
      html+=`<div class="row"><span class="lab">处境</span>：${esc(c.situation)}</div>`;
      html+=`<div class="row"><span class="lab">做法</span>：${hi(c.action,terms)}</div>`;
      html+=`<div class="row"><span class="lab">结果</span>：${esc(c.result)}</div>`;
      html+=`<div class="row"><span class="lab">启示</span>：${hi(c.lesson,terms)}</div>`;
      html+=`<div>${(c.themes||[]).map(t=>'<span class="f">'+esc(t)+'</span>').join("")}</div>`;
      html+=`<div class="src">▸ ${esc(c.src)}</div></div>`;});
  }else if(state.ag==='jinju'){
    const items=[];full.forEach(a=>{(a.jinJu||[]).forEach((j,i)=>items.push({t:j,func:(a.jinJuF&&a.jinJuF[i])||"论证",src:a.title,th:(a.themes||[])[0]}));});
    const byF={};items.forEach(b=>{(byF[b.func]=byF[b.func]||[]).push(b);});
    ["开头","论证","结尾"].forEach(f=>{if(!(f in byF))return;
      html+=`<div class="agcard"><div class="h">${esc(f)}金句</div>`;
      byF[f].forEach(b=>html+=`<div class="row">“${hi(b.t,terms)}” <span class="f">${esc(b.th||"")}</span> <span style="color:var(--sub);font-size:11px">（${esc(b.src)}）</span></div>`);
      html+='</div>';});
  }
  html+='</div>';
  box.innerHTML=html;
}
function buildExam(){
  const box=document.getElementById('content');
  const z=DATA.zhenTi||[];
  document.getElementById('stats').textContent=`真题对照与迁移库 · ${z.length} 条（关联「上岸通」真题，逐步补充）`;
  if(!z.length){box.innerHTML='<div class="empty">暂无真题对照记录。读完时评后，用"命题人视角"自拟题目并对照本库素材即可添加。</div>';return;}
  let html='';
  z.forEach(e=>{
    html+=`<div class="examcard"><div class="h">${esc(e.title)}</div>`;
    const u=e.used||{};
    html+=`<div class="row"><span class="lab">调用·论点库</span>：${(u.lunDian||[]).map(x=>'<span class="kw">'+esc(x)+'</span>').join("")||"—"}</div>`;
    html+=`<div class="row"><span class="lab">调用·对策库</span>：${(u.duiCe||[]).map(x=>'<span class="kw">'+esc(x)+'</span>').join("")||"—"}</div>`;
    html+=`<div class="row"><span class="lab">调用·案例库</span>：${(u.anLi||[]).map(x=>'<span class="kw">'+esc(x)+'</span>').join("")||"—"}</div>`;
    html+=`<div class="row"><span class="lab">调用·金句库</span>：${(u.jinJu||[]).map(x=>'<span class="kw">'+esc(x)+'</span>').join("")||"—"}</div>`;
    if(e.score)html+=`<div class="row"><span class="lab">实际得分</span>：${esc(e.score)}</div>`;
    if(e.improve)html+=`<div class="row"><span class="lab">改进空间</span>：${esc(e.improve)}</div>`;
    if(e.newMaterial)html+=`<div class="row"><span class="lab">新增素材</span>：${esc(e.newMaterial)}</div>`;
    html+='</div>';
  });
  box.innerHTML=html;
}
init();
</script>
</body>
</html>

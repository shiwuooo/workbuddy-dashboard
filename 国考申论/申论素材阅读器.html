<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>申论素材库 · 五位一体</title>
<style>
:root {
  --bg: #f8f9fc;
  --card-bg: #ffffff;
  --text: #1a1a2e;
  --text-secondary: #52525b;
  --text-muted: #a1a1aa;
  --border: #e4e4e7;
  --shadow: 0 1px 3px rgba(0,0,0,0.05), 0 4px 12px rgba(0,0,0,0.03);
  --radius: 14px;
  --sidebar-w: 220px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.7; font-size: 15px;
}

.top-bar {
  position: fixed; top:0; left:0; right:0; z-index:100;
  background: rgba(255,255,255,0.92); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border); padding: 10px 24px;
  display:flex; align-items:center; gap:16px;
}
.top-bar h1 { font-size:18px; font-weight:700; letter-spacing:-0.3px; }
.top-bar .count { font-size:12px; color:var(--text-muted); background:#f4f4f5; padding:3px 10px; border-radius:12px; }

.search-box { flex:1; max-width:360px; position:relative; }
.search-box input {
  width:100%; padding:8px 14px 8px 36px; border-radius:20px;
  border:1px solid var(--border); background:#fafafa;
  font-size:13px; outline:none; transition:border 0.2s, box-shadow 0.2s;
}
.search-box input:focus { border-color:#6366f1; box-shadow:0 0 0 3px rgba(99,102,241,0.1); background:#fff; }
.search-icon { position:absolute; left:12px; top:50%; transform:translateY(-50%); font-size:13px; pointer-events:none; }

.layout { display:flex; margin-top:58px; min-height:calc(100vh - 58px); }

.sidebar {
  width:var(--sidebar-w); flex-shrink:0;
  background:rgba(255,255,255,0.7); backdrop-filter:blur(8px);
  border-right:1px solid var(--border); padding:20px 0;
  position:sticky; top:58px; height:calc(100vh - 58px); overflow-y:auto;
}
.nav-item {
  display:flex; align-items:center; gap:10px; padding:12px 20px;
  cursor:pointer; font-size:15px; font-weight:500; color:var(--text-secondary);
  border-left:3px solid transparent; transition:all 0.15s;
}
.nav-item:hover { background:rgba(99,102,241,0.06); color:var(--text); }
.nav-item.active { color:var(--text); border-left-color:var(--active-color, #6366f1); background:rgba(99,102,241,0.06); }
.nav-item .nav-icon { font-size:18px; }
.nav-item .nav-count { margin-left:auto; font-size:11px; background:#f4f4f5; padding:2px 8px; border-radius:10px; color:var(--text-muted); }

.main { flex:1; padding:24px 32px; max-width:960px; }

.article-card {
  background:var(--card-bg); border-radius:var(--radius);
  border:1px solid var(--border); padding:24px; margin-bottom:20px;
  box-shadow:var(--shadow); transition:box-shadow 0.2s;
}
.article-card:hover { box-shadow:0 4px 16px rgba(0,0,0,0.07); }

.art-top { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:8px; }
.art-title { font-size:17px; font-weight:700; color:var(--text); flex:1; }
.art-meta { display:flex; gap:8px; flex-wrap:wrap; }
.art-tag {
  font-size:11px; padding:3px 10px; border-radius:12px; font-weight:500;
  background:#f0f0f3; color:var(--text-secondary);
}
.art-date { font-size:12px; color:var(--text-muted); }
.art-source { font-size:12px; color:var(--text-muted); margin-bottom:16px; }

.sections-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
@media(max-width:700px){ .sections-grid { grid-template-columns:1fr; } }

.section-block {
  border-radius:10px; padding:16px; border:1px solid #f0f0f3;
}
.section-block.kuangjia { background:linear-gradient(135deg,#fefce8,#fffbeb); border-color:#fde68a40; }
.section-block.guifan { background:linear-gradient(135deg,#eff6ff,#dbeafe); border-color:#93c5fd40; }
.section-block.jinju { background:linear-gradient(135deg,#fdf4ff,#fae8ff); border-color:#e879f040; }
.section-block.anli { background:linear-gradient(135deg,#ecfdf5,#d1fae5); border-color:#6ee7b740; }

.sec-header {
  font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px;
  margin-bottom:10px; display:flex; align-items:center; gap:6px;
}
.sec-header.kj { color:#b45309; }
.sec-header.gf { color:#1d4ed8; }
.sec-header.jj { color:#a21caf; }
.sec-header.al { color:#047857; }
.sec-header .sec-icon { font-size:14px; }

.section-block ul { list-style:none; padding:0; }
.section-block li {
  font-size:13px; line-height:1.65; color:var(--text-secondary);
  padding:4px 0 4px 16px; position:relative;
}
.section-block li::before {
  content:""; position:absolute; left:0; top:12px;
  width:5px; height:5px; border-radius:50%;
}
.kuangjia li::before { background:#f59e0b; }
.guifan li::before { background:#3b82f6; }
.jinju li::before { background:#a855f7; }
.anli li::before { background:#10b981; }

.jinju-highlight {
  background:rgba(168,85,247,0.08); border-left:3px solid #a855f7;
  padding:10px 14px; border-radius:0 8px 8px 0; margin:6px 0;
  font-style:italic; font-size:13.5px; color:#444;
}

.empty-state { text-align:center; padding:60px 20px; color:var(--text-muted); }
.empty-state .icon { font-size:48px; margin-bottom:12px; }

::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-thumb { background:#d4d4d8; border-radius:3px; }
::-webkit-scrollbar-thumb:hover { background:#a1a1aa; }

@media(max-width:768px){
  .sidebar { display:none; }
  .mobile-tabs { display:flex !important; overflow-x:auto; gap:4px; padding:0 16px 12px; -webkit-overflow-scrolling:touch; }
  .mobile-tab { flex-shrink:0; padding:8px 16px; border-radius:20px; font-size:13px; font-weight:600; border:1px solid var(--border); background:#fff; cursor:pointer; white-space:nowrap; }
  .mobile-tab.active { background:var(--text); color:#fff; border-color:var(--text); }
  .main { padding:16px; }
  .article-card { padding:16px; }
  .top-bar { padding:8px 16px; }
}
.mobile-tabs { display:none; }

.back-btn {
  display:inline-flex; align-items:center; gap:6px;
  font-size:13px; color:var(--text-secondary); text-decoration:none;
  padding:6px 12px; border-radius:8px; transition:background 0.15s;
}
.back-btn:hover { background:#f4f4f5; color:var(--text); }

.stats-row { display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap; }
.stat-pill {
  display:flex; align-items:center; gap:6px; padding:8px 16px;
  background:var(--card-bg); border:1px solid var(--border); border-radius:20px;
  font-size:13px; font-weight:600;
}
.stat-dot { width:8px; height:8px; border-radius:50%; }
</style>
</head>

    <span class="search-icon">🔍</span>

<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>

  <main class="main" id="mainContent"></main>
</div>

，实干/为民类通用。\n- 【理论】习近平在福建宁德工作时：「各级领导干部要深入实际，深入群众，坚持从群众中来到群众中去」——点评：调查研究/群众路线的领袖论述。\n- 【反面现象】「看看材料听听汇报，表表态度走走过场」，「三拍」式干部——点评：形式主义、政绩观错位的问题段典型表述。"}}, {"title": "持续锻造不可战胜的力量》（连线评论员）", "date": "2026-08-02", "source": "", "themes": [], "sections": {"框架": "- 标题模板：持续锻造XX的力量（副词+锻造+价值名词，适合精神/能力/队伍建设类；同款：不断汇聚XX的力量）\n- 体裁提示：「连线评论员」=**对话体评论**，四问四答。申论可直接转化为「设问—作答」四层结构，问句即分论点。\n- 开头：政策+事件双引入（二十届四中全会提出「加快先进战斗力建设」并写入《政府工作报告》＋潜射战略导弹试射成功）→ 抛出核心设问\n- 分论点（装备练兵 → 为民担当 → 精神传承 → 理论人才，四层递进）：\n  1. 强国必须强军，强军必须利器；战斗力生成已不再单纯依赖「器利」，更取决于先进的训练理念、手段、模式\n  2. 先进战斗力，是保家卫国的钢铁长城，也是守护人民的坚实盾牌；「灾区也是考场」\n  3. 烽火中锻造的伟大长征精神，是人民军队战斗力的精神源泉\n  4. 强化理论创新与科技赋能的双轮驱动；以人才队伍建设支撑先进战斗力建设\n- 结尾升华：物理叠加 vs 信仰与科技的交融 → 大国博弈压舱石／民族复兴铁肩膀／中国式现代化最硬核的安全底线 → 迎接建军一百周年", "规范词": "- 加快先进战斗力建设\n- 充分解放和发展新质战斗力\n- 战训耦合、体系练兵、科技练兵\n- 融入联合作战体系、科技赋能、以战领建\n- 非战争军事行动\n- 空天一体的信息网\n- 如期高质量实现建军一百年奋斗目标\n- 理论创新与科技赋能的双轮驱动\n- 数量充足、素质优良的新型军事人才队伍\n- 突出战的牵引、提升建的效能、强化备的支撑", "金句": "- 「强国必须强军，强军必须利器。」\n- 「没有一支强大的军队，就不可能有强大的祖国；没有国防和军队的现代化，就没有中国式现代化。」\n- 「先进战斗力，从来不是钢铁与火药的物理叠加，而是信仰与科技的交融、血性与智慧的结合。」\n- 「它是大国博弈的压舱石，是民族复兴的铁肩膀，是中国式现代化最硬核的安全底线。」（三分句排比，收尾高分句式）\n- 「让每一滴训练汗水都流进实战的土壤，让每一件大国重器都融入体系的血脉。」\n- 「灾区也是考场。」（四字短句，转折有力）\n- 「长征精神一直是我们前行路上的北斗。」\n- 「『看见解放军，我们就心安了』，质朴的话语，是多少老百姓的心声。」（群众语言引用法）", "案例": "- 【装备】国产航母、新型核潜艇、「东风」系列导弹等大国重器列装；战略预警、远海防卫、远程打击、战略投送、信息支援等作战能力上台阶——点评：国防现代化成就类通用论据。\n- 【抗洪】入汛以来多地极端暴雨洪涝，北斗导航、预警机指挥、遥感监测提供硬核支撑，千里驰援、连续奋战——点评：可用于「人民至上／应急管理／军民鱼水情」。\n- 【纪念节点】2026年是红军长征胜利90周年；长征被称为「无与伦比的史诗般远征」——点评：2026年高频时政节点，精神谱系类必备。\n- 【政策】党的二十届四中全会提出「加快先进战斗力建设」，写入2026年《政府工作报告》。\n---"}}, {"title": "通过强健自身锻造更加强大政党", "date": "2026-08-04", "source": "", "themes": [], "sections": {"框架": "- 标题模板：通过XX锻造更加强大XX（动宾+结果式，适合作风/党建/能力建设类；同款：通过自我革命破解大党独有难题）\n- 开头：时政节点切入（7·16《求是》刊发总书记在庆祝建党105周年大会上的讲话）→ 点出\"注重强健自身，始终充满生机活力\"这一优秀特质 → 提出\"必须持之以恒推进全面从严治党\"\n- 分论点（历史成就→形势要求→实践路径三段递进）：\n  1. 成就层：新时代全面从严治党取得历史性、开创性成就（中央八项规定破题→纠治\"四风\"→打虎拍蝇猎狐→提出新时代党的建设总要求）\n  2. 形势层：身处民族复兴关键期（距基本实现现代化仅9年、全面建成强国20多年），\"四大考验\"\"四种危险\"长期存在，须以自我革命精神把伟大工程向纵深推进\n  3. 实践层：深学笃行习近平党建思想，健全全面从严治党体系，坚决打好反腐败斗争攻坚战持久战总体战，提高\"四力\"（政治领导力/思想引领力/群众组织力/社会号召力）\n- 结尾升华：以\"我们是一个大党，领导的是一个大国，进行的是伟大的事业\"收束 → 第二个百年奋斗目标必定实现、民族复兴必定到来", "规范词": "- 注重强健自身，始终充满生机活力（党的优秀特质）\n- 全面从严治党取得历史性、开创性成就\n- 以\"得罪千百人、不负十四亿\"的使命担当祛疴治乱\n- 打虎、拍蝇、猎狐多管齐下\n- 新时代党的建设总要求 / 以政治建设为统领\n- 习近平党建思想（新时代管党治党根本遵循和行动指南）\n- 以自我革命精神把伟大工程向纵深推进\n- 健全全面从严治党体系\n- 坚决打好反腐败斗争攻坚战、持久战、总体战\n- 提高党的政治领导力、思想引领力、群众组织力、社会号召力\n- \"四大考验\"\"四种危险\"依然如影随形、长期存在", "金句": "- \"注重强健自身，始终充满生机活力。\"\n- \"以‘得罪千百人、不负十四亿’的使命担当祛疴治乱。\"\n- \"我们是一个大党，领导的是一个大国，进行的是伟大的事业。\"\n- \"把我们党治理好、建设强。\"", "案例": "- 【理论】习近平党建思想：把马克思主义基本原理同中国具体实际、中华优秀传统文化相结合推进党建理论创新的重大成果，系统回答新时代管党治党\"怎么看、怎么干\"——点评：党建领域\"两个结合\"范例，可作理论创新论证。\n- 【节点】2026年7月16日《求是》刊发总书记在庆祝中国共产党成立105周年大会上的讲话——点评：全新时政母题入口。\n- 【表述】\"四大考验\"\"四种危险\"依然如影随形、长期存在——点评：问题段规范表述，避免空泛。"}}, {"title": "把广大海外侨胞和归侨侨眷紧密团结起来", "date": "2026-08-05", "source": "", "themes": [], "sections": {"框架": "- 标题模板：把XX紧密团结起来（团结动员类，适合作家/青年/人才/侨胞等群体动员主题）\n- 开头：会议引入（全国侨务工作会议+总书记重要指示）→ 引述总书记高度评价与要求 → 点明为新时代侨务工作提供重要遵循\n- 分论点（地位→成绩→使命三段）：\n  1. 地位层：侨务工作是党和国家长期性、战略性工作，与时代脉搏同频共振，在革命建设改革各时期发挥重要独特作用\n  2. 成绩层：新时代侨务工作全面加强成效显著（品牌活动+平台搭建+侨商侨企作用+为侨服务优化），同时直面新挑战（统筹/创新/基层力量不足/精准服务待提升）\n  3. 使命层：以习近平新时代中国特色社会主义思想为指导，坚持凝心聚力同圆共享中国梦主题，坚持\"三个统一/三个协同\"（为大局与服务、国内与国外、涵养与发挥），推动高质量发展\n- 结尾升华：夯实团结奋斗根基 → 引导在现代化/弘扬文化/促进统一/中外交流发挥更大作用 → 汇聚磅礴力量推进强国建设民族复兴", "规范词": "- 凝聚侨心侨力\n- 同圆共享中国梦\n- 为大局服务和为侨服务相统一\n- 国内侨务和国外侨务工作相协同\n- 涵养资源和发挥作用相统筹\n- 当好海外侨胞和归侨侨眷的贴心人、成为侨务工作的实干家\n- 广泛团结联系海外侨胞，促进海内外中华儿女团结奋斗\n- 以中国式现代化全面推进强国建设、民族复兴伟业\n- 久久为功", "金句": "- 「侨务工作是党和国家一项长期性、战略性工作。」\n- 「始终与时代发展脉搏同频共振。」\n- 「更好把广大海外侨胞和归侨侨眷紧密团结起来……为以中国式现代化全面推进强国建设、民族复兴伟业汇聚磅礴力量。」\n- 「涉侨部门在开展为侨服务工作时，考虑海外侨胞和归侨侨眷的实际需求还不够充分。」（可作问题段）", "案例": "- 【平台/品牌】世界华侨华人社团联谊大会、世界华侨华人工商大会、中国侨商投资大会；\"文化中国\"\"亲情中华\"品牌活动——点评：依托地缘亲缘纽带，为全球侨商侨企和海外人才参与中国发展搭建平台。\n- 【机制】出入境证件身份认证平台建成运行；华侨子女教育、社会保障政策完善；\"侨胞之家\"\"新侨驿站\"基层服务平台健全——点评：为侨服务优化，可作\"精准服务/基层治理\"素材。\n- 【政策】国务院侨办和中国侨联联合编印《涉侨法律政策指南（2026年版）》——点评：便利依法办理事务，制度型为侨服务举措。\n---\n---"}}, {"title": "党员干部要经得住\"看\"》（评论员观察·推进基层工作方法谈②）", "date": "2026-08-11", "source": "", "themes": [], "sections": {"框架": "- 标题模板：党员干部要经得住\"X\"（小切口\"看\"字破题，适合作风建设/干部示范类主题）\n- 开头：场景切入（与基层干部聊\"凝聚力\"）→ 俗语\"村看村、户看户、群众看党员、党员看干部\"点题\n- 分论点（三个\"看\"层层递进）：\n  1. 看行动力——以身作则、带头实干（梁家河沼气池案例）\n  2. 看政绩观——统筹潜绩与显绩，经得起长远看、反复看（安吉余村转型）\n  3. 看监督——作风纪律是防腐剂，机制创新让群众\"看得清\"（义乌公信平台 / 张掖小微权力清单）\n- 结尾升华：焦裕禄、谷文昌、杨善洲群像 → \"以干部敢为带动群众敢首创\" → 基层力量源迸发澎湃活力", "规范词": "- 基层党组织战斗堡垒\n- 政治生态\n- 以身作则、身体力行\n- 在其位谋其政，任其职尽其责\n- 统筹潜绩与显绩\n- 整治群众身边不正之风和腐败问题\n- 小微权力清单\n- 阳光是最好的防腐剂\n- 以干部敢为带动群众敢首创\n- 经得起实践和历史检验", "金句": "- \"村看村、户看户、群众看党员、党员看干部。\"\n- \"在上面要求人、在后面推动人，都不如在前面带动人管用。\"\n- \"既要做让老百姓看得见、摸得着、得实惠的实事，也要做为后人作铺垫、打基础、利长远的好事。\"\n- \"作风好、形象佳，群众才会真心跟随；纪律严、政治生态好，战斗堡垒才会坚强牢固。\"\n- \"以干部敢为带动群众敢首创，在高质量发展的道路上，基层这一力量之源定会迸发出澎湃活力。\"", "案例": "- 【案例】梁家河沼气池：习近平同志带头挖沙、背水泥、办烧灰场，点亮陕北高原第一盏沼气灯——点评：以身作则破解\"群众不信\"难题，行动力凝聚人心的典范。\n- 【案例】浙江安吉余村关停水泥厂矿山，承受村集体收入断崖仍转型绿色产业，重现绿水青山——点评：正确处理当前与长远，潜绩显绩辩证，经得起\"长远看\"。\n- 【案例】浙江义乌城西街道\"村级项目招标公信平台\"全程挂网留痕；甘肃张掖建立4类小微权力清单——点评：以机制创新确保群众\"看得清\"，把权力晒在阳光下。\n- 【群像】焦裕禄、谷文昌、杨善洲——点评：模范干部群众看在眼里、感念心中，干部敢为的典型。\n---"}}, {"title": "日本〈防卫白皮书〉暴露高市谋求\"军事国家\"图谋", "date": "2026-08-12", "source": "", "themes": [], "sections": {"框架": "- 标题模板：XX暴露XX图谋（揭露式标题，适合批判类、安全类主题）\n- 开头：新闻由头引入（高市政府公布新版《防卫白皮书》）→ 定性（充斥虚假叙事、为扩军备武制造借口）→ 点明危害（引起国际社会高度警惕）\n- 分论点（揭露—分析—警示三段递进，每层一句中心句）：\n  1. 危机叙事不断升级：从\"严峻复杂\"到\"战后最严峻复杂\"再到\"新的危机时代\"，刻意营造\"兵临城下\"危机感，真实目的为突破国际法文件与和平宪法限制\n  2. 军事野心超出自卫：首次单列\"新型作战方式\"，谋求对敌基地攻击能力（熊本部署25式陆基反舰导弹射程约1000公里），\"专守防卫\"名存实亡；军工产业扩张包装为经济增长点\n  3. 警示与立场：真正威胁是日本脱离和平宪法轨道的错误防卫路线；中国坚持和平发展、防御性国防政策；国际社会须高度警惕、坚决遏止\n- 结尾升华：近代日本军国主义侵略罪行深重，日方须深刻反省历史罪责、汲取教训，停止为强军扩武找借口", "规范词": "- 渲染周边威胁 / 危机叙事不断升级\n- 突破《开罗宣言》《波茨坦公告》《日本投降书》等国际法文件及和平宪法限制\n- 专守防卫原则名存实亡\n- 谋求\"军事国家\"野心 / 再军事化\n- 防御性国防政策 / 走和平发展道路\n- 挑动阵营对抗 / 激化大国博弈和地区矛盾\n- 新型军国主义 / 战后国际秩序\n- 地缘政治私利", "金句": "- \"真正威胁日本和平与民生的，从来不是外部的'假想敌'，而是脱离和平宪法轨道、罔顾民众福祉的错误防卫路线。\"\n- \"日本政府持续以'周边安全环境恶化'为幌子推进防卫政策转向，非但不能带来真正的安全，反而会激化军事紧张、加大战争风险。\"\n- \"如何解决台湾问题是中国人自己的事，不容日方置喙。\"\n- \"近代日本军国主义的侵略罪行给亚洲各国带来深重灾难……成为威胁地区和平稳定的突出因素。\"", "案例": "- 【事件】2026年版《防卫白皮书》首次单列\"新型作战方式\"，鼓吹无人装备和AI技术运用；今年3月熊本县部署25式陆基反舰导弹，射程约1000公里，日本首次部署具备对敌基地攻击能力的远程导弹——点评：证明\"专守防卫\"已名存实亡。\n- 【政策】高市早苗政府计划年内修订\"安保三文件\"（国家安全保障战略／国家防卫战略／防卫力量整备计划），现行版本2022年底通过未满四年即急于修旧立新——点评：日本加速军事转轨的急躁心态。\n- 【国际反应】中国外交部、俄罗斯绍伊古／扎哈罗娃、韩国金周溶教授等纷纷批评；日本国内民众抗议、学者指出违宪风险——点评：地区国家与日本国内有识之士共同警惕，可作\"国际社会共识\"论证。\n- 【反面】日方将军工产业扩张包装为\"带动经济发展\"\"促进技术创新反哺民生\"——点评：揭露其\"以战促经\"算计，可作批判素材。"}}, {"title": "沙土巴\"三结义\"发出了什么信号？", "date": "2026-08-13", "source": "", "themes": [], "sections": {"框架": "- 标题模板：XX\"三结义\"发出了什么信号？（设问+现象指代式标题，适合国际关系/新现象分析类；母题可迁移：区域合作、新机制、新格局）\n- 开头：以具体事件引入（2026.8.7 沙特、土耳其、巴基斯坦签署《麦加共同防务协议》→ \"伊斯兰版北约\"说法）→ 抛出核心问题：是旧式集团安全老路，还是地区真正走向安全自主的开端？\n- 分论点结构（性质—主体—影响三段递进）：\n  1. 根源层：协议源于地区国家对美国安全承诺的普遍不信任（美以伊冲突暴露美国优先护己、忽视盟友）\n  2. 性质层：防御性政治框架而非北约式军事集团（缺统一指挥、强制出兵细则；官方强调\"不针对任何国家\"）\n  3. 影响层：削弱美在中东影响力、催生地缘新变化、标志中东安全理念深层变革（从\"等别人保护\"到\"自己想办法\"）\n- 结尾升华：协议效能待检验，但折射出地区国家\"摆脱美国设计的地区安全秩序、形成全新安全架构\"的趋势", "规范词": "- 集体防御 / 共同防务\n- 安全自主 / 安全伙伴多元化\n- 区域安全架构\n- 双重安全身份（保留传统依托+拓展新战略空间）\n- 地缘政治新变化\n- 跨区域安全网络\n- 阵营对抗 / 排他性联盟\n- 霸权护持能力衰落\n- 美国安全信誉\"透支\"\n- 相互尊重、合作及和平手段解决分歧", "金句": "- \"不放弃北约的'旧伞'，但要在中东为自己撑起一把'新伞'。\"（比喻国际关系中的双重安全身份）\n- \"从'等别人保护'转向'自己想办法'，从单一大国依赖走向安全伙伴多元化。\"\n- \"这或标志着地区正在摆脱'美国设计的地区安全秩序'，开始形成'另一种全新的安全架构'。\"\n- \"美国已'透支'自身在地区的安全信誉，其在海湾甚至整个中东影响力的基础都受到了动摇。\"", "案例": "- 【事件】2026.8.7 沙特、土耳其、巴基斯坦在麦加签署《麦加共同防务协议》，约定对任一国攻击视为对全体攻击；土耳其外长称共同防御条款\"技术上与北约相同\"——点评：可论证\"全球南方安全自主意识上升、多极化加速\"。\n- 【观点】英国皇家国际事务研究所高级研究员加利普·达莱指出\"对美国安全承诺的不信任是促成协议最关键因素\"——点评：可作\"霸权信誉衰退\"论据。\n- 【对比】伊朗\"谨慎欢迎\"（乐见美影响力削弱、又忧新联盟围伊）vs 以色列、印度表达警惕——点评：体现地区格局重塑中的复杂心态，可用于\"国际关系并非非此即彼\"论证。"}}, {"title": "别再让“事事填表”耽误正经工作》（党建评）", "date": "2026-08-14", "source": "", "themes": [], "sections": {"框架": "- 标题模板：别再让“X”耽误正经工作（“别再让…耽误…”式，适合纠偏类、作风建设类主题）\n- 开头：成绩铺垫（各地精简报表、大幅纠偏）→ 转折“然而”（少数地方仍把台账厚薄当成效）→ 切口案例（领导留言板专项征集，基层干部反映困扰）\n- 分论点（问题—根源—对策三段递进）：\n- 1. 破虚耗：填表留痕≠工作目的，“拍照留影算落实、会议记录作成果”造成精力虚耗（防汛重复填表、线上平台卡流程案例）\n- 2. 转导向：破除路径依赖，落到更合理考核制度，评价标准从“留痕多少”转到“实绩优劣”，上级主动担责而非转压基层\n- 3. 强赋能：大数据、AI 根治顽疾，“叫应”小程序减汇总、政务数据共享“向基层要→从系统取”，把精力用到群众身边\n- 结尾升华：“时代的考卷，从来都不在表格里，而在人民的心里” → 树立正确政绩观、容得下“无痕之功”、解放基层干部走到群众身边", "规范词": "- 整治形式主义为基层减负\n- 把台账厚薄当成效、拍照留影算落实、会议记录作成果\n- 工作留痕 / 精力虚耗\n- 考核管理机制 / 政绩观导向\n- 把评价标准从“留痕多少”转到“实绩优劣”\n- 容得下“无痕之功”\n- 政务数据共享平台\n- 推动数据由“向基层要”转向“从系统取”\n- 以更加昂扬向上的精气神创造高质量发展新业绩\n- 把基层干部从繁琐报表中解放出来", "金句": "- “填表留痕是为了配合考核和监管，其本身并不是基层工作的‘唯一目的’‘首要目标’。”\n- “时代的考卷，从来都不在表格里，而在人民的心里。”\n- “别再让事事填表耽误正经工作，绝不是一句轻飘飘的抱怨、呼吁，而是需要从考核管理机制和政绩观导向层面加以系统纠偏。”\n- “把评价标准从‘留痕多少’转到‘实绩优劣’上来。”\n- “容得下‘无痕之功’，把基层干部从繁琐报表中解放出来，让他们有更多时间和精力走到群众身边、解决实际问题。”", "案例": "- 【案例】人民网“领导留言板”专项征集，基层干部反映“事事填表”困扰——点评：从群众反馈渠道反证形式主义顽疾仍存，可作“倾听基层声音”论据。\n- 【案例】北京强降雨“叫应”小程序派上大用场，减少基层数据汇总、电话沟通次数，群众转移更高效——点评：以技术赋能减痕增效，可作“数字治理为基层减负”正面案例。\n- 【现象】防汛过程要求乡镇重复填报各类报表，一线人员熬夜赶材料；新线上平台缺一项系统不通过——点评：反面论证“重痕轻绩”之害。"}}, {"title": "突破底线，日本“新型军国主义”成势为患》（寰宇平）", "date": "2026-08-15", "source": "", "themes": [], "sections": {"框架": "- 标题模板：突破底线，XX成势为患（揭示式，适合国家安全/风险警示类主题）；副标题以“——XX周年历史警示（下）”设历史坐标。\n- 开头：以东京审判开庭80周年历史节点切入 → 点题“为侵略翻案、为战犯招魂的行径站在历史正义与人类良知对立面”。\n- 分论点（历史根源—现实动向—应对之道三段）：\n  - 1. 历史根源：东京审判清算未竟，军国主义思想流毒、制度残余与势力网络潜伏，是“新型军国主义”成势的深层祸根（德日对比：德国铭记反思 vs 日本淡化掩饰）。\n  - 2. 现实动向：沿“思想制造危机叙事→政治突破制度约束→军事加快备战→舆论美化战争”老路卷土重来；加速修宪扩军、突破安保、妄图拥核，屡屡在领土与台湾问题挑衅底线。\n  - 3. 应对之道：以国际共识遏制历史虚无主义与“新型军国主义”合流，受害国发正义之声、国际社会立规则约束、正义力量筑道义防线，坚决捍卫二战胜利成果与战后秩序。\n- 结尾升华：任何为侵略翻案的行径都站在历史正义与人类良知对立面；80年后重温历史警示，是对受害者告慰，更是对和平未来的守护，绝不让历史悲剧重演。", "规范词": "- 历史虚无主义\n- 战后国际秩序 / 二战胜利成果\n- 新型军国主义\n- 和平宪法第九条 / 专守防卫原则\n- 无核三原则\n- 突破战后国际法对日本的法律约束\n- 钓鱼岛是中国固有领土\n- 不干涉内政基本原则（《联合国宪章》）\n- 国际共识 / 道义防线\n- 人类命运共同体", "金句": "- “任何为侵略翻案、为战犯招魂、纵容军国主义复活的行径，都站在历史正义的对立面，也站在人类良知的对立面。”\n- “‘新型军国主义’的衡量标准从来不在于是否拥有核武器，而是要看这个国家是否具备军事扩张意图、是否在安全政策上不断突破约束、是否在区域安全事务中不断挑起事端。”\n- “东京审判审的是人类良知，判的是历史公正。”\n- “日本的历史修正主义与‘新型军国主义’深度勾连：前者洗白历史、拆除认知防线，后者改写现实、冲击和平边界。”\n- “东京审判不是一家之言……而是国际社会在世界反法西斯战争胜利基础上作出的正义裁决。”", "案例": "- 【历史对照】德国纽伦堡“600号大厅”庄严肃穆、设东京审判展区深刻反思；日本远东国际军事法庭原址深藏防卫省内、军国主义符号被刻意突出——点评：德日对待二战历史天壤之别，映照价值选择。\n- 【动向】日本防卫预算屡创新高、进攻性武器加速部署、远程打击能力成形、扬言修改“无核三原则”、妄图自主拥核——点评：军事扩张突破底线，挑战国际核不扩散体系。\n- 【法理】日本宪法第九条非“内政问题”而是战后国际秩序法律约束；违反《开罗宣言》《波茨坦公告》企图非法侵占钓鱼岛、将“台湾有事”关联“存亡危机事态”——点评：侵蚀东京审判成果、粗暴干涉中国内政。\n- 【节点】2026年东京审判开庭80周年——可作为国家安全/历史教育类大作文的时间坐标与论据支点。"}}, {"title": "以党建之“钥”开治理之“锁”》（人民时评）", "date": "2026-08-16", "source": "", "themes": [], "sections": {"框架": "- 标题模板：以XX之“钥”开XX之“锁”（比喻式，适合治理破题类）；或“党建下沉到XX，激活治理增量”。\n- 开头：以新业态蓬勃兴起、新就业群体规模扩大为背景 → 点题“在新兴领域把党的组织建起来、把治理效能提上来，成为紧迫任务”。\n- 分论点（三段，每段“做法+案例+回扣”）：\n  - 1. 织密服务网络，让“流动的人”找到“温暖的家”（河南南阳暖“新”驿站、三级党组织架构，从“过客”变“亲人”）。\n  - 2. 激活参与意识，让“治理末梢”变“前哨力量”（山西右玉县快递员外卖骑手当“流动网格员”、“随手拍”闭环响应）。\n  - 3. 点燃红色引擎，让“社会组织”成为“共治增量”（安徽合肥“网格员点单、孵化园派单、社会组织接单”模式）。\n- 结尾升华：新兴领域党建是系统工程，坚持党建引领社会工作，以服务凝聚人心、以引导激发活力，为中国式现代化贡献正能量。", "规范词": "- 新兴领域党的建设 / 两新组织\n- 党的组织覆盖和工作覆盖有形有效\n- 新就业形态劳动者\n- 党建工作做实了就是战斗力，做细了就是凝聚力\n- 流动党员党支部 / 党员流动不流失、管理不断档\n- 党建引领 / 全面从严治党\n- 共建共治共享\n- 政治引领与为民服务深度融合\n- 巡察监督体系 / 责任层层传导\n- 社会治理的“定盘星”与“主动力”", "金句": "- “增强党组织在新兴领域的号召力凝聚力影响力，不仅能引领带动新经济、新行业健康发展，更能为做好社会工作、强化社会治理提供‘定盘星’与‘主动力’。”\n- “党建工作做实了就是战斗力，做细了就是凝聚力。”\n- “新就业群体熟悉社情，是社会治理天然的‘流动网格员’。”\n- “以制度刚性倒逼责任落实，让社会工作在阳光下运行。”\n- “当新就业群体从单纯的服务对象转变为治理的参与力量，城市治理的感知触角便能更加灵敏。”", "案例": "- 【案例】河南南阳依托暖“新”驿站为快递员、网约车司机提供服务，构建三级党组织架构，流动党员找到组织归属——点评：服务先行再带党建，破解流动群体组织覆盖难题。\n- 【案例】山西右玉县快递员、外卖骑手任“流动网格员”，“随手拍”上报路面破损、安全隐患，与职能部门形成快速响应闭环——点评：新就业群体从服务对象变治理力量。\n- 【案例】安徽合肥社会组织综合党委“网格员点单、孵化园派单、社会组织接单”服务模式——点评：党建引领让社会组织成为共治增量。\n- 【案例】山东滨州将新兴领域党建纳入市委重点工作调度、巡察监督体系——点评：权力监督同步跟上，以制度刚性倒逼责任落实。"}}, {"title": "干部不负所托，群众倾心相托》（人民论坛）", "date": "2026-08-17", "source": "", "themes": [], "sections": {"框架": "- 标题模板：干部XX，群众XX（对仗互文，\"不负所托—倾心相托\"互为因果）\n- 开头：摆基层治理难题（征求意见群众不说话）→ 用\"敞开说\"新思路破题\n- 分论点（三个递进层面）：\n  1. 群众的反应是一面镜子，照见党员干部的出发点（是真为民还是作秀，群众一看便知）\n  2. 既要\"身入\"基层、更要\"心到\"基层的方法论永不过时（正定骑车下田案例）\n  3. 群众愿意敞开说，离不开党员干部踏实干，真听真改形成良性循环\n- 结尾升华：群众满意是政绩的标尺，人民支持是立身的底气；创造风吹不掉、雨淋不坏的真政绩", "规范词": "- 正确政绩观\n- 身入基层、心到基层\n- 同坐一条板凳 / 以走心拉近距离、以共情体察冷暖\n- 听民意、察民情、解民忧\n- 取信于民、凝聚人心\n- 常态长效\n- 从群众中来、到群众中去\n- 真听真改 / 件件有着落、事事有回音\n- 真政绩（风吹不掉、雨淋不坏）", "金句": "- \"四轮到，追不到；两轮到，把话唠。\"（\"四轮\"\"两轮\"喻两种工作作风，小切口对比母版）\n- \"深入基层不放松，立根原在群众中。\"\n- \"涉及老百姓的事情关键在实。\"\n- \"群众满意是政绩的标尺，人民支持是立身的底气。\"\n- \"打开天窗说亮话。\"", "案例": "- 【场景】内蒙古兴安盟科尔沁右翼中旗\"敞开说\"：小区草坪、健身广场围坐\"吐槽\"，诉求被听到被解决，烦心事变舒心事——点评：放下架子、扑下身子的群众路线新载体。\n- 【人物】习近平在正定骑自行车下田，拿起锄头锄草、间苗后与大伙唠家常谈发展——点评：\"身入+心到\"方法论的经典注脚。\n- 【人物】深圳\"卷尺哥\"两年拍千条短视频反映问题、几乎一周内解决，\"指哪改哪\"背后是\"民意速办\"机制——点评：把群众参与固化进制度，激发社会创造性。\n- 【反面】某地立法座谈会向企业广泛征求意见，企业邮件却长期\"未读\"，倾听民意成\"走过场\"——点评：只听不做等于形式主义，反衬\"真听真改\"之必要。\n---"}}]}, "经济建设": {"color": "#2563eb", "icon": "📊", "articles": [{"title": "从菲尔兹奖看中国创新积厚成势》（人民时评）", "date": "2026-07-31", "source": "", "themes": [], "sections": {"框架": "- 标题模板：从XX看中国XX积厚成势（小切口热点事件→大主题，「积厚成势」为高频规范词）\n- 开头：热点事件破题（菲尔兹奖历史性突破）→ 领袖论述定调（基础研究是源头）→ 亮明观点\n- 分论点（三个递进层面，每层一句对仗中心句）：\n  1. 向着最高峰攀登，中国人志气、骨气、底气十足（人才成果层）\n  2. 越向上生长越往深处扎根，中国基础教育积水成渊（教育根基层）\n  3. 推进中国式现代化的大舞台上，一切人才都有脱颖而出的机会（创新生态层）\n- 结尾升华：积蓄「从0到1」的力量 → 高水平科技自立自强根基不断夯实 → 创新发展势不可挡", "规范词": "- 积厚成势\n- 高水平科技自立自强\n- 原始创新和关键核心技术攻关\n- 原创性颠覆性创新\n- 「从0到1」的突破\n- 教育科技人才一体化（统筹推进）\n- 聚天下英才而用之\n- 建构优质创新生态\n- 基础教育扩优提质\n- 束缚创新的条条框框正在被打破", "金句": "- 「基础研究是整个科学体系的源头，是所有技术问题的总机关。」（习近平总书记原话，科技类必备引用）\n- 「向着最高峰攀登，中国人志气、骨气、底气十足。」\n- 「越向上生长越往深处扎根。」（可迁移：人才培养/文化传承/基层治理）\n- 「中国正以海纳百川、开放包容的气度，聚天下英才而用之。」", "案例": "- 【人物】北大校友王虹、邓煜同届双获菲尔兹奖（「数学界的诺贝尔奖」，4年一届、每届不超4人、未满40岁）——点评：回答「钱学森之问」的时代注脚，基础研究长期投入结硕果。\n- 【人物群像】梁文锋（DeepSeek创始人）、杜梦然（中科院深海所）入选《自然》2025年度十大科学人物；颜宁揭开「生命暗物质」；王兴兴人形机器人——点评：科技创新到产业创新「处处有高台」。\n- 【数据】基础研究经费占全社会研发经费比重超7%；研发人员全时当量连续13年世界第一；全球创新指数升至第10名；教育强国指数从2012年第49位跃升至第21位（同期进步最快）——点评：创新驱动的「硬指标」，作文数据论证首选。\n---"}}, {"title": "全力推动下半年经济向新向优向好发展》（求是社论）", "date": "2026-08-01", "source": "", "themes": [], "sections": {"框架": "- 标题模板：全力推动XX向新向优向好发展（「向新向优向好」三向递进式，宏观经济类高频）\n- 开头：形势研判破题（上半年顶压前行成绩）→ 中央政治局会议部署（7月30日）→ 释放高质量发展信号\n- 主体（辩证分析+六大对策的「策论体」，可压缩为3分论点）：\n  - 形势层：从供求、结构、外部三个「一方面…另一方面…」辩证看形势→「长期向好基本趋势没有改变」\n  - 对策层（六抓手，作文取其三）：①系统施策释放内需潜力 ②加快新旧动能转换 ③更加积极有为的宏观政策 ④改革释放动力活力 ⑤加强预期管理\n- 结尾升华：把政策延续性稳定性转化为预期确定性→实现改革深化与预期强化正向互动", "规范词": "- 向新向优向好 / 动能向新、结构向优\n- 顶压前行 / 主要经济指标运行在合理区间\n- 加力扩大内需、优化供给\n- 因地制宜发展新质生产力\n- 深入实施「人工智能+」行动、发展智能经济新形态\n- 逆周期调节 / 财政政策和货币政策协同配合\n- 全国统一大市场建设条例\n- 从拼优惠、拼补贴的「内卷式」竞争转向比环境、比服务的良性竞争\n- 投资于物和投资于人协同发力\n- 把政策的延续性、稳定性转化为预期的确定性", "金句": "- 「企业有活力，经济才有动力。」（营商环境/纾困类金句）\n- 「说一件、干一件、成一件。」（落实/执行力类，与政绩观互通）\n- 「用足用好优势、妥善应对挑战，我国经济发展前景依然光明。」\n- 「新旧动能此消彼长是经济转型的必经阶段。」（辩证看分化）", "案例": "- 【数据】上半年服务零售额同比增长5.3%；新动能对经济增长贡献率超四成；货物进出口总额历史同期首超25万亿元，出口增长13.4%——点评：辩证分析形势的「两点论」数据，作文可正反对举。\n- 【政策】7月30日中央政治局会议部署下半年经济工作；落实《扩大消费「十五五」规划》；制定实施全国统一大市场建设条例——点评：最新宏观政策坐标，「十五五」开局背景板。\n- 【规范表述】「六张网」规划建设、制造业数智化转型、稳岗返还+社保补贴+专项贷款「组合拳」——点评：扩内需/稳就业对策段可直接引用的政策工具箱。"}}, {"title": "用好各种机遇和优势》（今日谈）", "date": "2026-08-02", "source": "", "themes": [], "sections": {"框架": "- 标题模板：用好各种X和Y（动宾并列式，短评类；同款：抓住XX、用好XX）\n- 体裁提示：「今日谈」=**400字微型评论**，五小段、段段一句中心句。申论小作文（短评/宣传稿）最佳仿写母版。\n- 开头：形势判断＋会议定调（今年以来我国经济顶压前行、向新向优；中央政治局会议强调「用好各种机遇和优势」）\n- 分论点（三段，每段首句即观点）：\n  1. 机遇不等人，必须敏锐把握、牢牢抓住——**抢位**（产业出题、科技答题）与**错位**（因地制宜）辩证并举\n  2. 用好优势，贵在协同发力——全国统一大市场＋「两重」建设和「两新」工作＋放大政策合力\n  3. 机遇叠加优势，塑造发展胜势——工业体系＋人才储备＋全球能源转型绿色机遇\n- 结尾升华：坚定信心，迎难而上，集中精力办好自己的事 → 交出「十五五」开局之年的满意答卷", "规范词": "- 顶压前行、向新向优\n- 坚持产业出题、科技答题\n- 因地制宜推动新产业、新业态、新模式发展\n- 促进动能向新、结构向优\n- 纵深推进全国统一大市场建设\n- 有力推进「两重」建设和「两新」工作\n- 放大政策合力，变潜能为动能\n- 现代化产业体系\n- 全球能源转型的绿色机遇 / 清洁能源体系\n- 集中精力办好自己的事\n- 「十五五」开局之年", "金句": "- 「机遇不等人，必须敏锐把握、牢牢抓住。」\n- 「既要抢位……又要错位……」（辩证并举句式，可套任意二元关系）\n- 「机遇叠加优势，塑造发展胜势。」（三「势」递进，经济类点睛句）\n- 「变潜能为动能，中国经济大海定会活力激荡。」\n- 「乘势发力，发展主动权就在手中。」", "案例": "- 【政策】2026年7月中央政治局会议部署下半年经济工作，强调「用好各种机遇和优势」——点评：宏观经济类第一权威依据。\n- 【优势清单】完整的工业体系、丰富的人才储备 → 支撑现代化产业体系；全球能源转型的绿色机遇 → 打开清洁能源体系空间——点评：「我国经济优势」标准答法。\n- 【抓手清单】全国统一大市场、「两重」建设（国家重大战略实施和重点领域安全能力建设）、「两新」工作（大规模设备更新和消费品以旧换新）——点评：扩内需类必背抓手。\n---"}}, {"title": "\"融\"出舞台，经济循环增质效》（评论员观察·2026中国经济年中观察②）", "date": "2026-08-04", "source": "", "themes": [], "sections": {"框架": "- 标题模板：\"X\"出XX，经济循环增质效（引号动词+成效式，适合改革/开放/协同类；同款：改出活力、放出效率）\n- 开头：年中经济观察切入（上半年面对外部不确定性仍平稳增长）→ 抛出关键词\"融\" → 三组融合数据佐证（信息服务业+10.7%；文化艺术业+11.8%、体育业+11.9%；进出口25.5万亿元）\n- 分论点（本质—实践—保障三段）：\n  1. 本质层：\"融\"契合产业演进与市场经济规律，本质是要素重组、链条延伸，降交易成本、提全要素生产率，是构建全国统一大市场的必然要求（京津冀/长三角/大湾区）\n  2. 实践层：融合≠简单叠加，关键是包容性增强活力韧性、问题导向打破梗阻（供需/投资/外贸三个\"看\"）\n  3. 保障层：\"融\"到深处靠思想转弯、观念转变，靠体制改革、机制创新（重庆\"产业大脑\"、武汉\"世界光谷\"）\n- 结尾升华：回扣\"十五五\"规划纲要\"融合\"高频词 → \"融\"字既是改革创新金钥匙、也是提质增效先手棋 → 持续用好\"融\"字诀塑强新质生产力", "规范词": "- 坚定不移深化改革扩大开放，促进各类政策协同发力\n- 拆掉要素、行业、区域、城乡之间的无形壁垒\n- 融则通、通则活、活则进\n- 构建全国统一大市场\n- 新质生产力 / 向新向优\n- 数实融合 / 文旅融合 / 虚实融合 / 一二三产业深度融合\n- 创新链产业链资金链人才链深度融合（\"四链\"融合）\n- 投资于物和投资于人紧密结合\n- 高水平对外开放联通国内国际两个市场、两种资源\n- 以系统观念、全局视野打破壁垒、消除隔阂、统筹资源", "金句": "- \"融则壁垒消弭，通则循环顺畅，活则动能迸发，进则行稳致远。\"\n- \"拆掉要素、行业、区域、城乡之间的无形壁垒，融则通、通则活、活则进的正向循环将更加有力。\"\n- \"融合不等于简单叠加，‘融’的关键在于以包容性增强活力和韧性，以问题导向打破梗阻壁垒。\"\n- \"摒弃画地为牢的本位思维、路径依赖的惯性思维。\"\n- \"一个‘融’字，既是改革创新的金钥匙，也是提质增效的先手棋。\"", "案例": "- 【数据】上半年货物进出口总额25.5万亿元；1—6月信息传输、软件业+10.7%；前5月规上文化艺术业+11.8%、体育业+11.9%——点评：融合业态拉动增长的硬数据，论证\"融\"支撑经济向新向优。\n- 【区域】京津冀\"京津研发、河北转化\"；长三角基础设施互联+产业协同；大湾区横琴/前海/南沙/河套四大合作平台——点评：区域融合三类样板。\n- 【地方】重庆\"产业大脑\"赋能摩托车内外贸一体化；武汉\"世界光谷\"五链融合——点评：思想解放+改革破冰→发展突围案例。"}}, {"title": "小厂凭啥院士\"坐镇\"（纵横）", "date": "2026-08-05", "source": "", "themes": [], "sections": {"框架": "- 标题模板：XX凭啥YY（设问式标题，引发好奇+以小见大，适合案例型说理）\n- 开头：新闻由头（贲德院士获国家最高科技奖+其顾问的村办小厂欢腾）→ 设问\"小厂凭啥引顶尖科学家坐镇\"破题\n- 分论点（三个机制并列，每层一句中心句）：\n  1. 同频共振：锚定国家急需、被\"卡脖子\"关键领域，让科研与实业\"双向奔赴\"（高端微波基板海外垄断→国家需要什么就生产什么）\n  2. 注重转化：建立\"把论文写在车间里\"务实机制，打通基础研究到量产的\"最后一公里\"（上千次失败突破）\n  3. 久久为功：构建\"生产一代、储备一代、研制一代\"长效创新生态，企业战略眼光+容错机制+持续投入（113项专利/研发占营收15%）\n- 结尾升华：合作与成功靠使命感+务实转化+长效生态\"筑\"起来 → 高水平科技自立自强需要更多\"双向奔赴\" → 让中小企业在科技强国建设中挺起脊梁", "规范词": "- 产学研深度融合\n- 高水平科技自立自强\n- 被\"卡脖子\"的关键领域\n- 打通从基础研究到产品量产的\"最后一公里\"\n- 把论文写在车间里\n- \"生产一代、储备一代、研制一代\"长效创新生态\n- 国产化攻坚 / 专精特新\n- 科技成果落地生根\n- 科研与实业\"双向奔赴\"", "金句": "- 「双方拥有'国家需要什么就生产什么'的同频共振。」\n- 「真正的科技成果转化，不是简单的技术转让，而是科学家与工程师的密切合作。」\n- 「合作与成功不是等来的，而是靠共同的使命感、务实的转化机制和长效的创新生态'筑'起来的。」\n- 「让顶尖智慧与基层实践紧密相连，让更多中小企业在科技强国建设中挺起脊梁。」", "案例": "- 【人物/企业】雷达专家贲德院士（国家最高科学技术奖）任泰州旺灵绝缘材料厂技术顾问，村办小厂成长为高端微波材料国产化攻坚\"尖刀连\"——点评：顶尖科学家与基层企业长期携手，小厂大\"靠山\"范本。\n- 【数据】旺灵厂手握113项专利，年研发投入占营业收入比重达15%——点评：企业战略眼光与持续投入，可作\"企业创新主体\"论证。\n- 【对比】扭转传统产学研\"重理论轻实践\"\"重论文轻转化\"倾向——点评：问题导向，可作\"科技成果转化堵点\"素材。\n---\n---"}}, {"title": "依托直播间，擦亮\"县城造\"》（纵横）", "date": "2026-08-11", "source": "", "themes": [], "sections": {"框架": "- 标题模板：依托XX，擦亮\"XX\"（动宾+比喻，适合数字赋能传统产业主题）\n- 开头：场景白描（车间即直播间、流水线即展示台）+ 数据（河北9000+企业工业品直播全覆盖）\n- 分论点：\n  1. 直播间变\"云端验厂\"——直观建立信任、打通产销堵点（伯昂汽车85%订单线上 / 唐山玉田近500万订单）\n  2. 直播间变\"市场雷达\"——倒逼研发生产营销服务深层变革、按需智造（大厂京威品类6→21种）\n  3. 放大赋能效应——提升认知+优化服务，破解\"不会播、不敢播、播不好\"（公益培训专业主播）\n- 结尾：对准车间的镜头是\"县城造\"破圈支点 → 深耕细分赛道、提质创新 → 夯实县域经济高质量发展根基", "规范词": "- 县域经济高质量发展\n- 工业品直播 / 数字化营销\n- 云端验厂\n- 产能向产值高效转化\n- 按需智造 / 精细化、定制化、品牌化\n- 深耕细分赛道\n- 打通产销堵点\n- 完善配套服务 / 实操式公益培训\n- 提质创新", "金句": "- \"不用上展会，车间就是直播间；不用跑市场，流水线就是展示台。\"\n- \"对准车间的镜头，是'县城造'破圈的支点。\"\n- \"从凭经验生产到'按需智造'\"\n- \"许多企业有品质、无名气\"（概括县域制造痛点，可作问题段）\n- \"用好这一数字化支点，深耕细分赛道、坚持提质创新，就能让更多优质'县城造'站稳市场、擦亮品牌。\"", "案例": "- 【数据】截至7月10日河北超9000家工业企业开展工业品直播，实现所有县（市、区）全覆盖——点评：数字化营销已成县域经济普遍抓手。\n- 【案例】邯郸成安伯昂汽车深耕专用汽车赛道，去年销售额3.5亿元、85%订单来自线上——点评：直播间高效精准成交，突破地域局限。\n- 【案例】唐山玉田印刷机械企业常态化车间实景直播，开播两月近500万元订单——点评：展示设备精度性能优势，打通传统产销堵点。\n- 【案例】廊坊大厂京威汽车据直播间燃气车加热需求快速迭代，品类从6种拓展到21种——点评：市场雷达倒逼按需智造，规避同质化竞争。\n---"}}, {"title": "中国经济看速度更看\"稳劲\"", "date": "2026-08-12", "source": "", "themes": [], "sections": {"框架": "- 标题模板：XX看速度更看\"XX\"（辩证递进式标题，适合高质量发展／评价类主题）\n- 开头：方法论破题（稳中求进是治国理政重要原则、经济工作方法论）→ 多元视角（既要看总量速度，也要从\"稳\"看质量效益）→ 数据引入（4.7%增速、3.6万亿增量、外媒评\"展现韧性\"）\n- 分论点（四稳，每段一句中心句）：\n  1. 稳就业，民心安：高质量充分就业作为优先目标；上半年城镇调查失业率均值5.2%；新质生产力催生新职业（智能网联汽车测试员等求人倍率3以上）；新动能贡献超四成；8400万新就业形态劳动者\n  2. 稳企业，经济活：企业是创新创造主要力量、微观基础；上半年进出口首破25万亿，民企占57.0%；沪士电子18个月投224亿、长鑫科技、月之暗面开源模型；2000亿设备更新资金、1.91万亿税费红包、民营经济促进法\n  3. 稳市场，磁力强：强大国内市场是战略依托；全球产品中国\"首发\"；日均超15亿块芯片、AI第一梯队；建设统一大市场，既\"放得活\"又\"管得好\"\n  4. 稳预期，信心足：集中精力办好自己的事；上半年新设外资企业增5.3%，高技术产业引资增33.2%；\"创新红利\"构筑\"中国机遇2.0\"；市场经济也是信心经济\n- 结尾升华：7月30日中央政治局会议强调实施积极财政＋适度宽松货币、加大逆周期调节、加力扩大内需，推动经济持续向新向优向好、实现\"十五五\"良好开局", "规范词": "- 稳中求进工作总基调\n- 推动高质量发展行稳致远\n- 稳就业、稳企业、稳市场、稳预期\n- 全球经济稳定锚\n- 高质量充分就业 / 就业优先战略\n- 新质生产力催生新职业 / 就业\"蓄水池\"\n- 就业友好型发展方式\n- 统一大市场 / 既\"放得活\"又\"管得好\"\n- 逆周期调节 / 扩大内需\n- 创新红利 / \"中国机遇2.0\"\n- 经济持续向新向优向好", "金句": "- \"稳中求进工作总基调是我们党治国理政的重要原则，也是做好经济工作的方法论。\"\n- \"观察中国经济有多元视角，既要看总量、看速度，也要善于从'稳'的角度看质量、看效益。\"\n- \"作为超大型经济体，面对各种外部冲击和内部困难，中国经济'全球经济稳定锚'的作用更加凸显。\"\n- \"市场经济也是信心经济。\"\n- \"以高水平安全护航高质量发展，这是中国经济克难奋进的关键密码。\"\n- \"在一个更加不稳定不确定的世界中谋求我国发展，市场这个'最稀缺资源'就是最大潜力、最大底气。\"", "案例": "- 【数据】上半年GDP增速4.7%、经济增量3.6万亿元（近5年同期最大）；城镇调查失业率均值5.2%；新动能贡献超四成；进出口首破25万亿（民企占57%）；知识产权产品投资增9.4%；新设外资企业增5.3%、高技术产业引资增33.2%——点评：多维度印证\"稳劲\"。\n- 【企业】沪士电子18个月投224亿、长鑫科技科创板最大募资、月之暗面全球最大开源模型（估值350亿美元）、日均超15亿块芯片、AI开源大模型全球下载破百亿次——点评：企业信心与创新活力。\n- 【政策】2000亿设备更新资金、1.91万亿税费红包、民营经济促进法、消费品以旧换新、扩大消费\"十五五\"规划——点评：有形之手与无形之手合力。\n- 【地方】湖南常德职业培训、浙江天台\"含岗量\"纳入项目评估、教育部增补职教新专业——点评：就业产业教育政策咬合（可与基层治理文串联）。"}}, {"title": "中国经济向新向优向好的内在逻辑", "date": "2026-08-13", "source": "", "themes": [], "sections": {"框架": "- 标题模板：XX的内在逻辑（本质追问式标题，适合解读政策/现象类；母题：高质量发展、某项成就的根本原因）\n- 开头：中央政治局会议定调（\"推动经济持续向新向优向好发展，努力实现'十五五'良好开局\"）→ 设问\"为什么能\" → 点出答案\"在思想中、在规律中、也在实践中\"\n- 分论点结构（三个\"从…看…\"并列，每段一域实践→全局规律）：\n  1. 从金融适配实体经济看现代化产业体系建设：因地制宜、科学决策是关键（\"算投入产出账，提高适配度\"）\n  2. 从\"信用浙江\"建设看全国统一大市场：立破之道（破除壁垒+建立标准，政府规范→市场有效）\n  3. 从\"两张报表\"看统筹发展和安全：系统观念（经济报表+平安报表，发展与安全一体两翼）\n- 结尾升华：从党的创新理论中悟规律、明方向、学方法、增智慧，以新发展理念为引领，推动经济持续向新向优向好", "规范词": "- 现代化产业体系\n- 实体经济为支撑\n- 因地制宜、科学决策\n- 提高适配度 / 算投入产出账\n- 地瓜经济（跳出浙江发展浙江）\n- 全国统一大市场 / 立破之道\n- 破除地方保护和市场分割\n- \"五统一\"（基础制度、基础设施、政府行为尺度、监管执法、要素资源市场）\n- 统筹发展和安全 / 一体之两翼、驱动之双轮\n- 总体国家安全观", "金句": "- \"中国式现代化不能走脱实向虚的路子，必须加快建设以实体经济为支撑的现代化产业体系。\"\n- \"脚要踩在大地上。我们干任何事情都有内在规律。\"\n- \"发展出题目，改革做文章。\"\n- \"政府行为越规范，市场作用就越有效。\"\n- \"看得见的手\"不再\"大包大揽\"，而是拆藩篱、破堵点、立标准、建平台\n- \"安全是发展的前提，发展是安全的保障。\"\n- \"既发挥了市场经济的长处，又发挥了社会主义制度的优越性\"\n- \"以新发展理念为引领，统筹国内和国际，兼顾需要和可能、当前和长远\"", "案例": "- 【数据】上半年我国制造业增加值占GDP比重26.2%，比3年前提高0.4个百分点——点评：实体经济根基稳固，论证\"现代化产业体系\"成效。\n- 【政策/实践】\"地瓜经济\"理论（2004年提出）、义乌\"给成长快的孩子换上一件大衣服\"权限下放改革——点评：地方探索上升为全国指引，论证\"改革适配发展\"。\n- 【政策/实践】\"信用浙江\"（2002年起归集数十部门政务数据、建全省公共信用平台）→ 2022年《加快建设全国统一大市场的意见》——点评：\"立破之道\"从一域到全国。\n- 【机制】浙江\"两张报表\"（经济报表+平安报表）每月更新20余年；金华曹宅镇民生信访量同比降80%以上——点评：统筹发展和安全的基层样本。"}}, {"title": "以扩大优质供给推动消费升级》（专题深思）", "date": "2026-08-14", "source": "", "themes": [], "sections": {"框架": "- 标题模板：以XX推动XX（“以扩大优质供给推动消费升级”式，政策举措→目标，适合供给侧改革类主题）\n- 开头：消费定位（经济增长重要引擎、美好生活直接体现）+ 习近平论述（中央经济工作会议、7月底政治局会议）+ 总论点（既是破解供需错配现实需要，也是满足美好生活战略选择）\n- 分论点（总—分三段，每段“提升/培育/拓展+供给”）：\n- 1. 提升商品供给质量：以科技创新为支撑，人工智能、绿色低碳融合消费品工业，改造传统产业+壮大新兴产业未来产业（即时零售、以旧换新绿色智能商品案例）\n- 2. 培育服务消费新优势：服务消费高频次强体验长链条，实施提质惠民行动，放宽养老托育医疗文旅准入（观赛旅游、博物馆奇妙夜、冰雪经济、银发经济案例）\n- 3. 拓展优质供给新空间：用好两个市场两种资源，扩大服务业开放，以开放促竞争促提质（进博会155国834.9亿美元、免签扩圈、入境8200万人次案例）\n- 结尾升华：内需成为拉动经济增长主动力和稳定锚，为构建新发展格局、推动高质量发展提供坚实支撑", "规范词": "- 供需适配 / 供需结构性错配\n- 把实施扩大内需战略同深化供给侧结构性改革有机结合起来\n- 以优质供给引领和创造需求\n- 消费扩容升级\n- 适应不同群体消费需求（精准施策，避免“一刀切”）\n- 内需真正成为拉动经济增长的主动力和稳定锚\n- 畅通国民经济循环 / 构建新发展格局\n- 增品种、提品质、创品牌（破解同质化竞争）\n- 以开放促竞争、以竞争促提质\n- 挖掘服务消费潜力", "金句": "- “供给和需求是经济发展的一体两面。”\n- “以新需求引领新供给，以新供给创造新需求，进而在二者的动态平衡中畅通国民经济循环。”\n- “消费需求正从‘有没有’转向‘好不好’，品质化、个性化、多样化特征日益鲜明。”\n- “‘适应不同群体’体现了施策要精准……避免‘一刀切’；‘扩大优质供给’是路径。”\n- “使内需真正成为拉动经济增长的主动力和稳定锚。”", "案例": "- 【数据】上半年社会消费商品和服务零售总额同比+2.7%，最终消费支出拉动GDP增长2.1个百分点，持续发挥经济增长第一拉动力——点评：消费“第一拉动力”可作宏观数据论据。\n- 【数据】我国人均GDP超1.3万美元，需求从“有没有”转向“好不好”——点评：消费升级的阶段判断，论证供给侧改革必要性。\n- 【政策】《关于增强消费品供需适配性进一步促进消费的实施方案》提出5方面举措——点评：政策工具箱，可作“政策供给”论据。\n- 【案例】第八届进博会155国参与、意向成交额834.9亿美元；2025年入境外国人超8200万人次——点评：扩大开放促国内供给升级，内外联动良性互动。"}}, {"title": "壹时评：一碗拉面的“正名”之路》（壹时评）", "date": "2026-08-15", "source": "", "themes": [], "sections": {"框架": "- 标题模板：一碗XX的“XX之路”（以小见大，适合特色产业/品牌经济/消费类主题）。\n- 开头：新闻由头（“兰州拉面”在多地改名“青海拉面”引热议）→ 点题“不只是更名，更是一场系统性变革”。\n- 分论点（问题—规范—价值三段）：\n  - 1. 问题：近40年品牌错位——拉面是青海的、招牌是兰州的，“有实无名”；两地如何突出地域特色、走差异化发展必由之路。\n  - 2. 规范：青海发布《青海拉面品质指南》等三项地方标准，迈入标准化、品牌化；自愿申请+政府补贴改造升级、统一产品标准与质量管理，打造区域公用品牌惠及全链条。\n  - 3. 价值：从“脱贫面”到“文化名片”，是柳州螺蛳粉、沙县小吃、杭州小笼包等从“走出去”到“走得稳、走得远”的缩影，带着中国饮食文化走向世界。\n- 结尾升华：区域公用品牌是高质量发展根基，标准化品牌化让特色产业行稳致远、惠及民生。", "规范词": "- 区域公用品牌\n- 标准化、品牌化发展\n- 差异化发展\n- 地方标准 / 品质指南\n- 品牌战略规划\n- 惠及产业链各环节\n- 消费名品名单\n- 国家职业标准\n- 高质量发展根基\n- 从“走出去”到“走得稳、走得远”", "金句": "- “从‘兰州拉面’到‘青海拉面’，不只是一次简单的更名，更是一场系统性的变革。”\n- “拉面是青海的，但招牌却是兰州的；对兰州来说，名头叫‘响’了，但跟自己没什么关系。”\n- “打造鲜明的区域公用品牌，有助于惠及产业链上的各个环节。”\n- “这碗从西北高原走出来的面，从最初解决数万人生计的‘脱贫面’，到如今带着中国饮食文化走向世界的‘文化名片’。”\n- “它的成长轨迹，正是……中国特色美食群体，从‘走出去’到‘走得稳、走得远’的生动缩影。”", "案例": "- 【数据】青海拉面遍布全国三百多座城市、3万余家门店、年营业收入超200亿元——点评：特色产业规模与民生带动。\n- 【对比】“兰州牛肉面”1999年列中式三大快餐试点、2021年入选国家级非遗、2025年入选首批中国消费名品并启动国家职业标准编制——点评：标准化品牌化让“后来者”走稳走远。\n- 【政策】青海省市场监管局发布《青海拉面品质指南》《青海拉面赛事活动规范》《青海拉面区域品牌培育与建设指南》三项地方标准——点评：以标准护航产业高质量发展。\n- 【群像】柳州螺蛳粉、沙县小吃、杭州小笼包——点评：中国美食群体“走出去”到“走得远”的群体样本，可论证区域公用品牌建设。"}}, {"title": "年轻人扎堆五金店，看中国如何释放创造力》（人民锐评）", "date": "2026-08-16", "source": "", "themes": [], "sections": {"框架": "- 标题模板：XX扎堆XX，看中国如何XX（现象引入+宏大命题，适合创新/活力类）；或“从XX到XX，勾勒中国创新轮廓”。\n- 开头：以“五金爆改手办”社交话题切入 → 点题“年轻人偏爱五金店，是对‘创造’本身的渴望”。\n- 分论点（三层递进：现象隐喻—创新源泉—制度启示）：\n  - 1. 现象隐喻：螺丝螺母拼装机器人，没有预设图纸、形态全凭心意，线下门店构成“创新支持系统”。\n  - 2. 创新源泉：从螺帽到飞船，核心动力始终是“人对创造的冲动”，无数个体微光汇聚社会进步星河。\n  - 3. 制度启示：中国创新生态优势在于完备产业体系+超大市场规模+差异化需求层次，容纳全谱系创新实验。\n- 结尾升华：尊重自发探索、厚植创新生态，让每份创造热情被看见被接住被成全，创新活力如江河奔涌。", "规范词": "- 释放创造力 / 释放社会创造力\n- 规模化创新\n- 创新生态\n- 超大规模市场优势\n- 完备产业体系\n- 差异化、多样化的需求层次\n- 全谱系创新实验\n- 尊重市场自发活力\n- 扎根真实需求 / 在实践中试错迭代\n- 降低创新成本、提高创新收益", "金句": "- “创新的源泉，永远是人本身。”\n- “正是无数个体不甘平庸、勇于尝试的微光，汇聚成推动社会进步的星河。”\n- “这种赋能不是刻意的规划，而是对市场自发活力的尊重与呵护，本质上也是对‘人’的创造力的释放。”\n- “既仰望星空，也脚踏实地；既能支撑国之重器的研发，也能为微小的创新种子提供生长的土壤。”\n- “当‘拧螺丝’的巧思与‘上太空’的壮志在同一片土地上并存共生，这个社会的创新活力便会如江河奔涌、不可阻挡。”", "案例": "- 【现象】“五金爆改手办”社交话题发酵，年轻人用螺丝、螺母、弹簧垫圈拼装机器人、“轩辕圣剑”——点评：大众自发创造，可作“释放社会创造力”鲜活论据。\n- 【案例】江苏无锡全国首家农业机器人4S店，机器人成“机器人员工”实地检验“靠机器人种地能否盈利”——点评：创新扎根真实需求、边种边卖。\n- 【案例】广东佛山73岁全国劳模黄小池签约“穿越者壹号”亚轨道太空旅游项目——点评：民营经济/商业航天大胆试飞，创新无年龄界限。\n- 【论点】中国创新生态优势：完备产业体系+超大市场规模+差异化需求层次，容纳全谱系创新——点评：可作“创新驱动发展”宏观框架。"}}, {"title": "培育更多\"中国服务\"品牌》（金社平）", "date": "2026-08-17", "source": "", "themes": [], "sections": {"框架": "- 标题模板：培育更多\"XX\"品牌（品牌化战略母版）\n- 开头：数据破题（服务业增速5.2%>经济增速）+ 政治局会议部署 + 全国服务业大会 + 总书记论述定调\n- 主体（三大并列层面，可压缩为3分论点）：\n  1. 培育\"中国服务\"品牌，是顺应经济发展规律、推动经济转型升级的必然选择（体量/历史/百姓期待/新质生产力四维）\n  2. 因地制宜、精准施策是基本方法论（生产性服务业\"两业融合\"、生活性服务业\"一老一小\"分层施策）\n  3. 以创新之\"新\"抢占先机，以品质之\"实\"赢得口碑（制度型开放 + 打铁还需自身硬）\n- 结尾升华：从\"卖产品\"到\"卖服务\"，从\"中国制造\"到\"中国服务\"，汇聚高质量发展澎湃动能", "规范词": "- 服务业扩能提质 / 服务业高质量发展\n- 生产性服务业向专业化、价值链高端延伸\n- 生活性服务业高品质、多样化、便利化\n- 两业融合（先进制造业与现代服务业深度融合）\n- 系统升级\n- 恩格尔系数\n- 生存型消费 → 发展型消费\n- 微笑曲线\n- 制度型开放 / 边境后壁垒 / 负面清单\n- 全要素生产率 / 新质生产力", "金句": "- \"品牌就是效益，就是竞争力，就是附加值。\"（《之江新语》）\n- \"以创新之'新'抢占先机，以品质之'实'赢得口碑。\"\n- \"从'卖产品'到'卖服务'，从'中国制造'到'中国服务'。\"\n- \"从全球经济发展规律来看，当人均GDP突破1万美元后，服务消费占比快速提升。\"", "案例": "- 【数据】服务业占GDP比重59.5%、对经济增长贡献率66.1%；恩格尔系数2025年降至29.3%（改革开放初超60%）；预计2030年服务业总规模迈上100万亿元；中等收入群体超4亿——点评：论证\"主引擎\"地位的首选硬数据。\n- 【政策】北京\"北京服务\"、上海服务业\"十五五\"规划\"上海服务\"、重庆\"渝贸全球\"——点评：地方服务品牌建设梯度示范。\n- 【企业】蜜雪冰城全球门店近6万家，智能供应链（消费数据→种植数据、30个仓库97%冷链覆盖）——点评：服务品牌\"自身硬\"的微观样本。\n- 【现象】\"苏超\"\"村超\"出圈、\"跟着演出去旅行\"、30分钟\"万物到家\"——点评：服务消费已成美好生活刚需。\n---"}}]}, "文化建设": {"color": "#7c3aed", "icon": "📚", "articles": [{"title": "把文学当最好的庄稼种》（纵横）", "date": "2026-07-31", "source": "", "themes": [], "sections": {"框架": "- 标题模板：把XX当最好的庄稼种（比喻式标题，文化+乡土类通用；同款：把论文写在大地上）\n- 开头：设问破题（短视频时代还有人热爱文学吗？）→ 反差数据回答（山区小县竟是「文学之乡」）\n- 分论点（现象→人物→归因递进）：\n  1. 现象层：小县城藏着大文学（数据支撑）\n  2. 人物层：黄土地上的普通人，文字治愈人心（群像举例）\n  3. 归因层：文学艺术的成长离不开乡土的滋养（文化根脉+山乡巨变+精神力量三重归因）\n- 结尾升华：新时代文艺暖风吹拂万千村庄 → 烟火生活、古村落、老技艺等待被书写 → 广袤田野升腾无限可能", "规范词": "- 文化根脉 / 赓续文化基因\n- 诗意栖居\n- 精神富足 / 对生命意义的叩问\n- 乡土的滋养\n- 山乡巨变\n- 城乡融合走向纵深\n- 乡村的生态、文化与经济价值日益凸显\n- 落笔成为滚烫的文字", "金句": "- 「把文学当最好的庄稼种。」（比喻金句，文化振兴/精神生活类）\n- 「那些田埂间的默默生长、移民路上的风雨兼程、致富路上的笑逐颜开，落笔成为滚烫的文字。」（排比+具象化）\n- 「文学艺术的成长离不开乡土的滋养。」\n- 「那些流淌于田野间、炕头上、窗台下的烟火生活，正等待被书写、被传扬。」", "案例": "- 【数据】宁夏西吉县人口不足50万，1600余人从事文学创作、三四百名农民作家，获誉「文学之乡」；西海固作家累计发表作品超3000万字，获「五个一工程」奖、鲁迅文学奖、骏马奖——点评：文化振兴不在庙堂在民间，反驳「快餐时代文学已死」。\n- 【人物群像】明星村康鹏飞白天干活晚上写作；高同村李成山牛圈贴满诗歌「写完就揣兜里」；关口村曹兵的诗「平淡、朴素、克制，却直戳读者心窝子」——点评：普通人的精神追求，可用于「物质富足与精神富有」主题。\n- 【经典参照】《白鹿原》刻下民族的灵魂印记；油画《父亲》每一道皱纹都诉说土地的故事——点评：乡土是文艺创作的母体。\n---"}}, {"title": "把中华文明的重要名片擦得更亮》（求是网评）", "date": "2026-08-01", "source": "", "themes": [], "sections": {"框架": "- 标题模板：把XX擦得更亮（动宾式，文化/名片/形象类；同款：把中国故事讲得更精彩）\n- 开头：热点事件破题（景德镇手工瓷业遗存申遗成功，第61项世界遗产）→ 领袖论断（「中华文明的重要名片」）→ 点明历史性成就\n- 分论点（家底→指引→成就三层递进）：\n  1. 家底层：文化遗产承载中华民族基因血脉，中华瑰宝「家底」更厚、保护更实、活力更足\n  2. 指引层：党的十八大以来党中央高度重视，习近平文化思想科学指引（「三个有利于」）\n  3. 成就层：申遗与文物保护取得历史性变革（18项入选+文物保护法修订+系统性保护路径）\n- 结尾升华：站在「十五五」新起点，赓续历史文脉→把名片擦得更亮→以中华文明之光照亮文明互鉴之路", "规范词": "- 中华文明的重要名片\n- 留住文化根脉、守住民族之魂\n- 赓续历史文脉 / 延续千年文脉\n- 「家底」更厚、保护更实、活力更足\n- 文化遗产系统性保护和统一监管督察\n- 从被动应对到主动规划、从关注遗产本体到统筹整体环境、从行业单打独斗到社会协同治理\n- 地上地下统筹、人文自然融合、物质非遗并重\n- 担负起新时代的文化使命\n- 文明交流互鉴", "金句": "- 「千年窑火，映照文明之光。」（对仗金句，陶瓷/文明类）\n- 「中华文明是世界上唯一绵延不断且以国家形态发展至今的伟大文明。」（文明连续性必备表述）\n- 「老祖宗传下来的优秀传统文化，我们要继续攥在手里，与时俱进，让它发扬光大。」（习近平总书记原话）\n- 「申报项目要有利于突出中华文明历史文化价值，有利于体现中华民族精神追求，有利于向世人展示全面真实的古代中国和现代中国。」（「三个有利于」）", "案例": "- 【案例】「景德镇手工瓷业遗存」2026-07-25列入《世界遗产名录》，填补「瓷」主题空白，成为中国第61项世界遗产——点评：最新文化热点，文明传承/申遗类首选事例。\n- 【案例群像】普洱景迈山古茶林（农耕文明智慧）、北京中轴线（「中」「和」哲学）、西夏陵（丝路中继枢纽）——点评：多元遗产群像，铺陈中华文脉厚度。\n- 【数据/政策】党的十八大以来18个项目入选世界遗产，总数居世界前列；新修订《文物保护法》正式施行；《非物质文化遗产法》修改列入立法规划——点评：文化遗产保护法治化、成就化的硬支撑。"}}, {"title": "以新思路打开文旅新可能》（微观）", "date": "2026-08-02", "source": "", "themes": [], "sections": {"框架": "- 标题模板：以新X打开Y新可能（「以…打开…」句式，适合改革转型类；同款：以新供给创造新需求）\n- 开头：问题切入（强迫购物乱象是推动文旅产业高质量发展必须克服的顽疾）→ 数据佐证成效（一升一降）→ 引出治本之策\n- 分论点（三段并列，**每段首句为六字对仗小标题**，考场极易复制）：\n  1. **创新模式才能开源**——顺应游客新需求、消费新偏好，找到新的创收途径\n  2. **服务升级才能留客**——从自然风光浅层呈现，转向讲好故事、活态转化、文化赋能\n  3. **「文旅+百业」的融合正在打破行业边界**——构建多元协同、全域联动的文旅生态\n- 结尾升华：唯变不变，以变制胜 → 摒弃「躺赚」观念 → 让更多风景成为游客心中的「诗与远方」", "规范词": "- 推动文旅产业高质量发展\n- 「低价引流—高额返佣—强制购物」利益链条\n- 跳出单一经营模式，探索转型发展之路，才是治本之策\n- 顺应游客新需求、消费新偏好\n- 讲好故事、活态转化、文化赋能\n- 从「流量吸引」迈向「价值创造」\n- 产业乘数效应不断放大\n- 多元协同、全域联动的文旅生态\n- 从单点突破到生态繁荣的发展跨越\n- 形成与新需求匹配的供给能力和发展模式", "金句": "- 「创新模式才能开源」「服务升级才能留客」（对仗分论点，直接可用）\n- 「用门票『减法』换来消费『加法』。」（减法/加法对举）\n- 「旅游的魅力，正从『我曾看过』转向『我体验过，仍心向往之』。」\n- 「工业旅游让生产线变成风景线，研学旅行让行走成为课堂。」（同构排比）\n- 「唯变不变，以变制胜。」（八字收尾）\n- 「让更多风景成为游客心中的『诗与远方』。」", "案例": "- 【数据】2026年上半年查处涉及强迫购物案件同比增长86.9%，同期全国文化和旅游市场网上举报投诉处理系统接收旅游投诉量下降24.2%——点评：「一升一降」是治理成效的经典表述法，可迁移到任何专项整治题。\n- 【案例】杭州西湖景区门票「减法」换消费「加法」，低门槛引流、高黏性消费；四川甘孜藏族自治州「终身畅游卡」撬动温泉、文创、餐饮住宿二次消费。\n- 【案例】陕西西安「盛唐夜景」游客与杜甫、白居易扮演者对诗；浙江绍兴古镇木作坊提供原汁原味木工体验——点评：沉浸式体验/文化活态转化。\n- 【新业态清单】博物馆夜游、沉浸式非遗工坊、国潮文创街区、主题民宿集群、「跟着赛事去旅行」——点评：文旅新业态举例万能库。\n---"}}, {"title": "国产动画何以\"闹海\"》（人民时评）", "date": "2026-08-04", "source": "", "themes": [], "sections": {"框架": "- 标题模板：XX何以\"X\"（设问式破题，适合产业/文化现象分析；同款：国潮何以出圈、非遗何以焕新）\n- 开头：由现象切入（2026暑期档多部国产动画集中上映、票房口碑兼具）→ 落点：比爆款更重要的是推进\"精品化、协作化、智能化\"，走出\"高原耸起、高峰林立\"的自主创新之路\n- 分论点（生命线—怎么做—引擎三段，对应精品化/协作化/智能化）：\n  1. 精品化是生命线：内容精良、制作考究才能票房口碑双赢（《八仙！》重塑\"仙\"的内涵、东方美学特效、长焦景深镜头语言）\n  2. 协作化回答\"怎么做\"：跨团队协同、上下游联动，成都天府长岛\"10分钟协作圈\"全链条协同\n  3. 智能化激活引擎：超七成头部企业引入AI、2026年AI微短剧超20万部，从辅助工具到全流程赋能\n- 结尾升华：从拿来主义→文化自信自强、从人力密集→技术驱动 → 探索体现中国审美的产业路径", "规范词": "- 国产动画产业的精品化、协作化、智能化\n- \"高原\"耸起、\"高峰\"林立的自主创新之路\n- 中华优秀传统文化的创造性转化、创新性发展\n- 文化出海 / 文化消费\n- 深入提炼传统文化中的哲思与情感精髓\n- 拒绝浮躁、精耕细作\n- 覆盖全链条的协同生产体系\n- 多模态视频模型 / 数智赋能（智能化落地）\n- 从拿来主义走向文化自信自强\n- 体现中国审美的产业路径和发展逻辑", "金句": "- \"比爆款何时问世更值得关注的话题，是加快推进国产动画产业的精品化、协作化、智能化。\"\n- \"精品化是国产动画的生命线。\"\n- \"把分散的创作力量拧成一股绳。\"\n- \"从拿来主义走向文化自信自强，从人力密集模式迈向技术驱动创新。\"\n- \"国产动画的下一场‘闹海’，就在不远的未来。\"", "案例": "- 【作品】《八仙！》刻画有私欲有缺点的市井小人物、重塑\"仙\"的内涵——点评：创造性改编传统题材、连接当代生活的范例。\n- 【园区】四川成都高新区天府长岛数字文创园\"10分钟协作圈\"，创意策划到后期配音全流程园内协同——点评：产业集群协同降本增效样板。\n- 【数据】超七成动漫头部企业引入AI；2026年全网上线AI微短剧超20万部——点评：智能化从辅助到全流程赋能的硬数据。"}}, {"title": "从修典中读懂时代变迁（微观）", "date": "2026-08-05", "source": "", "themes": [], "sections": {"框架": "- 标题模板：从XX中读懂XX（以小见大式，适合从具体事物透视时代/文化）\n- 开头：新闻由头（五卷本《现代汉语大词典》出版，1200余万字/15.7万条/40余万配例）→ 数字引出\"几代人65年心血\"\n- 分论点（为何值+如何编+有何用三层）：\n  1. 为何值：科学系统释义葆有文化共识，一词一义斟酌理解语言精微（语言演进长河中的基本共识）\n  2. 如何编：准确使用是规范前提（吐蕃读音改回Tǔfān，查证海量语料）；严谨细致与兼收并蓄并行（守正、纳新、存故、多元）\n  3. 有何用：留存现代汉语活态档案；AI时代为模型训练提供高质量语料，助力中文理解\n- 结尾升华：文字是文明的根，语言是文化的魂 → 守住规范底线、拥抱时代新声 → 在共同语言中相逢相认（民族认识自身、表达时代、走向未来）", "规范词": "- 守正、纳新、存故、多元（收词原则）\n- 语言文字规范 / 保持语言文字规范\n- 雅俗共收、新旧并存\n- 引领语言规范的价值\n- 留存活态档案\n- 赓续文脉 / 文化传承\n- 高质量语料库\n- 兼收并蓄", "金句": "- 「一部工具书，何以值得几代人耗费如此多心血？答案藏在厚重的卷册里。」\n- 「语言文字的使用要有一定之规，但它也是一条流动的河。」\n- 「文字是文明的根，语言是文化的魂。」\n- 「守住规范使用的底线，拥抱时代发展的新声。」\n- 「无论过去多久、走得多远，我们都能在彼此理解的共同语言中相逢相认。」", "案例": "- 【数据/工程】五卷本《现代汉语大词典》1200余万字、收词15.7万条、配例40余万；1961年设想到成书跨越65年，14轮校次、200多项专项检查——点评：几代学人接续努力，工匠精神范本。\n- 【考据】编写组翻查《新唐书》《资治通鉴》《明史》等，将\"吐蕃\"读音改回\"Tǔfān\"——点评：严谨实证，可作\"文化自信/求真\"素材。\n- 【理念】收词\"守正、纳新、存故、多元\"，收录\"新质生产力\"\"月壤\"\"村超\"及网络词\"后浪\"\"实锤\"\"佛系\"——点评：守正与创新统一，传统与现代并存。\n---\n---"}}, {"title": "读懂\"文物微笑\"背后的意涵》（人民时评）", "date": "2026-08-11", "source": "", "themes": [], "sections": {"框架": "- 标题模板：读懂\"XX\"背后的意涵（以小见大，适合文化现象评论）\n- 开头：由具体特展引入（辽博\"微笑\"特展300余件文物获赞）\n- 分论点：\n  1. 文物是固态历史、民族记忆——\"微笑\"勾勒安乐市井图景，诠释乐观天性（击鼓说唱俑 / 陶庖厨俑）\n  2. 从静态陈列到价值深度阐释——创造性转化让学术象牙塔走向大众心灵（故宫\"最小干预\"活态保护 / 宝鸡何尊\"宅兹中国\"数字化）\n  3. 构建多层次立体化文物解读体系——研究+传播+普及三路径（38家机构联手 / 线上展厅 / 研学文创）\n- 结尾：器物无声，文化深流 → 深耕文物阐释、创新文博传播 → 凝聚磅礴文化力量", "规范词": "- 文化自信\n- 创造性转化、创新性发展\n- 文博事业 / 文物活化\n- 价值深度阐释\n- 活态遗产保护（最小干预、微创发掘）\n- 数字化手段 / 线上展厅\n- 多层次、立体化文物解读体系\n- 中华文明赓续\n- 可触摸、可共情的精神范本", "金句": "- \"专业的考古发现与研究成果，唯有通过契合时代语境的创造性转化，才能更好从学术象牙塔走向大众心灵，成为滋养文化自信的源头活水。\"\n- \"文化自信不是一句抽象的口号，而是源自一砖一瓦的精神建构。\"\n- \"心怀所爱、笃守良善，正是中华民族屡经磨难、愈挫愈勇的密钥。\"\n- \"器物无声，文化深流。\"\n- \"让千年陶俑的笑意成为可触摸、可共情的精神范本\"", "案例": "- 【案例】辽宁省博物馆\"微笑——文物里的中国精神印记\"特展，联合全国38家文博机构、汇聚300余件文物——点评：以\"微笑\"小切口激活文化自信大主题。\n- 【案例】国博东汉击鼓说唱俑、成都博物馆东汉陶庖厨俑——点评：文物承载乐观天性、市井烟火，是民族精神具象载体。\n- 【案例】故宫\"最小干预、微创发掘\"活态保护、边发掘边展示；宝鸡青铜器博物院何尊\"宅兹中国\"数字化\"开口说话\"——点评：学术研究与现代表达兼容，让文物可感知。\n- 【案例】辽博特展基于38家机构合作，打通研究/传播/普及三重路径——点评：多方协同是让沉睡文物\"开口\"的必由之路。\n---"}}, {"title": "新时代铸就文化自信的思想指引和实践遵循", "date": "2026-08-12", "source": "", "themes": [], "sections": {"框架": "- 标题模板：XX铸就XX的思想指引和实践遵循（理论阐释型标题，适合文化自信／理论类大作文母版）\n- 开头：宏观定调（十八大以来总书记把文化建设摆在突出位置，创造性提出文化自信并列为\"四个自信\"）→ 点明意义（习近平文化思想核心范畴）→ 提出学习主线（《习近平谈治国理政》第一至五卷通读）\n- 分论点（提出—阐发—践行三段）：\n  1. 提出是时代必然：从\"三个自信\"到\"四个自信\"，文化自信是更基础、更广泛、更深厚的自信；从大历史观看是强国建设民族复兴的历史必然\n  2. 深入阐发重要地位核心要义：基础性地位（更基本、更深沉、更持久的力量）；本质是文化主体性体现（\"有了文化主体性，就有了文化意义上坚定的自我\"）；丰富内涵（中华优秀传统文化／马克思主义文化／社会主义核心价值观三个层面）；根本途径是\"两个结合\"\n  3. 转化为实际行动：根本途径坚持\"两个结合\"；在\"七个着力\"上下功夫；文化建设着眼于人、落脚于人（满足精神文化需要、提高国家文化软实力）\n- 结尾升华：贯通学习《习近平谈治国理政》第一至五卷，进一步增强文化自信，创造无愧于时代的更加光辉灿烂的新文化，为实现中华民族伟大复兴贡献力量", "规范词": "- 文化自信 / \"四个自信\"\n- 更基础、更广泛、更深厚的自信；更基本、更深沉、更持久的力量\n- 文化主体性 / 文化意义上坚定的自我\n- 两个结合（马克思主义基本原理同中国具体实际／中华优秀传统文化相结合）\n- 魂脉（马克思主义）与根脉（中华优秀传统文化）\n- 七个着力\n- 举旗帜、聚民心、育新人、兴文化、展形象\n- 创造性转化、创新性发展\n- 中华文明突出特性（连续性、创新性、统一性、包容性、和平性）\n- 国家文化软实力 / 国际话语权\n- 文化强国建设", "金句": "- \"文化自信就来自我们的文化主体性\"\"有了文化主体性，就有了文化意义上坚定的自我，文化自信就有了根本依托。\"\n- \"中国有坚定的道路自信、理论自信、制度自信，其本质是建立在5000多年文明传承基础上的文化自信。\"\n- \"我们讲要坚定文化自信，不能只挂在口头上，而要落实到行动上。\"\n- \"历史正反两方面的经验表明，'两个结合'是我们取得成功的最大法宝。\"\n- \"文化强国之'强'最终要体现在人民的思想境界、精神状态、文化修养上。\"\n- \"中华优秀传统文化是我们在世界文化激荡中站稳脚跟的根基。\"", "案例": "- 【理论】\"两个结合\"：马克思主义魂脉＋中华优秀传统文化根脉；\"结合\"的五个维度（前提彼此契合、结果相互成就、筑牢道路根基、打开创新空间、巩固文化主体性）——点评：文化自信根本途径，可作理论论证母版。\n- 【理论】中华文明五个突出特性（连续性／创新性／统一性／包容性／和平性）——点评：文化自信内涵的经典概括，万能素材。\n- 【部署】2023年10月全国宣传思想文化工作会议提出习近平文化思想、\"七个着力\"——点评：文化建设里程碑，作政策依据。\n- 【脉络】文化自信从《习近平谈治国理政》第一卷概念呼之欲出，到95周年大会正式提出\"四个自信\"——点评：理论发展脉络，可作\"与时俱进\"论证。"}}, {"title": "强健千年瓷都的\"文化心脏\"（连线评论员）", "date": "2026-08-13", "source": "", "themes": [], "sections": {"框架": "- 标题模板：强健XX的\"文化心脏\"（隐喻式标题，\"文化心脏\"喻文化遗产对城市的生命支撑；母题：文化遗产、城市文脉、以文塑城）\n- 开头：对话体破题（人民日报+江西日报评论员连线）→ 由\"景德镇手工瓷业遗存\"申遗成功（填补名录\"瓷\"主题空白）引出价值之问\n- 分论点结构（对话递进：价值→保护→破局→永续）：\n  1. 价值层：非孤立文物，而是\"原料—生产—贸易—生活\"完整产业体系（45点位、1979公顷、宋元明清四代）\n  2. 保护层：活态传承（\"见人见物见生活\"、72道工序生产性保护、居民社区参与）\n  3. 破局层：资源枯竭城市靠\"陶瓷+\"模式多元转型（陶溪川文创、先进陶瓷进军新赛道）\n  4. 永续层：让人民成为参与者、受益者（划定活化底线、保留原生业态、人才政策留人）\n- 结尾升华：人文经济学生动实践——\"在保护中发展、在发展中保护\"，让文脉传承与长效发展双向奔赴，文化让城市更动人", "规范词": "- 活态保护 / 活态传承\n- 见人、见物、见生活\n- 系统性保护\n- 生产性保护（传统制瓷工序）\n- 全产业链文明综合体（申遗新理念）\n- 文化资源是一座城市取之不竭的宝库\n- 陶瓷+模式 / 文化赋能\n- 文脉永续、产业造血、市民共享\n- 在保护中发展、在发展中保护\n- 人文经济学", "金句": "- \"最好的保护是生生不息的活态传承。\"\n- \"最宝贵的财富是人。\"\n- \"一瓷承文脉，一城向新行。\"\n- \"保护但不束之高阁，利用但不过度消费。\"\n- \"历史的厚重就会变成发展的底气，传统的温度也能点燃创新的火花。\"\n- \"让遗产从'标本'变'生活'，从'景点'变'家园'。\"\n- \"文化遗产的系统性保护，本质上是让城市葆有一颗'文化心脏'。\"", "案例": "- 【事件】\"景德镇手工瓷业遗存\"列入《世界遗产名录》，填补名录\"瓷\"主题空白；申遗历时11年、保护近半世纪——点评：中国文化遗产保护国际认可度提升。\n- 【数据】聚集3400余名非遗传承人、10万余名青年创客、6万余名\"景漂\"；陶溪川去年游客近300万人次——点评：人才+流量双轮，论证\"最宝贵财富是人\"。\n- 【数据】去年景德镇陶瓷产业总产值首破千亿元，先进陶瓷（新材料）占比超1/3；曾列入第二批资源枯竭城市——点评：资源枯竭城市靠文化破局的典范，论证\"文化资源取之不竭\"。\n- 【模式】陶阳里\"三区合一\"（社区/遗产区/景区）、240商业空间活化、3000多户原居民留住——点评：活态保护样本，反对\"博物馆式\"冻结保护。"}}, {"title": "构建中国政治学自主知识体系的成效与前瞻》（加快构建中国哲学社会科学自主知识体系）", "date": "2026-08-14", "source": "", "themes": [], "sections": {"框架": "- 标题模板：构建中国XX自主知识体系的成效与前瞻（“构建…自主知识体系”式，适合文化自信/理论自立类主题）\n- 开头：习近平论述（加快构建中国特色哲学社会科学，归根结底建构中国自主知识体系）+ 政治学定位（阐释制度、研究治理、解读实践）→ 总论点（落实指示精神、回应世界之变时代之变历史之变）\n- 分论点（成效三维度+前瞻，可压缩为3）：\n- 1. 夯基础：学术基础夯实、学科体系完善，构建“大政治学”布局，引入历史学田野调查推动本土化（全过程人民民主、中国式现代化学理研究）\n- 2. 出原创：标识性概念集群形成，“民主观”“治理观”“大党之治”“中国之治”打破西方话语垄断\n- 3. 强实践+拓国际：实践导向鲜明，围绕全面从严治党、协商民主、基层治理创新提政策建议；国际视野拓展，交“世界怎么了、我们怎么办”中国答卷\n- 4. 前瞻：坚持“两个结合”，把中国经验提升为中国理论，创造融通中外的政治学新命题，为人类政治文明百花园增光\n- 结尾升华：政治学是经世致用、治国安邦的学问，自立自强、与时代同行、为人民做学问，为构建中国哲学社会科学自主知识体系添砖加瓦", "规范词": "- 加快构建中国特色哲学社会科学，建构中国自主的知识体系\n- 以中国为观照、以时代为观照，立足中国实际、解决中国问题\n- 创造性转化、创新性发展（两个结合）\n- 知识创新、理论创新、方法创新\n- 标识性概念 / 原创性理论\n- 打破西方政治学话语垄断\n- 中国之治 / 大党之治 / 民主观 / 治理观\n- 融通中外的政治学话语\n- 中国特色、中国风格、中国气派\n- 把中国经验提升为中国理论", "金句": "- “加快构建中国特色哲学社会科学，归根结底是建构中国自主的知识体系。”\n- “以中国为观照、以时代为观照，立足中国实际，解决中国问题。”\n- “打破长期以来西方政治学话语的垄断地位。”\n- “政治学是经世致用、治国安邦的学问。”\n- “把中国经验提升为中国理论，回答中国式现代化建设的重大理论和现实问题。”\n- “中国政治学人坚持自立自强、与时代同行、为人民做学问。”", "案例": "- 【概念】“民主观”“治理观”“大党之治”“中国之治”成为自主知识体系重要组成，展现学理阐释力传播力——点评：标识性概念集群，可作“理论自立”论据。\n- 【学科】构建“大政治学”布局，涵盖政府行政、公共管理、国家安全，发展全球治理、中国学等新兴交叉学科；引入历史学、田野调查方法——点评：学科体系完善路径。\n- 【实践】围绕全面从严治党、协商民主、基层治理创新开展针对性研究，提前瞻性政策建议——点评：实践导向，理论服务决策。\n- 【国际】围绕构建人类命运共同体、中国道路世界意义开展比较研究，交“世界怎么了、我们怎么办”中国答卷——点评：国际视野，中国理论走出去。"}}, {"title": "教育科技人才“三位一体”的强国策》（人民观点·《习近平谈治国理政》通读）", "date": "2026-08-15", "source": "", "themes": [], "sections": {"框架": "- 标题模板：XX“三位一体”的强国策（理论阐释型母版：提出—脉络—内涵—成就—路径，适合科教/文化强国主题）。\n- 开头：以习近平总书记“一体推进教育科技人才发展，是我们在实践中摸索总结的成功经验”破题 → 点出“基础性、战略性支撑”。\n- 分论点（理论—成就—路径三段）：\n  - 1. 理论脉络：从分域深耕到协同联动再到“三位一体”系统性升华；二十届三中全会一体改革、十五五规划设专章，制度化推进。\n  - 2. 历史成就：教育基础更坚实（最大教育体系、2895县域义务教育均衡、高校输送5500万人才）；科技实力跃升（全球创新指数前十、基础研究经费占比破7%、重大成果系统爆发）；人才量质齐升（专业技术人才超8000万、研发人员当量13年世界第一）。\n  - 3. 实践路径：坚持教育优先发展、科技自立自强、人才引领驱动，将“三股劲”拧成“一股绳”。\n- 结尾升华：今年是十五五开局之年，将“三位一体”战略部署转化为发展成效，为中国式现代化提供坚实支撑。", "规范词": "- 教育、科技、人才是全面建设社会主义现代化国家的基础性、战略性支撑\n- 科技是第一生产力、人才是第一资源、创新是第一动力\n- 三位一体 / 一体推进 / 良性循环\n- 新型举国体制\n- 高水平科技自立自强\n- 新质生产力\n- 四个面向（世界科技前沿、经济主战场、国家重大需求、人民生命健康）\n- 破四唯、立新标\n- 揭榜挂帅、赛马制\n- 聚天下英才而用之 / 以教育之强夯实国家富强之基", "金句": "- “一体推进教育科技人才发展，是我们在实践中摸索总结的成功经验。”\n- “科技是第一生产力、人才是第一资源、创新是第一动力。”\n- “科技创新靠人才，人才培养靠教育，教育、科技、人才内在一致、相互支撑。”\n- “关键核心技术是要不来、买不来、讨不来的。”\n- “将‘三股劲’拧成‘一股绳’，为高质量发展提供驱动力，为强国复兴蓄势赋能。”\n- “教育、科技、人才使命同源、目标同向、进程同步，构筑起中国式现代化不可替代的基础性、战略性支撑。”", "案例": "- 【数据】我国已建成世界最大教育体系；2895个县域全部实现义务教育基本均衡；“十四五”累计输送5500万人才；2025年首入全球创新指数前十、基础研究经费占比首破7%——点评：教育科技人才历史性成就。\n- 【数据】专业技术人才超8000万、技能劳动者超2.2亿、研发人员全时当量连续13年世界第一；45岁以下青年任重点研发计划负责人超四成——点评：人才量质齐升。\n- 【案例】“中国天眼”新发现、“人造太阳”刷新纪录、超算“灵晟”登顶；浙江杭州“六小龙”——点评：科技创新点状突破迈向系统爆发、人才生态生动注脚。\n- 【地方溯源】河北正定“人才九条”吸引200多名人才；福建“经济靠科技，科技靠人才，人才靠教育”；浙江“八八战略”顶层规划——点评：总书记地方治理探索的思想溯源。"}}, {"title": "从“挑错”到“共建”，博物馆应有“打开门”的自信》（人民锐评）", "date": "2026-08-16", "source": "", "themes": [], "sections": {"框架": "- 标题模板：从“XX”到“XX”，XX应有“打开门”的自信（对比递进+意象，适合开放/自信类）；或“XX当有‘打开门’的自信”。\n- 开头：以湖南益阳博物馆错字连篇、浙江博物馆“地球的红飘带”展低级错误切入 → 点题“公众找茬非吹毛求疵，而是对权威文化阵地的更高期待”。\n- 分论点（问题—根源—路径三段）：\n  - 1. 问题：低级错误“多看一眼就能扫雷”，无任何开脱余地，暴露工作态度松弛、审核机制形同虚设。\n  - 2. 根源：依赖机器图文转换直接上墙、内部记录当正式文案，粗放潦草显敷衍懈怠。\n  - 3. 路径：跳出封闭保守思维，主动拥抱公众监督——河南安阳博物馆“全民挑错·共建文博”活动，把被动“挑错”变主动“共建”。\n- 结尾升华：效仿“一字千金”重在内核——用一丝不苟、精益求精的专业态度赢得权威、建立自信。", "规范词": "- 文化自信 / “打开门”的自信\n- 公共文化服务 / 文化阵地\n- 开放包容\n- 共建共享 / 全民共建\n- 精益求精 / 一丝不苟\n- 专业态度 / 极致专业\n- 主动拥抱公众监督\n- 品质监督员\n- 亲民 / 贴近群众\n- 权威性与亲和力统一", "金句": "- “公众给博物馆‘找茬’、较真细节纰漏，并非吹毛求疵，而是大家默认：博物馆是承载历史、传播文化的权威阵地，容不得敷衍了事、粗制滥造。”\n- “想要根治低级错误，博物馆内部既要严把审核关口，更要跳出封闭保守的思维，主动拥抱公众监督。”\n- “鼓励公众充当‘品质监督员’，把被动的‘挑错’变成主动的‘共建’。”\n- “用一丝不苟、精益求精的专业态度去赢得权威、建立自信。”\n- “眼下，一些博物馆也不妨扪心自问，自己是否拥有这种‘打开门’的自信？”", "案例": "- 【反面】湖南益阳博物馆提示牌“匕首”写“七首”、“单刃”写“单刀”、“宗教”写“宗救”；浙江博物馆“地球的红飘带”展“休息”写“体息”、“红军”写“红车”——点评：低级错误暴露审核机制虚设。\n- 【正面】河南安阳博物馆发起“全民挑错·共建文博”活动，指出错误可获奖，把被动挑错变主动共建——点评：开放姿态激活公众监督，可作“共建共治”论据。\n- 【典故】吕不韦编《吕氏春秋》悬千金于城门求一字之改——点评：以“一字千金”喻专业自信，可作文化自信/精益求精论据。"}}, {"title": "创作岂能悬浮半空》（纵横）", "date": "2026-08-17", "source": "", "themes": [], "sections": {"框架": "- 标题模板：XX岂能悬浮半空（反问式现象批评母版）\n- 开头：热点剧集\"评分未开、争议先来\"——成绩单造假引发质疑，引出\"悬浮病\"\n- 主体：两类\"病症\"（生活被滤镜覆盖 / 逻辑让位于剧情）→ 危害（不让人信服、损及根本）→ 根子（倒果为因的创作路径）\n- 结尾升华：文艺描摹这片土地的故事、面对普通老百姓，悬浮半空何以触碰人心", "规范词": "- 文艺作品\"悬浮病\"\n- 源于生活、高于生活\n- 以人民为中心的创作导向\n- 扎根人民、扎根生活\n- 现实主义\n- 接地气 / 带着\"毛边\"的真实表达\n- 精品力作\n- 创造性转化、创新性发展\n- 文化自信", "金句": "- \"创作允许想象和夸张，但所有的'高于生活'都必须建立在'源于生活'的前提之上。\"\n- \"生活本身打磨出来的真实感自有千钧之力。\"\n- \"如果总晃晃悠悠悬浮在半空，又何以触碰人心？\"\n- \"那些真实生活的粗粝感、窘迫感被悉数抹去，剩下的就只有浮在半空中的'虚假完美'。\"", "案例": "- 【反面】某剧集女主语文148分、数学英语满分，配角成绩按名次等差递减，被嘲\"Excel随机生成\"——点评：\"堆砌天才人设\"脱离真实。\n- 【反面】设定打工人的主角住市中心豪华大平层、年代剧穷人衣服比现在人还干净——点评：\"生活被滤镜覆盖\"的典型。\n- 【正面】搬瓜少年给久未见面的妈妈写信（满纸涂改、泪痕晕染）打动无数人——点评：未经打磨的真实感自有力量，可对比悬浮剧。\n---"}}]}, "社会建设": {"color": "#059669", "icon": "🤝", "articles": [{"title": "以法之名，剑斩网暴！》（人民锐评）", "date": "2026-07-31", "source": "", "themes": [], "sections": {"框架": "- 标题模板：以法之名，剑斩XX（短促有力的锐评式标题；大作文可转化为「以法治利剑护航清朗网络空间」）\n- 开头：立法事件破题（《反网络暴力法（征求意见稿）》公布）→ 悲剧案例痛陈危害 → 「这把法治利剑来得正是时候」\n- 分论点（对策三段式，均以「以法止暴」领起——同主题词领起式分论点范例）：\n  1. 以法止暴，贵在抓早抓小（平台前置治理：风险标签、不得算法推荐、账号分类分级）\n  2. 以法止暴，就要让受害者敢于维权、执法者敢于亮剑（公安及时立案，给维权底气）\n  3. 反网暴，最重要的还是源头治理——「头」是每一个网民（网络素养教育从娃娃抓起）\n- 结尾升华：「键盘不是凶器，匿名不是铠甲」→ 期待法律落地生根 → 终有一日实现「网络无暴」", "规范词": "- 网络生态秩序 / 清朗网络空间\n- 高位阶立法 / 充分回应群众期待\n- 关口前移 / 抓早抓小 / 靠前干预\n- 平台治理 / 分类分级管理\n- 源头治理\n- 有法可依 / 依法惩治\n- 「流量至上」（批判用语）\n- 雪崩效应（群体盲从的规范化表达）", "金句": "- 「键盘不是凶器，匿名不是铠甲。」（网络治理类顶级金句）\n- 「键盘不见血，也能伤人。」\n- 「网暴像野火，蔓延快、爆发强、伤害深。」（比喻论证范例）\n- 「当成千上万网民参与其中，引发雪崩效应，『吃瓜』便可能成为『吃人』。」\n- 「用退让隐忍换片刻安宁。这种无奈，不应成为结局。」", "案例": "- 【反面案例】寻亲男孩刘学州被恶毒揣测推入「深海」；「粉发女孩」郑灵华因头发颜色遭恶意诋毁离世——点评：网暴危害不亚于现实暴力的铁证，慎用但有力。\n- 【政策】《反网络暴力法（征求意见稿）》：设「平台治理」专章（风险标签/禁算法推荐/账号分级）、要求公安及时立案侦查、反网暴纳入课程体系——点评：立法逻辑=平台前置+执法兜底+教育固本，可直接迁移为对策段三层次。\n- 【机制观察】平台「防网暴专区」多为事后响应、依赖受害者自证申诉——点评：被动治理的典型问题表述，用于问题分析段。\n---"}}, {"title": "评比表彰容不得\"有价荣誉\"》（人民锐评）", "date": "2026-08-01", "source": "", "themes": [], "sections": {"框架": "- 标题模板：XX容不得\"YY\"（否定式立场标题，治理/整治类；同款：民生工程容不得「豆腐渣」）\n- 开头：政策施行破题（8月1日《社会组织评比表彰活动管理办法》，9项禁止情形）→ 亮明导向（向「有价荣誉」说不）\n- 分论点（意义→乱象→治理→升华四层）：\n  1. 定性层：评比表彰是社会评价体系的「风向标」，意在褒扬先进、示范引领\n  2. 问题层：「花钱买牌」乱象（奖项牟利/收评审费/漫天要价）加重负担、扰乱秩序、透支公信力\n  3. 对策层：清单化、禁令式治理全链条堵漏洞（切断权力资本通道+源头遏制以奖牟利+严控范围）\n  4. 升华层：树立正确政绩观，既解决「干什么」也解决「怎么看」\n- 结尾升华：荣誉无价，规矩有形→老百姓的口碑才是最高规格的「荣誉牌匾」", "规范词": "- 让荣誉回归本真 / 回归激励初心\n- 「有价荣誉」「花钱买牌」（批判用语）\n- 清单化、禁令式治理 / 全链条堵住漏洞\n- 严密的制度闭环\n- 打「擦边球」、蹭活动卖荣誉（无处遁形）\n- 树立和践行正确政绩观\n- 政绩不能靠名头加持、靠牌匾装点\n- 项目清单管理 / 刚性制度守住公平底线\n- 风清气正的行业生态", "金句": "- 「荣誉无价，规矩有形。」（对仗金句，整治/规范类顶级）\n- 「老百姓的口碑，才是最难赢得、最有分量，也最高规格的『荣誉牌匾』。」（结尾升华金句）\n- 「称号有多响亮，并不等于工作有多扎实；牌匾有多醒目，也代替不了群众的切身感受。」（排比对比）\n- 「减去的是基层不必要的负担，让基层干部多走几户群众、多听几句实话、多办几件实事。」", "案例": "- 【政策】2026年8月1日《社会组织评比表彰活动管理办法》施行，明确9项禁止情形：不得面向党政机关评比、禁止与营利组织合作承办、严禁收费、每个社会组织原则上只设1个项目、一般每5年一次——点评：社会组织规范治理、基层减负的最新制度，对策段可直接引用。\n- 【反面现象】有社会组织与营利机构合作把奖项当牟利工具；巧立名目收评审费、牌匾费；以「城市」「之乡」「基地」名义向地方漫天要价——点评：评比表彰乱象的问题段典型表述。\n- 【理念】树立正确政绩观「既要解决『干什么』，也要解决『怎么看』」——点评：与政治建设《领导干部既要谋事又要干事》呼应，政绩观母题跨主题串联。"}}, {"title": "这条专线，容得下公文包也装得下竹背篓》（党建评）", "date": "2026-08-02", "source": "", "themes": [], "sections": {"框架": "- 标题模板：容得下A也装得下B（**对举式包容型标题**，适合治理温度、包容性发展类；同款：既装得下高楼也放得下小摊）\n- 开头：**场景白描开头（申论开头最高阶写法）**——「凌晨四点半，重庆轨道交通4号线石船站口，十几只背篓沿墙排开，篓沿探出沾露的菜叶」→ 引出「背篓专线」\n- 分论点（平衡诉求 → 打通城乡 → 各地推广，由个案到普遍）：\n  1. 「背篓专线」在社会多元诉求中寻找到利益平衡点（柔性措施替代一刀切）\n  2. 打通城乡通道，进一步激活要素流通（背篓菜市、背篓轮渡、完整链条）\n  3. 应民所需、因地制宜的治理思路，在各地城市治理中多有体现（义乌、日照类比排比）\n- 结尾升华：为民造福是最大政绩 → 城市不仅要有高度，更要有温度 → 创造经得起人民和历史检验的实绩", "规范词": "- 城市精细化治理、促进城乡融合发展\n- 在多元诉求中寻找最大公约数\n- 没有采取一刀切的管控手段，而是采取柔性措施\n- 让规则不失温度、包容不失底线\n- 激活要素流通\n- 打通农产品进城「最后一公里」\n- 应民所需、因地制宜\n- 破解「急难愁盼」\n- 公共服务更好触达群众心坎，持续释放民生温度\n- 为民造福是最大政绩 / 树立和践行正确政绩观\n- 经得起人民和历史检验的实绩", "金句": "- 「精细化治理要跳出『非此即彼』思维，在多元诉求中寻找最大公约数，让规则不失温度、包容不失底线。」（社会治理万能中心句）\n- 「为民造福是最大政绩。」\n- 「城市不仅要有高度，更要有温度。」（高度/温度对举，城市治理必备）\n- 「方寸之间装着民生冷暖。」\n- 「商贸名城义乌盘活闲置街角，在秩序中留住了烟火；山东日照打造山海绿道，在海岸边守住了生活。」（双例对仗排比）\n- 「持续办好群众身边小事，才能创造经得起人民和历史检验的实绩。」", "案例": "- 【案例·核心】重庆轨道交通4号线「背篓专线」：设置「背篓车厢」、引导乘坐升降电梯、提前首发站开门时间、试点方言报站、工作人员协助老年菜农搬运；2024年成为重庆年度关键词，2026年伊始被国台办点赞「助农便民」——点评：**2026年最热民生治理案例**，可用于精细化治理、城乡融合、以人民为中心、包容性治理等多题。\n- 【案例·延伸】盘活闲置防空洞建成接驳轨道的「背篓菜市」，免费摊位为菜农卸下成本重负，形成「乡村采摘—轨道运输—城区售卖」完整链条；江面推开「背篓轮渡」示范航线，水陆并进。\n- 【案例·类比】浙江义乌盘活闲置街角，在秩序中留住烟火；山东日照打造山海绿道——点评：一句一例的排比举例法。\n- 【母题串联】与 2026-08-01 入库的《领导干部既要谋事又要干事》同属「正确政绩观」母题，一理论一案例，可组合使用。\n---"}}, {"title": "不作无补之功，不为无益之事》（大家谈·认识基层 深入基层 服务基层①）", "date": "2026-08-04", "source": "", "themes": [], "sections": {"框架": "- 标题模板：不作X之功，不为X之事（古语对仗式，适合基层/实干/正确政绩观；同款：不做表面文章、不耍花拳绣腿）\n- 开头：由《习近平关于基层工作方法论述摘编》出版引语（\"不作无补之功，不为无益之事\"应成为为民办实事座右铭）→ 点明主题：走好新时代党的群众路线、树立正确政绩观\n- 分论点（三则来稿各一角度，考试可压缩为三点）：\n  1. \"不生分\"见功夫（浙江宁波）：沉下去的脚力+真感情，将心比心、换位思考，把群众\"好差评\"当\"正衣镜\"\n  2. 懂得\"听劝\"（新疆和田）：站在群众视角看问题，问需于民、问效于民，避免把\"自我满意\"等同\"群众愿意\"\n  3. \"摘门椒\"的启示（安徽铜陵）：基层工作要全局意识+长远眼光，避免\"解决一个问题留下十个遗憾\"\n- 结尾升华：怀真感情、办好办妥办到心坎上；以从善如流的自觉、事事有回音——责任与价值", "规范词": "- 树立和践行正确政绩观\n- 走好新时代党的群众路线\n- 为民办实事 / 提高办实事的水平\n- 将心比心、换位思考，杜绝居高临下、颐指气使\n- 把群众的\"好差评\"作为干部的\"正衣镜\"、政绩的\"度量衡\"\n- 问需于民、问效于民\n- 避免把\"自己认为\"等同于\"群众认可\"、把\"自我满意\"等同于\"群众愿意\"\n- 以从善如流的自觉、紧抓不放的韧劲、事事有回音的态度办好民生小事\n- 全局意识、长远眼光（跳出\"重当下、轻长远\"误区）", "金句": "- \"‘不作无补之功，不为无益之事’，应成为我们为民办实事的座右铭。\"\n- \"走村入户，不只需要有沉下去的脚力，还要有‘不生分’的功夫。\"\n- \"事情办了，不等于办好。基层服务不能光看‘做了没有’。\"\n- \"既有全局意识，也有长远眼光，这是种辣椒的秘诀，也是做好基层工作的一个诀窍。\"\n- \"怀有真感情，把群众事办好、办妥、办到心坎上。\"", "案例": "- 【场景】浙江宁波年轻联村干部帮老大爷操作手机交费，两分钟解决，打开话匣子——点评：\"不生分\"的真感情胜过提纲式走访。\n- 【场景】新疆和田水渠救生绳由横拉改斜拉、休闲座椅挪到树荫旁，皆因\"听劝\"——点评：把准群众需求、问需于民的小切口。\n- 【比喻】安徽铜陵\"摘门椒\"：过早摘致徒长、过晚摘致营养不良，喻基层工作需全局+长远——点评：农谚喻理，申论类比论证高分素材。"}}, {"title": "文旅\"擦边\"几时休？》（人民锐评）", "date": "2026-08-05", "source": "", "themes": [], "sections": {"框架": "- 标题模板：XX几时休？（反问诘责式，适合整治乱象/纠偏主题）\n- 开头：个案由头（贵州贵定洛北河漂流\"伴漂服务\"擦边被查）→ 上升到\"绝非孤例\"\"畸形生态\"定性\n- 分论点（三问递进，每层一问一答）：\n  1. 一问落地：是否有前置审查？合作协议如何过审、项目准入/履行/巡查层层失守→管理责任不容推卸\n  2. 二问屡禁：为何屡禁不止？深挖文化需长期投入 vs 擦边成本低短期获利；\"割韭菜式\"监管（养肥再杀、曝光才管）→ 纠正短视逻辑、堵住漏洞\n  3. 三问情绪价值：是否被滥用？将人际亲密关系商品化，模糊服务与有偿陪侍边界→文旅创新须以向善为底色\n- 结尾升华：文旅创新本质是对优质内容/文化内涵/人性化服务深耕，非突破公序良俗红线 → 告别\"曝光才治理\"被动局面，建前置审查+常态化巡查+联合执法长效机制 → 把资源优势转化为发展长势", "规范词": "- 前置审查 / 常态化巡查 / 联合执法\n- 长效治理机制\n- 公序良俗 / 法律红线\n- 重招商、轻监管，重收益、轻底线\n- \"曝光才治理\"的被动局面\n- 把资源优势转化为发展长势\n- 文旅融合的根本\n- 精细化管理", "金句": "- 「它如同一面镜子，映照出近年来部分文旅项目以'创新'为名、行低俗之实的畸形生态。」\n- 「漂流可以逐浪而行，文旅发展却不能追逐低俗之流。」\n- 「文旅创新若不以向善为底色，再绚烂的'情绪'终究只是泡沫。」\n- 「只有不忘文旅融合的根本，才能真正把资源优势转化为发展长势。」\n- 「绿水青山的吸引力，终究源于其自然之美与服务之诚。」", "案例": "- 【反面个案】贵州贵定洛北河漂流\"伴漂服务\"被指擦边，7月31日责令停业整顿——点评：个案折射\"重收益轻底线\"营销通病。\n- 【现象群】NPC\"喂糖\"低俗互动、以\"剧本杀\"为名行暧昧体验——点评：套路如出一辙，可作\"文旅乱象谱系\"素材。\n- 【监管病灶】\"割韭菜式\"监管（养肥了再杀、曝光了才管）+ 层层失守（准入/合同/巡查）——点评：可作\"监管被动/运动式治理\"问题段。\n---\n---"}}, {"title": "招考公平，不容\"暗门\"》（人民锐评）", "date": "2026-08-11", "source": "", "themes": [], "sections": {"框架": "- 标题模板：XX公平，不容\"XX\"（对仗警示式，适合底线类主题：公平/安全/诚信）\n- 开头：热点事件引入（雷州事业单位招考第一名被\"劝退\"事件）\n- 分论点：\n  1. 个案也是警钟——规则关键在不折不扣落实，招聘全流程不容伸黑手（亲属回避机制未落实）\n  2. 考务人员懂规则、知敬畏、明边界——制度防线（2024年《关于进一步做好事业单位公开招聘工作的通知》防范\"近亲繁殖\"）\n  3. 切除病灶要雷厉风行，整治生态要久久为功——疏通诉求反馈闭环（复盘工单流转、限时答复）\n- 结尾：公开透明公正是招考公信力基石 → 承载\"努力就有回报\"底气 → 守护每一个向上进取的梦想", "规范词": "- 社会公平 / 考试公平\n- 公开招考公信力\n- 防范\"近亲繁殖\"\n- 亲属回避机制\n- 考风考纪\n- 慢作为、不作为\n- 诉求反馈闭环\n- 雷厉风行、久久为功\n- 举一反三、堵塞漏洞", "金句": "- \"公开招考关乎社会公平，绝不能开任何'人情暗门'。\"\n- \"'用分数说话、靠能力竞争'已是不可撼动的原则。\"\n- \"切除病灶，要雷厉风行；整治生态，要久久为功。\"\n- \"公开透明、公平公正，是所有招考公信力的基石。这块基石，承载着普通人相信'努力就有回报'的底气。\"\n- \"规则，关键在于不折不扣抓落实\"", "案例": "- 【案例】广东雷州事业单位招考，副校长利用职务泄露考生信息、利益许诺劝退笔试第一名，6人被党纪政务处分和组织处理——点评：招考公平底线被\"人情暗门\"击穿的典型警示。\n- 【反面】考生5月下旬两次投诉，至8月3日第二名仍在拟聘公示，暴露慢作为、不作为——点评：诉求反馈闭环梗阻，监督机制失效。\n- 【政策】2024年8月中央组织部、人社部《关于进一步做好事业单位公开招聘工作的通知》要求防范\"近亲繁殖\"、亲属关系主动报告——点评：制度已有，关键在落实回避机制与纪律教育。\n- 【方法论】顺藤摸瓜排查各环节、复盘工单流转与限时答复——点评：举一反三疏通群众诉求闭环梗阻。\n---"}}, {"title": "用数智力量赋能基层治理", "date": "2026-08-12", "source": "", "themes": [], "sections": {"框架": "- 标题模板：用XX力量赋能XX（动宾赋能式标题，适合基层治理／数字政府／科技惠民类）\n- 开头：场景白描引入（2026世界人工智能大会上海曹杨\"掌中宝\"智能体预热发布）→ 点题（推进基层治理数智化，未来场景令人期待）\n- 分论点（机遇—风险—路径三段）：\n  1. 机遇：轻量化、场景化、低成本方案涌现，释放乘数效应；北京密云基层干部花20余元、月余开发防汛\"叫应\"小程序（可视化调度隐患点／雨情／转移状态）——技术降低门槛注脚\n  2. 风险：技术门槛降低≠风险门槛降低；算法偏见、数据泄露、责任归属不清等隐患；需把握鼓励创新与规范发展平衡，坚持技术向善、强化全流程监管、保障个人信息权益\n  3. 路径：赋能建立在服务不缩水、管理不打折基础上；江苏宿豫网格群AI助手24小时答高频问题、安徽阜阳AI监控\"柔性喊话\"劝导占道经营——\"面对面\"＋\"屏对屏\"，便民不扰民、提效不添乱\n- 结尾升华：提升基层干部数字化素养和风险识别能力，防止\"不会用／不敢用\"也避免\"盲目用／胡乱用\"，以数智力量助力基层治理提质增效，增强群众获得感、幸福感、安全感", "规范词": "- 基层治理数智化 / 数字赋能基层治理\n- 面对面服务 ＋ 屏对屏技术\n- 便民而不扰民、提效而不添乱\n- 轻量化、场景化、低成本应用方案\n- 释放乘数效应 / 全要素生产率\n- 缩小数字鸿沟\n- 技术向善 / 鼓励创新与规范发展平衡\n- 全流程监管 / 保障个人信息权益\n- 获得感、幸福感、安全感\n- 数字化素养与风险识别能力", "金句": "- \"既做好'面对面'的服务，也用好'屏对屏'的技术，确保人工智能应用便民而不扰民、提效而不添乱，才能实实在在增进群众福祉。\"\n- \"技术门槛的降低，并不意味着风险门槛同步降低。\"\n- \"应用越普及，算法偏见、数据泄露、责任归属不清等潜在隐患越不容忽视。\"\n- \"在为民造福的正确轨道上跑出加速度，不断增强群众的获得感、幸福感、安全感。\"", "案例": "- 【案例】上海曹杨街道\"美好生活·掌中宝\"智能体：属地化语料库＋语音问答＋安防／便民地图\"小而精\"模块——点评：基层数智化服务升级样本。\n- 【案例】北京密云基层干部花20余元、约1个月用大模型开发防汛\"叫应\"小程序，实现隐患点／雨情／转移可视化调度——点评：技术降低门槛，基层干部即开发者，可作\"普惠高效\"论证。\n- 【案例】江苏宿豫网格群AI助手24小时答社保入学高频问题并分类推送网格员；安徽阜阳AI监控\"柔性喊话\"劝导占道经营、派单城管——点评：\"面对面＋屏对屏\"双线治理。\n- 【风险】算法偏见、数据泄露、责任归属不清——点评：科技向善与监管必要性，可作辩证段。"}}, {"title": "以科技向善促民生改善（现场评论）", "date": "2026-08-13", "source": "", "themes": [], "sections": {"框架": "- 标题模板：以XX促XX（目的导向式标题，动作+目标；母题：科技向善、数字惠民、治理为民）\n- 开头：两个现场对照（上海老楼加装电梯告别\"拎马桶\" vs 习主席在2026世界人工智能大会提出\"以人为本、向上向善\"）→ 提炼内在一致：\"现代化的本质是人的现代化\"\n- 分论点结构（场景铺陈→观点升华→案例印证）：\n  1. 场景层：AI赋能千行百业（智能体科研、机器人协同、洋山港调度、社区语音助手助老）\n  2. 立场层：人民是受益者也是参与者、创造者、评价者（以人民为中心确保创新跨越鸿沟）\n  3. 案例层：上海市民新村\"一户一策\"旧改（群众心愿进方案、成效交居民评判）\n- 结尾升华：科技向前，人民至上；读懂\"中国式现代化，民生为大\"，持续书写民生答卷", "规范词": "- 科技向善 / 以人为本、向上向善\n- 现代化的本质是人的现代化\n- 造福于民\n- 以人民为中心\n- 科技精度丈量民生刻度\n- 系统性创新重构\"人—城—业\"关系\n- 一户一策（精细化治理）\n- 民生为大\n- 获得感、幸福感、安全感\n- 高质量发展成果转化为红利", "金句": "- \"现代化的本质是人的现代化。\"\n- \"前沿技术与朴素民生在一座城里相汇，人们更能读懂'中国式现代化，民生为大'。\"\n- \"坚持用科技精度丈量民生刻度。\"\n- \"人民既是城市建设的受益者，也是参与者、创造者、评价者。\"\n- \"科技向前，人民至上。\"\n- \"一间独立厨卫的面积有限，但分量很重，里面装着普通家庭对美好生活的期盼。\"", "案例": "- 【场景】上海黄浦区半淞园路街道市民新村：4幢50年代老楼加装电梯、改造厨卫，从合用厨卫到独立厨卫——点评：老旧小区改造民生样本。\n- 【场景】2026世界人工智能大会习主席提出\"以人为本、向上向善\"中国方案；社区语音助手为独居老人送健康提醒、AI社工处理居民诉求——点评：AI向善落地基层治理。\n- 【数据/做法】农村屋顶光伏\"瓦片\"、古城老墙嵌入健康监测传感器、\"水电守护\"无感监测独居老人——点评：科技适老、科技惠民的鲜活例证。\n- 【做法】上海旧改\"一户一策\"：一户一户协商、一栋一栋推进、一片一片更新，成效交居民评判——点评：精细化治理+正确政绩观。"}}, {"title": "让算法学会“等红灯”》（人民锐评）", "date": "2026-08-14", "source": "", "themes": [], "sections": {"框架": "- 标题模板：让XX学会“XX”（“让算法学会等红灯”拟人式，适合技术治理/规则嵌入类主题）\n- 开头：新闻由头（苏州率先将骑手等红灯时间纳入配送计时，受舆论好评）→ 痛点（配送时长基于理想路况，骑手抢时间闯红灯逆行，与规则竞速）\n- 分论点（现象—本质—路径三段）：\n- 1. 留缓冲：算法设计留足安全冗余，把劳动者安全权益放在优先级前面，将交通法规刚性要求嵌入平台逻辑\n- 2. 明导向：算法终归服务人，“技术向善才有长远未来”，跳出“唯效率论”，统筹速度与安全、效率与人文\n- 3. 创路径：政企合作、数据共享的算法治理新路径，政府平台劳动者三方协同，用人性化规则设计让效率安全不再非此即彼（“灯塔计划”“等灯停表”案例）\n- 结尾升华：当冰冷数据被打通、算法装上“温度标尺”，照亮城市最可贵的温度与智慧", "规范词": "- 新就业形态劳动者权益\n- 算法治理 / 算法设计留足缓冲空间和安全冗余\n- 技术向善\n- 跳出“唯效率论”发展误区\n- 统筹速度与安全、平衡效率与人文\n- 政企合作、数据共享\n- 三方协同（政府、平台、劳动者）\n- 人性化规则设计\n- 数字时代的温度\n- 结构性困境（算法时代被长期忽略）", "金句": "- “在算法设计中留足缓冲空间和安全冗余，才能找到兼顾公共秩序与劳动者生计的最优解。”\n- “算法终归是服务人的工具，技术向善才有长远未来。”\n- “跳出‘唯效率论’的发展误区，统筹好速度与安全，平衡好效率与人文。”\n- “问题的解法，从来不在于单向度的严管，而在于政府、平台、劳动者三方协同。”\n- “当冰冷的数据被打通，算法被装上‘温度标尺’，奔波在街头巷尾的劳动者便可以安心等待一盏红灯。”\n- “这盏灯照亮的，正是一座城市最可贵的温度与智慧。”", "案例": "- 【案例】江苏苏州全国率先将外卖骑手路口等红灯时间纳入配送计时体系，让骑手“等得起”红灯——点评：政策引导调整算法计时，把安全权益前置，可作“算法治理地方实践”标杆。\n- 【现象】外卖配送时长多基于理想路况测算，骑手为抢时间获好评冒险闯红灯逆行——点评：揭示“唯效率论”对劳动者的结构性压迫。\n- 【延伸】“灯塔计划”“等灯停表”等将冰冷数据打通、算法装“温度标尺”的实践——点评：可论证“技术向善”多元探索。"}}, {"title": "善治之道，在“未病先防”》（评论员观察）", "date": "2026-08-15", "source": "", "themes": [], "sections": {"框架": "- 标题模板：善治之道，在“XX”（引典破题，适合基层治理/风险防控类主题）。\n- 开头：以“冬病夏治”“治未病”中医理念切入 → 总书记多次用以指导基层工作 → 点题“在源头防风险，从苗头察隐患，于初期解难题，成本更小、效率更高”。\n- 分论点（防—察—治三段递进）：\n  - 1. 防：靠前服务消解矛盾土壤（北京丰台北甲地社区6次获评“无诉社区”，网格巡查+居民议事会，矛盾未等成诉已化解）。\n  - 2. 察：见微知著精准捕捉苗头（合肥恒通社区“窗帘之约”监测独居老人；楼道杂物、邻里绕开等细节即风险信号）。\n  - 3. 治：快速响应就地化解（济南舜承苑“一窗受理、一站处置”“1小时到场、24小时启动”；各地接诉即办、六尺巷工作法、四议两公开）。\n- 结尾升华：从“事后灭火”到“事前防火”是思想之变、作风之变；防范在先、发现在早、处置在小，是新时代“枫桥经验”最生动注脚，也是社会治理现代化最坚实基石。", "规范词": "- 新时代枫桥经验\n- 源头治理 / 风险化解于无形\n- 固本培元（基层治理）\n- 见微知著 / 精准捕捉苗头\n- 小事不出村、大事不出镇、矛盾不上交\n- 接诉即办\n- 网格巡查 / 居民议事会\n- 一窗受理、一站处置\n- 防范在先、发现在早、处置在小\n- 将矛盾消解于未然", "金句": "- “在源头防风险，从苗头察隐患，于初期解难题，成本更小、效率更高。”\n- “社会治理的最好办法，就是将矛盾消解于未然，将风险化解于无形。”\n- “上医治未病，中医治欲病，下医治已病。”\n- “‘小时不调，大时难了。’”\n- “以长效机制做足日常服务、前置疏导调解，才能避免小事拖成怨气、怨气酿成矛盾。”\n- “防范在先、发现在早、处置在小，正是坚持和发展新时代‘枫桥经验’最生动的注脚。”", "案例": "- 【案例】北京丰台北甲地社区2023年成立、2600多户，网格巡查+建群+走访+居民议事会，今年以来6次获评“无诉社区”——点评：矛盾未等成诉已化解的“固本培元”。\n- 【案例】安徽合肥恒通社区“窗帘之约”：独居老人早7:30拉帘、晚6点合帘，异常即上门——点评：发动群众把监测网织密，风险防范在源头。\n- 【案例】山东济南舜承苑租客熏香起火波及6户，街道“一窗受理、一站处置”“1小时到场、24小时启动”快速化解——点评：小矛盾不搁置、就地化解。\n- 【群像】北京“接诉即办”、安徽桐城“六尺巷工作法”、河南邓州“四议两公开”——点评：把“矛盾不上交”落到实处的多元探索。"}}, {"title": "用巧思激活善意》（纵横）", "date": "2026-08-16", "source": "", "themes": [], "sections": {"框架": "- 标题模板：用巧思激活XX（动宾式，适合治理温度/机制创新类）；或“把XX变成XX”。\n- 开头：以河南栾川鸾州渡景区为七旬拾荒老人设饮料瓶兑换处、空瓶换“银票”兑奖品切入 → 点题“最难得的是把老人变成参与者而非被救济对象”。\n- 分论点（机制—思维—价值三段）：\n  - 1. 机制：好的公益可与商业逻辑并行不悖，把每次善意当制度创新起点，制度化让帮扶细水长流。\n  - 2. 思维：从“管秩序”到“解难题”，把“现实痛点”变“服务落点”（开封清明上河园互动送瓜解西瓜滞销）。\n  - 3. 价值：评判文旅成色不只看接待量，更看能否看见易被忽略的人群（听障手语翻译、挑山工岗位、无障碍通道、优先购本地果蔬）。\n- 结尾升华：善意不必贵重但要用心、创意不必宏大但要落地，让人暖心的从来不只是风景，还有风景里的人。", "规范词": "- 精细化治理 / 治理温度\n- 共建共治共享\n- 把痛点变落点\n- 从“管秩序”到“解难题”\n- 看见容易被忽略的人群\n- 善意细水长流 / 制度创新起点\n- 公共服务均等化 / 无障碍\n- 文明底色\n- 嵌入式帮扶 / 内生机制\n- 以人为本", "金句": "- “一个瓶子换一张‘银票’，最难得的一点，就是自始至终没有把老人当成被救济的对象，而是把他变成了景区游乐项目的参与者。”\n- “好的公益可以与商业逻辑并行不悖。把每一次善意都当成制度创新的起点，让帮扶行为通过简单的规则内化到景区的日常运营。”\n- “从‘管秩序’到‘解难题’，把‘现实痛点’变成‘服务落点’。”\n- “评判文旅服务的成色，不只看高峰期接待了多少游客，还要看能否看见那些容易被忽略的人群。”\n- “善意不必贵重，但要用心；创意不必宏大，但要落地。”", "案例": "- 【案例】河南栾川鸾州渡景区为七旬拾荒老人设饮料瓶兑换处，空瓶换“银票”兑奖品——点评：以平等交换替代单向救济，可作“治理温度”标杆案例。\n- 【案例】开封清明上河园等景区互动送瓜，把西瓜滞销的农户难题变游客福利——点评：从“管秩序”到“解难题”思维转变。\n- 【群像】开封万岁山武侠城配手语翻译、洛阳老君山保留挑山工岗位、景区完善无障碍通道、优先购本地果蔬——点评：看见易被忽略人群，文旅文明底色。\n- 【论点】“让人暖心的，从来不只是风景本身，还有风景里的人”——点评：可作“以人为本的公共服务”升华句。"}}, {"title": "\"从群众切身需要来考量\"（评论员观察）", "date": "2026-08-17", "source": "", "themes": [], "sections": {"框架": "- 标题模板：\"从XX来考量\"（引述领袖金句作标题，权威定调母版）\n- 开头：好心办尴尬事——露天盲道雨雪打滑、清杂树种蔷薇群众有怨气\n- 主体（逻辑递进）：为何出力不讨好（主观臆断）→ 跳出\"我\"视角站稳人民立场 → 摸清需求唯有调查研究苦功 → 敢往矛盾堆里扎多做雪中送炭 → 计之深远谋之久远\n- 结尾升华：从群众需要出发路越走越宽，从主观意志出发路越走越窄", "规范词": "- 从群众切身需要来考量\n- 站稳人民立场 / 摆正群众主体地位\n- 调查研究（身入、心入、情入）\n- 雪中送炭\n- 治本之策\n- 为民造福是最大政绩\n- 自说自话、自我陶醉 / 拍脑袋决策\n- 敢往矛盾堆里扎\n- 一枝一叶", "金句": "- \"什么是好事实事，要从群众切身需要来考量，不能主观臆断，不能简单化、片面化。\"（习近平）\n- \"为民造福是最大政绩。\"\n- \"善于在'一枝一叶'里找到'治本之策'，于更长的时间段、更大的格局中为群众谋福祉。\"\n- \"从群众需要出发，路就越走越宽；从主观意志出发，路便越走越窄。\"\n- \"不能避重就轻，扔了'西瓜'去拣'芝麻'。\"", "案例": "- 【反面】室外露天盲道用普通不锈钢，雨雪天打滑反成隐患；村美化街道强令清\"杂树\"种蔷薇群众有怨气——点评：出发点好但不符合实际，出力不讨好。\n- 【人物】习近平在福建带干部酷暑进福州苍霞社区蒸笼般木板房调研，亲体验百姓疾苦促棚改加速——点评：带着感情共情才能掌握实情。\n- 【正面】甘肃华亭华庭明珠小区608户因历史遗留拿不到产权证，专班\"翻旧账\"逐个破解，居民\"心里热乎\"——点评：敢解死结、雪中送炭。\n- 【正面】重庆奉节燕子村土地纠纷频发，人大代表找准青壮年外流缺产业根子，带种羊肚菌吸纳200余人务工、年人均增收4000+，纠纷大减——点评：治本之策在\"一枝一叶\"里。\n---"}}]}, "生态文明": {"color": "#0891b2", "icon": "🌿", "articles": [{"title": "一城绿意润民心》（金台随笔）", "date": "2026-07-31", "source": "", "themes": [], "sections": {"框架": "- 标题模板：一城XX润民心（数量词+意象+民心落点；同款：一泓清水润万家）\n- 开头：生活场景对比破题（空调的凉 vs 绿荫的凉）——「前者降的是体温，后者润的是心境」\n- 分论点（情感价值→文化价值→治理行动递进）：\n  1. 绿意关乎宜居动人：一棵棵树滋养一方水土的性情、一代代人的乡愁（南京梧桐/西湖垂柳/福州古榕群像）\n  2. 古树是有生命的文物：年轮里刻着历史文脉，砍老树=斩断文脉根脉（杭州移柳争议反面例）\n  3. 扩绿、兴绿、护绿并举：从「挂牌保护」到「为树让路」再到「以树造园」（条例+各地实践）\n- 结尾升华：城市绿化不能只算眼前账 → 种一棵树福荫后人 → 为城市存养元气、涵养气质", "规范词": "- 扩绿、兴绿、护绿并举（习近平总书记原话）\n- 扩与护并重，增量与存量兼顾\n- 古树是有生命的文物\n- 文脉根脉\n- 推窗见绿、出门入园\n- 「口袋公园」 / 「全龄友好」林下空间\n- 存养元气、涵养气质\n- 天然的公共空间", "金句": "- 「空调能精确地制造凉意，绿荫给的却是有生气的凉。前者降的是体温，后者润的是心境。」（对比金句，开头极佳）\n- 「要把古树名木保护好，把中华优秀传统文化传承好。」（习近平总书记原话）\n- 「种一棵树，可以福荫几十年、上百年后的人。」\n- 「一草一木，不可轻慢。」\n- 「绿树村边合，青山郭外斜」「三年宋太守，十万绿榕树」（诗词典故储备）", "案例": "- 【政策】2025年3月15日《古树名木保护条例》施行，首次以行政法规为古树名木保护「撑腰」——点评：生态保护法治化的最新注脚。\n- 【正面群像】福州为百年古榕让路、道路施工宁可绕道；成都老旧小区改造建「口袋公园」；上海行道树下设座椅打造全龄友好空间——点评：三地三思路（为树让路/以树造园/林下空间），对策段直接可用。\n- 【反面案例】杭州西湖移走断桥边7棵柳树改种月季引发争议——点评：城市治理须敬畏民意与文脉。\n- 【文化意象】南京梧桐、西湖垂柳、厦门香樟、福州古榕、北方国槐、西南黄葛——点评：一树一城一乡愁，适合作文开头铺陈。\n---"}}, {"title": "既见\"绿树\"也见\"人\"》（评论员观察）", "date": "2026-08-01", "source": "", "themes": [], "sections": {"框架": "- 标题模板：既见\"X\"也见\"Y\"（辩证兼顾式标题，生态/发展/民生类；同款：既要绿水青山也要金山银山）\n- 开头：题记点睛（让「树」与「人」各得其所，生态永续、民生向好双向奔赴）→ 案例破题（黄山西溪南村年游客破200万）\n- 分论点（案例→辨析→原理→升华递进）：\n  1. 案例层：西溪南村靠管理创新（湿地轮休+免门票）实现保护、发展、舒心多赢\n  2. 辨析层：反对「只见人不见树」的盲目开发，也反对「只见树不见人」的孤立保护（两个极端并举批判）\n  3. 原理层：绿色发展关键在理顺人与自然关系，让人成为生态文明共建者、受益者（国家公园法例外情形）\n  4. 转化层：让百姓腰包因生态而厚实，生态保护才有内生动力（长汀/安吉/贡山群像）\n- 结尾升华：庄子「天地与我并生」→跳出「先污染后治理」老路→呵护青山、繁盛烟火→永续发展之路越走越宽", "规范词": "- 人与自然和谐共生 / 人与自然是生命共同体\n- 生态永续、民生向好的双向奔赴\n- 让人成为生态文明的共建者、受益者\n- 严守生态保护红线、环境质量底线、资源利用上线（「三线」）\n- 拓宽「绿水青山」向「金山银山」转化的通道\n- 实现生态保护、绿色发展、民生改善相统一\n- 绿富同兴\n- 跳出「先污染后治理」的老路\n- 竹林碳汇 / 林下经济", "金句": "- 「既见『绿树』也见『人』。」（辩证金句，生态与民生统筹类）\n- 「以前树倒下去，是钱；现在树立在那，是更多的钱。」（大兴安岭林农原话，两山论最生动注脚）\n- 「绿水青山既是自然财富、生态财富，又是社会财富、经济财富。」（习近平总书记科学论断）\n- 「守着绿水青山过苦日子」（批判用语，反面）；「青山定不负人」（正面收束）\n- 「天地与我并生，而万物与我为一。」（庄子，生态哲理开头/结尾）", "案例": "- 【案例】安徽黄山西溪南村：原生枫杨林「绿野仙踪」，创设湿地生态轮休机制+免门票，年游客突破200万人次——点评：生态保护与乡村发展多赢的最新样本，「管理创新」角度新颖。\n- 【案例群像】福建长汀生态扶贫、浙江安吉竹林碳汇、云南贡山林下经济、东北大兴安岭停伐转型、河北崇礼冰雪+越野赛——点评：两山转化多地群像，对策段「生态优势转发展优势」直接可用。\n- 【政策/法治】国家公园法要求「核心保护区内禁止人为活动」，但列例外情形（含原有居民必要生产生活），确立「生态保护、绿色发展、民生改善相统一」法治原则——点评：生态法治化+以人为本的制度依据。\n- 【反面现象】限制性举措层层加码、禁伐禁牧不配套产业转型、铁丝网圈占山林——点评：「孤立保护」的问题段典型，警惕好心办坏事。"}}, {"title": "「两个生态」共生共荣", "date": "2026-08-02", "source": "", "themes": [], "sections": {"框架": "- 标题模板：「两个X」共生共荣（**引号概念＋四字关系词**，适合一切二元辩证关系类；同款：「两个结合」相得益彰）\n- 开头：**采访场景＋关键词切入**——在广西南丹等地采访时，「倒查十年」这个词被反复提及 → 由疑问（老账翻得动吗）转到成效\n- 分论点（透过现象看本质 → 揭示因果 → 影响发展质量 → 落到高质量发展，层层深入）：\n  1. 涉重金属污染，表面看是废水废渣的问题，根子上是监管缺位、权力失范的问题\n  2. 自然生态要山清水秀，政治生态先得清朗干净\n  3. 这样的共生共荣关系，同样深刻影响着发展的质量（作风之变即注脚）\n  4. 统筹建好「两个生态」，最终要落到高质量发展上\n- 结尾升华：生态账不是「包袱」而是「财富」→ 守护绿水青山，更要蹚出一条高质量发展的新路", "规范词": "- 统筹建好政治生态、自然生态「两个生态」\n- 「一案五查」：查违纪、查违法、查失职、查作风、查制度漏洞\n- 环保与纪检联动、治污与治吏贯通\n- 没有就环保抓环保\n- 生态红线守不住 / 污染问题改不彻底\n- 尾矿库渗滤液长期超标排放、未批先建\n- 藏着作风之弊\n- 「刮骨疗毒」的勇气、真抓实干的担当\n- 从「小散乱」遍地到园区化集聚、变废为宝\n- 检验干部是否担当、制度是否管用的试金石", "金句": "- 「自然生态要山清水秀，政治生态先得清朗干净。」（本文题眼，生态＋作风双料金句）\n- 「政治生态不清不明，生态红线就守不住；干部作风不硬不实，污染问题就改不彻底。」（正反对仗）\n- 「生态账不是发展的『包袱』，而是转型的『财富』；不是增长的『减速带』，而是高质量的『助推器』。」（**双重否定＋比喻排比，生态类顶级收尾句**）\n- 「干部从『发通知』变为『驻现场』，从『绕着走』变为『迎着上』。」（作风之变，四组对比）\n- 「守护绿水青山，不只是守住一道生态红线，更要蹚出一条高质量发展的新路。」", "案例": "- 【案例·核心】广西南丹涉重金属污染治理「倒查十年」，实行「一案五查」，环保与纪检联动、治污与治吏贯通——点评：**生态治理＋全面从严治党双主题案例**，稀缺度高。\n- 【转型·三组对比】从「人眼盯矿」到「AI接矿」，从「小散乱」遍地到园区化集聚，从「谈污色变」到变废为宝（八桂大地）——点评：数字赋能＋绿色转型的举例范式。\n- 【反面】尾矿库渗滤液长期超标排放；企业未批先建却多次检查「没发现」——点评：监管缺位、权力失范的问题段素材。\n---"}}, {"title": "向\"绿\"而行 \"碳\"路致远》（好评中国）", "date": "2026-08-04", "source": "", "themes": [], "sections": {"框架": "- 标题模板：向\"X\"而行 \"X\"路致远（对仗递进式，适合绿色/转型/长远类；同款：向新而行、向实而为）\n- 开头：由《工业绿色低碳发展\"十五五\"规划》切入（\"双碳\"从庄严承诺走向压茬推进攻坚期）→ 点明绿色绝非发展附加条件，而是新型工业化最厚重底色、赢得未来的核心竞争力\n- 分论点（四段，考试可压缩为 3 个核心+1 保障）：\n  1. 以碳为尺丈量转型新高度：碳达峰置于首位，能耗双控→碳排放双控，末端治理→源头削减，立起碳峰值、管住碳足迹\n  2. 以绿生金锻造产业新优势：绿色从\"附加题\"变\"必答题\"，绿色溢价时代，绿色产业化与产业绿色化双向奔赴\n  3. 以智赋绿点燃融合新引擎：AI优化窑炉、数字孪生、标识解析碳足迹透明，数绿融合生产力要素深层重组\n  4. 以网筑基涵养制造新生态：资源循环利用体系+绿色制造服务体系，如鸟之双翼、车之双轮\n- 结尾升华：向\"绿\"而行是穿越经济周期的坚定抉择、\"碳\"路致远是发展范式系统跃升 → 筑牢新型工业化绿色根基、为人类可持续发展播撒绿荫", "规范词": "- 加快经济社会发展全面绿色转型\n- 降碳、减污、扩绿、增长协同推进\n- 培育壮大绿色生产力\n- 绿色绝非发展附加条件，而是新型工业化最厚重底色\n- 从能耗双控转向碳排放总量和强度双控\n- 碳达峰攻坚行动 / 源头削减、末端治理前移\n- 零碳工厂、零碳算力设施\n- 绿色产业化与产业绿色化双向奔赴\n- 数绿融合 / 数字化牵引绿色化、绿色化激活数字化\n- 没有绝对的废弃物，只有放错地方的资源（循环利用）\n- 新质生产力本身就是绿色生产力", "金句": "- \"绿色绝非发展附加条件，而是新型工业化最厚重的底色，是赢得未来的核心竞争力。\"\n- \"以碳为尺丈量转型新高度。\"\n- \"让绿色从‘附加题’变为‘必答题’，从成本支出转化为效益源泉。\"\n- \"没有绝对的废弃物，只有放错地方的资源。\"\n- \"向‘绿’而行，不是一时一地的权宜之策，而是穿越经济周期的坚定抉择；‘碳’路致远，不是零和博弈的沉重负重，而是发展范式的系统跃升。\"", "案例": "- 【政策】《工业绿色低碳发展\"十五五\"规划》：以培育壮大绿色生产力为主线，部署碳达峰攻坚行动、多维能力跃升工程、关键体系构建任务——点评：绿色转型顶层设计入口。\n- 【产业】绿色溢价时代：消费者愿为低碳产品付溢价、头部企业供应链零碳刚性要求、碳壁垒驱动脱碳；中国新能源汽车/新能源装备/新型储能加速驶向全球蓝海——点评：绿色即竞争力的硬逻辑。\n- 【技术】AI优化窑炉温度、数字孪生模拟绿色设计、标识解析让碳足迹透明可溯；攻关绿氢冶金、全固态电池、碳捕集封存利用——点评：零碳负碳关键共性技术突破。"}}, {"title": "打开\"一抹绿\"，照见城市治理的民生温度》（好评中国）", "date": "2026-08-05", "source": "", "themes": [], "sections": {"框架": "- 标题模板：打开XX，照见XX（意象映照式，适合以小场景透视治理理念）\n- 开头：数据由头（江苏\"上新\"第四批开放共享城市绿地217处，三年累计1281处/超2700公顷；成都五年新建公园343个、总数1500+，\"300米见绿500米见园\"）→ 引出\"从禁止踩踏到欢迎进入的治理之变\"\n- 分论点（空间→民生→治理三层递进）：\n  1. 空间层：释放生态空间活力，让绿色福祉服务百姓日常（从\"风景画\"到可进入可停留可沉浸）\n  2. 民生层：民生落点既在就业医疗教育\"大事\"，也在推窗见绿出门入园\"小事\"；绿地开放是对\"城市归属感\"的制度性回应（人民城市人民建）\n  3. 治理层：开放不能一开了之，需问需问计问效、精细化管护（管好才能放得长远）\n- 结尾升华：从\"赏绿\"到\"享绿\"、从\"禁入\"到\"欢迎\" → 把最好资源留给人民、绿色福祉可触可及 → 在绿意中不断\"加码\"幸福生活", "规范词": "- 开放共享城市绿地\n- 生态空间活力 / 释放生态空间活力\n- 绿色福祉 / 绿色获得感\n- 人民城市人民建，人民城市为人民\n- 推窗见绿、出门入园 / 300米见绿、500米见园\n- 把最好的资源留给人民\n- 问需、问计、问效\n- 城市治理的民本底色\n- 精细化管理", "金句": "- 「打开一块绿地，能打开什么？」\n- 「城市最好的空间，要让人民可进入、可停留、可沉浸。」\n- 「从'赏绿'到'享绿'，从'禁入'到'欢迎'……把最好的资源留给人民，让绿色福祉可触可及。」\n- 「开放不是一放了之，管好才能放得长远。」\n- 「人民城市人民建，人民城市为人民。」", "案例": "- 【数据】江苏三年累计开放共享城市绿地1281处、超2700公顷；成都五年新建公园343个、总数1500+，实现\"300米见绿500米见园\"——点评：公园城市建设示范区样本。\n- 【地方实践】河北拆除公园围栏8万余米、摘下5000余块\"禁止\"标牌；重庆开放共享绿地443处；杭州柳浪闻莺铺开18万㎡露营空间；青岛76处共享绿地\"一级+\"养护——点评：多地\"用活\"绿色资源，可作\"生态惠民\"群像。\n- 【理念】中央政治局会议提出扎实做好民生保障；绿地开放共享是城市管理理念跃升——点评：生态资源转化为普惠民生公共福利，可作\"良好生态环境是最普惠民生福祉\"论证。\n---\n---"}}, {"title": "深刻把握习近平生态文明思想的科学性和真理性》（深入学习贯彻习近平新时代中国特色社会主义思想·《习近平谈治国理政》第一至五卷通读）", "date": "2026-08-11", "source": "", "themes": [], "sections": {"框架": "- 标题模板：深刻把握XX的科学性和真理性（理论阐释型，适合重要思想/理论主题）\n- 开头：《习近平谈治国理政》第一至五卷贯通把握生态文明思想脉络 → 战略地位凸显、理论体系完备\n- 分论点（四维度）：\n  1. 认识维度不断深化——生态文明是人类文明历史趋势；人与自然和谐共生是中国式现代化鲜明特点；生态是重大政治问题\n  2. 内涵维度不断延展——美丽中国从\"愿景图\"到\"施工图\"；制度体系\"四梁八柱\"；\"两个结合\"厚植根基（人与自然生命共同体）\n  3. 布局维度不断拓展——融入五位一体（经济：绿水青山就是金山银山；政治：压实政治责任；文化：绿色低碳风尚；社会：最普惠民生福祉）\n  4. 实践维度不断推进——美丽中国重大进展；引领全球治理（碳达峰碳中和 / 全球最大清洁发电体系 / 1/4新增绿化）\n- 结尾：学深悟透、走生态优先绿色发展之路 → 以美丽中国建设推进人与自然和谐共生现代化 → 为共建清洁美丽世界作贡献", "规范词": "- 习近平生态文明思想\n- 人与自然和谐共生的现代化\n- 绿水青山就是金山银山\n- 美丽中国建设（\"1+1+N\"实施体系）\n- 生态环境法典\n- 人与自然是生命共同体\n- 最严格的制度、最严密的法治\n- 党政同责、一岗双责 / 领导干部自然资源资产离任审计\n- 生态优先、绿色低碳\n- 地球生命共同体 / 全球生态治理\n- 最普惠的民生福祉（环境就是民生，青山就是美丽，蓝天也是幸福）", "金句": "- \"人类发展活动必须尊重自然、顺应自然、保护自然，否则就会遭到大自然的报复。\"\n- \"生态环境是关系党的使命宗旨的重大政治问题，也是关系民生的重大社会问题。\"\n- \"环境就是民生，青山就是美丽，蓝天也是幸福。\"\n- \"保护生态环境就是保护生产力、改善生态环境就是发展生产力。\"\n- \"每个人都是生态环境的保护者、建设者、受益者。\"\n- \"面对生态环境挑战，人类是一荣俱荣、一损俱损的命运共同体，没有哪个国家能独善其身。\"", "案例": "- 【理论坐标】《习近平谈治国理政》第一至五卷：从第一卷\"建设生态文明\"到第五卷\"全面推进美丽中国建设\"——点评：思想一脉相承、与时俱进的权威文本。\n- 【制度】中央生态环保督察、\"党政同责、一岗双责\"、领导干部自然资源资产离任审计——点评：\"四梁八柱\"成形，制度成为不可触碰的高压线。\n- 【实践成效】建成全球最大清洁发电体系，贡献全球约1/4新增绿化面积；生态环境法典已颁布——点评：中国方案落地，实践伟力验证真理。\n- 【全球治理】推动达成《巴黎协定》\"昆明—蒙特利尔全球生物多样性框架\"，绿色\"一带一路\"南南合作——点评：从参与者到引领者，提供不同于西方路径的中国方案。\n---"}}, {"title": "以参与感激活行动力", "date": "2026-08-12", "source": "", "themes": [], "sections": {"框架": "- 标题模板：以XX激活XX（动宾激活式标题，适合绿色生活／社会治理／动员类）\n- 开头：关键词＋事件引入（自带杯喝咖啡在社交平台受追捧）→ 点题（环保理念成为生活自觉，个体行动汇成社会共识，温暖同行）\n- 分论点（现象—逻辑—扩展三段）：\n  1. 现象：自带杯既实惠又富情绪／社交价值，成就\"为绿色未来续杯\"的低碳行动；一家写字楼咖啡店日售自带杯约100杯——客群规模迅速增长\n  2. 逻辑（传播学\"仪式\"概念）：参与的氛围比单纯告知呼吁更能激发积极性；当理念走出宣传栏、转化为年轻人愿分享的乐趣，行为自会蔚然成风\n  3. 扩展：理念落地需物质保障链（商家优化供给、绿色积分创新玩法）；不止低碳——\"三无\"婚礼／地铁结婚（移风易俗）、国潮（文化传承）都证明\"在参与感上发力事半功倍\"\n- 结尾升华：向外扩展的人气构成向内激活的底气；同伴同行、共建共享，关注人的需求实现人的价值；善于营造包容氛围、强化需求／兴趣／价值驱动，让更多人成为行动派，汇聚力量共创幸福生活", "规范词": "- 绿色低碳生活方式 / 绿色未来\"续杯\"\n- 环保理念成为生活自觉\n- 参与感激活行动力 / 营造参与的氛围\n- 需求驱动、兴趣驱动、价值驱动\n- 绿色积分等创新模式\n- 移风易俗 / 轻量化个性化生活方式\n- 同伴同行、共建共享\n- 从\"打卡\"\"画钩\"式任务到主动参与\n- 低碳行动蔚然成风", "金句": "- \"环保不一定要很宏大，也可以从今天这杯开始！\"\n- \"当环保的理念成为生活的自觉，当个体的行动汇成社会的共识，一场温暖同行就此展开。\"\n- \"营造参与的氛围，很多时候比单纯的告知、呼吁更能激发人的积极性、主动性。\"\n- \"向外扩展的人气，构成了向内激活的底气。\"\n- \"无论多么宏大的事业，不都是一次次共同参与的集合吗？\"\n- \"善于营造包容的氛围，强化需求驱动、兴趣驱动、价值驱动，让更多人成为行动派。\"", "案例": "- 【现象】自带杯喝咖啡走红：社交平台追捧、写字楼咖啡店日售约100杯自带杯——点评：低碳生活年轻化、日常化样本。\n- 【案例】移动支付平台量化低碳行为鼓励好友互动；\"请到民勤种棵树\"志愿活动社交媒体接力——点评：绿色生活破圈巧思。\n- 【案例】\"三无\"婚礼、乘地铁结婚／公交车当婚车（移风易俗）；国潮联结历史与流行文化——点评：参与感发力在多个领域奏效，可作延展论证。\n- 【理论】传播学\"仪式\"概念——点评：参与式动员的方法论支撑。"}}, {"title": "生态环境法典筑牢生态系统治理法治基石（治理之道）", "date": "2026-08-13", "source": "", "themes": [], "sections": {"框架": "- 标题模板：XX筑牢XX法治基石（\"法律/制度+筑牢+领域+法治基石\"；母题：法典/立法/制度保障类）\n- 开头：引习近平论断（\"统筹山水林田湖草沙一体化保护和系统治理\"）→ 点出生态环境法典经人大通过、8.15施行 → 定位\"以规则体系化推进治理系统化\"\n- 分论点结构（理念—整合—创新三段，对应法典三大功能）：\n  1. 理念转化：总则编将\"生命共同体\"价值理念立法转化（三大目标：公众健康/生态安全/绿色低碳；原则：预防为主、系统治理、生态优先）\n  2. 规范整合：三编构建一体化保护体系（污染防治/生态保护/绿色低碳发展，从山顶到海洋全域防控、事前事中事后全流程）\n  3. 突破创新：形成系统治理制度框架（\"三水统筹\"、跨部门跨区域协调联动机制、信息公开与公众参与）\n- 结尾升华：以体系化功能变\"单打独斗\"为\"协同作战\"，为人与自然和谐共生筑牢法治根基", "规范词": "- 生命共同体\n- 山水林田湖草沙一体化保护和系统治理\n- 系统治理 / 一体化保护\n- 生态优先、预防为主\n- 生态环境法典\n- 三水统筹（水环境、水资源、水生态）\n- 跨部门、跨区域协调联动机制\n- 事前预防、事中管控、事后修复（全流程体系）\n- 信息公开与公众参与\n- 人与自然和谐共生", "金句": "- \"生态环境是统一的自然系统，是各种自然要素相互依存、紧密联系的有机链条。\"\n- \"把人与自然看作相互联系的有机整体，揭示人与自然休戚与共的关系。\"\n- \"变'单打独斗'为'协同作战'。\"\n- \"以规则体系化推进治理系统化。\"\n- \"从山顶到海洋的全域防控。\"\n- \"生态优先、预防为主等实践要求成为生态环境领域必须遵守的基础规范。\"", "案例": "- 【立法】生态环境法典经十四届全国人大四次会议通过，8.15施行；总则将\"保障公众健康和生态环境权益\"\"维护生态安全\"\"推动绿色低碳发展\"写入立法目的——点评：生态文明入法，三大效益平衡统一。\n- 【制度】以水为例\"三水统筹\"：总则统筹水资源/水环境/水生态，分则分规定水质/水量/生态流量——点评：系统治理打破部门割裂的样本。\n- 【制度】设\"信息公开与公众参与\"专章，鼓励基层群众自治组织、社会组织、志愿者等参与环保——点评：多元共治，呼应\"人人都是保护者\"。"}}, {"title": "乡村生态保护要告别“舆情倒逼治理”模式》（人民锐评）", "date": "2026-08-14", "source": "", "themes": [], "sections": {"框架": "- 标题模板：XX要告别“XX”模式（“乡村生态保护要告别舆情倒逼治理模式”式，适合纠偏类、长效机制类主题）\n- 开头：新闻由头（央视《财经调查》曝光多地乡村排污乱象：衡水粪污直排、十堰内外标准不一、娄底白天净水深夜偷排、吉首重金属直入河道）→ 敲警钟（暴露基层环境治理短板）\n- 分论点（病灶—反思—根治三段）：\n- 1. 挖病灶：治理基础薄弱、人手紧缺专业不足、涉污企业是重点税源被宽松包容、缺常态化监管，顽疾长期不治\n- 2. 深反思：“舆情倒逼治理”畸形模式——村民多次反映无回应，媒体曝光后连夜调查成立专班全面整改的标准化流程，恰恰说明日常监管缺位、环保沦为事后补救的被动救火\n- 3. 抓根治：①理顺权责赋能基层（专项资金补短板、事权财权匹配、考核容错）；②产业绿色转型（摒弃重经济轻环保，引导清洁生产，两山双向赋能）；③健全多元监督（畅通诉求、激活社会媒体监督、常态闭环）\n- 结尾升华：生态保护是底线工程、民生工程，没有妥协空间；乡村是美丽中国根基，生态公平惠及城乡群众", "规范词": "- 舆情倒逼治理（畸形工作模式）\n- 事后补救的被动救火 / 常态化长效主动治理\n- 事权与财权相匹配\n- 整治纸面整改、敷衍履职等形式主义\n- 压实环保责任 / 为担当干事的基层干部减负赋能\n- 产业绿色转型 / 清洁生产 / 绿色低碳升级\n- 绿水青山与金山银山双向赋能\n- 多元监督体系（群众+社会+媒体监督）\n- 生态公平\n- 美丽中国建设根基 / 底线工程、民生工程", "金句": "- “这套应对舆论的‘标准操作’反复上演，恰恰说明日常监管严重缺位，环保工作沦为事后补救的被动救火。”\n- “污染损毁乡村生态底色，形式主义治理透支政府公信力。”\n- “城市生态治理精益求精、乡村污染问题却长期存在，这种治理不公不仅损害群众利益，也阻碍乡村振兴和美丽中国建设。”\n- “生态保护是底线工程、民生工程，没有妥协空间。”\n- “乡村是美丽中国建设的根基，乡村水清岸绿，生态中国才有坚实底色。”", "案例": "- 【事件】央视《财经调查》曝光河北衡水养殖场粪污直排农田、湖北十堰企业排污内外标准不一、湖南娄底污水站白天净水深夜偷排、湘西吉首重金属污水直入河道——点评：乡村排污乱象群像，可作“基层环境治理短板”论据。\n- 【现象】涉污企业是地方重点税源和招商主体，部分地区对其违规排污宽松包容——点评：揭示“重经济轻环保”利益动因，可作“平衡生态与发展”反面。\n- 【对比】城市生态治理精益求精 vs 乡村污染长期积弊，治理冷热失衡——点评：论证“生态公平”必要性。\n- 【路径】加大乡村生态环保专项资金、事权财权匹配、优化考核容错、产业绿色转型、激活社会监督——点评：系统化根治方案，可作对策段素材。"}}, {"title": "从思想指引到法治护航》（人民观点）", "date": "2026-08-15", "source": "", "themes": [], "sections": {"框架": "- 标题模板：从XX到XX（递进式，适合理论→制度/法治类主题）。\n- 开头：以总书记“参与者、贡献者、引领者”三个定位切入 → 两则新闻（“车”——中国车引领全球绿色出行；“法”——8月15日生态环境法典施行）→ 点出从文献原著到现实探索感悟世界意义。\n- 分论点（参与者—贡献者—引领者三段，对应思想/实践/潮流引领）：\n  - 1. 思想引领（前瞻性）：摆脱理念束缚走人与自然和谐共生新路；梁家河沼气池、余村两山论、木里矿区整治、长江“史上最大环保罚单”四个锚点。\n  - 2. 实践引领（创造性）：经济总量54万亿→140万亿、PM2.5降59%的“喇叭口”曲线；绿色工厂超8000家、新能源车破1600万辆；生态环境法典“握指成拳”。\n  - 3. 潮流引领（普惠性）：鄱阳湖经验输出斯里兰卡、非洲；中国助力全球风电光伏度电成本降60%/80%；“两山”理念是中国的也是世界的。\n- 结尾升华：只要对全人类有益中国就义不容辞；同球共济、和合共生，推动构建公平合理合作共赢的全球生态环境治理体系。", "规范词": "- 绿水青山就是金山银山\n- 人与自然和谐共生 / 生命共同体\n- 生态环境法典\n- 最严格的制度、最严密的法治\n- 习近平生态文明思想法治化、系统化、制度化\n- 新质生产力本身就是绿色生产力\n- 高水平保护支撑高质量发展\n- 全球生态文明建设参与者、贡献者、引领者\n- 共建地球生命共同体 / 清洁美丽世界\n- 碳达峰碳中和", "金句": "- “中国秉持绿水青山就是金山银山理念，坚定不移走生态优先、绿色发展之路，是全球生态文明建设的参与者、贡献者、引领者。”\n- “我们建设现代化国家，走美欧老路是走不通的。”\n- “绿色转型不是包袱，新质生产力本身就是绿色生产力。”\n- “只有把绿色发展的底色铺好，才会有今后发展的高歌猛进。”\n- “‘两山’理念是中国的，也是世界的。”\n- “只要是对全人类有益的事情，中国就应该义不容辞地做，并且做好。”\n- “让子孙后代既能享有丰富的物质财富，又能遥望星空、看见青山、闻到花香。”", "案例": "- 【数据/曲线】十八大以来经济总量54万亿→逾140万亿、PM2.5平均浓度降59%，构成国际衡量高质量发展的“喇叭口”——点评：生态兴则文明兴缩影。\n- 【数据】“十四五”培育国家绿色工厂超8000家、新能源汽车年产销破1600万辆；中国贡献全球1/4新增绿色面积、建成最大新能源产业链——点评：绿色生产力系统跃升。\n- 【案例】8月15日生态环境法典正式施行（继民法典后第二部“法典”命名法律），从多部法律“单打独斗”到系统集成“握指成拳”——点评：以最严法治保障生态文明。\n- 【群像输出】鄱阳湖经验被斯里兰卡博尔戈达湖区、非洲维多利亚湖霍马湾学习；老挝孟松风电、基里巴斯“光伏+直饮水”南南合作——点评：中国方案普惠全球、“生态红利”赋能后发者。"}}, {"title": "为破解生态保护难题提供法治保障》（专题深思）", "date": "2026-08-16", "source": "", "themes": [], "sections": {"框架": "- 标题模板：为破解XX难题提供法治保障（对策式，适合法治建设/生态治理类）；或“以XX为引领，破解XX难题”。\n- 开头：以生态环境法典是继民法典后第二部以“法典”命名的法律、新时代法治重大成果切入 → 点题“以系统立法、整合升华破解生态保护难题”。\n- 分论点（三大维度，均“理念—制度—意义”）：\n  - 1. 以系统观念为引领：四维统筹（环境要素复杂性/生态完整性/自然地理连续性/发展可持续性），从单一要素管理迈向系统综合治理。\n  - 2. 坚持民生为本：将“保障公众健康和生态环境权益”立为立法目的，贯通健康、公众参与、生态补偿、损害赔偿民生制度。\n  - 3. 深化国际合作：吸纳与贡献双重逻辑，绿色低碳发展独立成编全球首创，贡献中国方案。\n- 结尾升华：推动构建公平合理、合作共赢的全球环境治理体系，为破解全球性生态挑战贡献中国智慧。", "规范词": "- 生态环境法典\n- 系统观念 / 系统治理\n- 山水林田湖草沙一体化保护\n- 协同推进降碳、减污、扩绿、增长\n- 生态优先、节约集约、绿色低碳发展\n- 最公平的公共产品 / 最普惠的民生福祉\n- 生态保护补偿制度\n- 生态环境损害赔偿 / 公益诉讼\n- 人与自然生命共同体\n- 绿色低碳发展独立成编（全球首创）", "金句": "- “生态环境法典是继民法典之后我国第二部以‘法典’命名的法律，是新时代我国社会主义法治建设又一项重大成果。”\n- “良好生态环境是最公平的公共产品，是最普惠的民生福祉。”\n- “生态环境治理是一项系统工程，需要统筹考虑环境要素的复杂性、生态系统的完整性、自然地理单元的连续性、经济社会发展的可持续性。”\n- “我国努力破解工业化、城镇化进程中面临的资源环境约束，避免走西方‘先污染、后治理’的老路。”\n- “‘绿色低碳发展’独立成编，在全球范围尚属首创……彰显了我国推动绿色低碳转型、构建人与自然生命共同体的法治担当。”", "案例": "- 【法律】生态环境法典：继民法典后第二部以“法典”命名的法律，将污染防治、生态保护经验体系化制度化——点评：系统立法破解碎片化执法难题。\n- 【制度】跨行政区域重点区域、流域、海域生态环境联合保护协调机制——点评：破解跨区域治理碎片化体制难题。\n- 【法理】“协同推进降碳、减污、扩绿、增长”入法；保障公众健康、公众参与、生态补偿、损害赔偿贯通——点评：民生为本的法治闭环。\n- 【国际】衔接《联合国气候变化框架公约》及《巴黎协定》；绿色低碳发展独立成编全球首创——点评：中国方案引领全球环境治理。"}}, {"title": "让绿色能源成为市场优选》（微观）", "date": "2026-08-17", "source": "", "themes": [], "sections": {"框架": "- 标题模板：让XX成为市场优选（目标导向母版）\n- 开头：8月1日《可再生能源消费最低比重目标和可再生能源电力消纳责任权重制度实施办法》施行，从\"可选项\"变\"必答题\"\n- 主体（逻辑递进）：制度引导+市场内生双轮驱动 → 系统观念协同发力打通堵点 → 绿色消费是一场观念变革\n- 结尾升华：从摇篮到摇篮，低碳循环；中国新能源让全球可再生能源普及提前至少10年", "规范词": "- 绿色消费 / 绿色转型\n- 可再生能源消纳责任权重\n- 制度引导 + 市场内生 双轮驱动\n- 系统观念 / 因地制宜、协同发力\n- 可溯源、可持续\n- 绿证 / 绿电交易（长协/短期）\n- 低碳循环 / 从摇篮到摇篮\n- 政策推力 + 市场拉力", "金句": "- \"从消费端挖潜力，把政策的推力和市场的拉力结合起来。\"\n- \"政府划定绿色'坐标'，市场寻找最优路径。\"\n- \"习惯一旦养成，比什么都管用。\"\n- \"从摇篮到摇篮，低碳循环的优势在于用更少的资源、过更好的生活。\"\n- \"潮起东方，风正帆悬。\"", "案例": "- 【政策】8月1日制度施行，从省级行政区域和重点用能行业两层压实可再生能源消纳消费责任——点评：刚性约束+市场化手段结合的节点性政策。\n- 【机制】今年6月我国首次跨区域\"光伏+风电\"纯绿电接力外送：青海光伏+黑龙江风电昼夜互补、接力为北京供电——点评：以市场化手段打破\"各发各电\"格局。\n- 【场景】深圳居民手机APP缴电费时勾选\"绿证交易服务\"买云贵绿电，价格差不多却可见充了多少绿电——点评：把绿色导入消费场景、养成习惯。\n- 【国际】国际可再生能源署、联合国开发计划署评估：中国新能源技术突破与规模化应用，让全球可再生能源普及进程至少提前10年——点评：大国担当、惠及世界的升华论据。\n---"}}]}};
const CATS = [{name:'政治建设',color:'#dc2626',icon:'🏛️'},{name:'经济建设',color:'#2563eb',icon:'📊'},{name:'文化建设',color:'#7c3aed',icon:'📚'},{name:'社会建设',color:'#059669',icon:'🤝'},{name:'生态文明',color:'#0891b2',icon:'🌿'}];
let currentCat = '政治建设';

function esc(s){
  const d=document.createElement('div'); d.textContent=s; return d.innerHTML;
}

function renderSidebar(){
  const sb=document.getElementById('sidebar');
  const mt=document.getElementById('mobileTabs');
  let s='',mtHtml='';
  CATS.forEach(function(c){
    const n=DATA[c.name]?DATA[c.name].articles.length:0;
    const active=c.name===currentCat?' active':'';
    s+='<div class="nav-item'+active+'" onclick="switchCat(\''+c.name+'\')" style="--active-color:'+c.color+'">'+
      '<span class="nav-icon">'+c.icon+'</span>'+c.name+
      '<span class="nav-count">'+n+'</span></div>';
    mtHtml+='<div class="mobile-tab'+active+'" onclick="switchCat(\''+c.name+'\')">'+c.icon+' '+c.name+'</div>';
  });
  sb.innerHTML=s; mt.innerHTML=mtHtml;
}

function renderArticles(cat, filterText){
  const catData=DATA[cat];
  if(!catData){
    document.getElementById('mainContent').innerHTML='<div class="empty-state"><div class="icon">📭</div><p>暂无数据</p></div>';
    return;
  }
  
  const q=filterText?filterText.toLowerCase():'';
  let arts=catData.articles;
  if(q){
    arts=arts.filter(function(a){
      return a.title.toLowerCase().indexOf(q)!==-1||
        (a.themes&&a.themes.some(function(t){return t.toLowerCase().indexOf(q)!==-1;}))||
        JSON.stringify(a.sections).toLowerCase().indexOf(q)!==-1;
    });
  }
  
  if(arts.length===0){
    document.getElementById('mainContent').innerHTML='<div class="empty-state"><div class="icon">🔍</div><p>'+(q?'未找到匹配「'+esc(q)+'」的内容':'暂无素材')+'</p></div>';
    return;
  }
  
  let themeCounts={};
  arts.forEach(function(a){
    (a.themes||[]).forEach(function(t){ themeCounts[t]=(themeCounts[t]||0)+1; });
  });
  let statsHtml='<div class="stats-row">';
  Object.keys(themeCounts).sort(function(a,b){return themeCounts[b]-themeCounts[a];}).slice(0,6).forEach(function(t){
    statsHtml+='<div class="stat-pill"><span class="stat-dot" style="background:'+catData.color+'"></span>'+esc(t)+' <span style="font-weight:400;color:var(--text-muted);margin-left:2px">'+themeCounts[t]+'</span></div>';
  });
  statsHtml+='</div>';
  
  let h=statsHtml;
  arts.forEach(function(a){
    h+='<article class="article-card">'+
      '<div class="art-top">'+
        '<div>'+
          '<div class="art-title">'+esc(a.title)+'</div>'+
          '<div class="art-date">📅 '+a.date+'</div>'+
          (a.source?'<div class="art-source">'+esc(a.source)+'</div>':'')+
        '</div>'+
      '</div>';
    
    if(a.themes&&a.themes.length){
      h+='<div class="art-meta" style="margin-bottom:14px">';
      a.themes.forEach(function(t){
        h+='<span class="art-tag" style="background:'+catData.color+'15;color:'+catData.color+'">#'+esc(t)+'</span>';
      });
      h+='</div>';
    }
    
    var secs=[
      ['框架','kuangjia','kj','🔷 框架库'],
      ['规范词','guifan','gf','📝 规范词库'],
      ['金句','jinju','jj','💎 金句库'],
      ['案例','anli','al','📋 案例库'],
    ];
    
    h+='<div class="sections-grid">';
    secs.forEach(function(sec){
      var key=sec[0], cls=sec[1], prefix=sec[2], label=sec[3];
      var content=a.sections[key];
      if(!content) return;
      
      h+='<div class="section-block '+cls+'">'+
        '<div class="sec-header '+prefix+'"><span class="sec-icon">'+label.split(' ')[0]+'</span>'+label.split(' ').slice(1).join(' ')+'</div><ul>';
      
      if(key==='金句'){
        var lines=content.split('\n');
        lines.forEach(function(line){
          var t=line.replace(/^\-\s*/,'').trim();
          if(t && (t.indexOf('「')===0 || t.indexOf('"')===0)){
            h+='<li><div class="jinju-highlight">'+esc(t)+'</div></li>';
          } else if(t && line.trim().startsWith('- ')){
            h+='<li>'+esc(t)+'</li>';
          }
        });
      } else {
        var items=content.split('\n').filter(function(l){return l.trim().startsWith('- ');});
        items.forEach(function(item){
          var t=item.replace(/^\-\s*/,'').trim();
          if(t) h+='<li>'+esc(t)+'</li>';
        });
        var paras=content.split('\n').filter(function(l){return l.trim()&&!l.trim().startsWith('- ')&&!l.trim().startsWith('**');});
        paras.forEach(function(p){
          if(p.trim()) h+='<li style="list-style:none;padding-left:0;font-size:12.5px;color:#666;">'+esc(p.trim())+'</li>';
        });
      }
      
      h+='</ul></div>';
    });
    h+='</div></article>';
  });
  
  document.getElementById('mainContent').innerHTML=h;
}

function switchCat(name){
  currentCat=name;
  renderSidebar();
  renderArticles(name, document.getElementById('searchInput').value);
}

document.getElementById('searchInput').addEventListener('input', function(e){
  renderArticles(currentCat, e.target.value);
});
renderSidebar();
renderArticles(currentCat,'');
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorkBuddy 自动化总面板（统一版）</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1f2933;--muted:#6b7280;--line:#e5e7eb;
--accent:#2563eb;--accent2:#1e3a8a;--green:#16a34a;--red:#dc2626;--amber:#d97706;--violet:#7c3aed}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.6}
.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 18px}
.top h1{font-size:18px;margin:0;color:var(--accent2);display:inline-block}
.top .sub{color:var(--muted);font-size:12px;margin-left:8px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.bar input[type=text]{padding:7px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px;width:220px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 13px;font-size:13px;cursor:pointer;color:var(--ink)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{background:#1d4ed8;color:#fff}
.btn.sm{padding:4px 9px;font-size:12px}
.stats{display:flex;gap:14px;flex-wrap:wrap;margin:14px 18px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 16px;min-width:90px;cursor:pointer}
.stat b{display:block;font-size:20px;color:var(--accent2)}
.stat span{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 18px 0;padding:4px;background:var(--border-light);border-radius:10px}
.tab-btn{padding:8px 14px;border:none;background:transparent;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted)}
.tab-btn:hover{background:rgba(37,99,235,.08)}
.tab-btn.active{background:#fff;color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.wrap{padding:14px 18px 80px;max-width:1280px;margin:0 auto}
.sec-title{font-size:15px;font-weight:700;color:var(--accent2);margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.sec-title .badge{font-size:11px;background:#eef2ff;color:#3730a3;border:1px solid #c7d2fe;padding:1px 8px;border-radius:999px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px;position:relative}
.card .nm{font-weight:700;font-size:15px;color:var(--ink);word-break:break-all;padding-right:24px}
.card .id{font-size:11px;color:#9ca3af;margin-top:1px;word-break:break-all}
.card .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.tag{font-size:11px;padding:2px 8px;border-radius:6px;border:1px solid var(--line);color:var(--muted);background:#f9fafb}
.tag.green{background:#f0fdf4;color:var(--green);border-color:#bbf7d0}
.tag.red{background:#fef2f2;color:var(--red);border-color:#fecaca}
.tag.amber{background:#fffbeb;color:var(--amber);border-color:#fde68a}
.tag.violet{background:#f5f3ff;color:var(--violet);border-color:#ddd6fe}
.tag.blue{background:#eff6ff;color:var(--accent);border-color:#bfdbfe}
.card .meta{font-size:11.5px;color:var(--muted);margin-top:7px;line-height:1.5}
.card .acts{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.rep{margin-top:8px;font-size:12px;border-top:1px dashed var(--line);padding-top:7px;color:var(--muted)}
.rep.ok{color:var(--green)} .rep.err{color:var(--red)} .rep.q{color:var(--violet)} .rep.run{color:var(--amber)}
.startzone{background:linear-gradient(180deg,#eff6ff,#f8fafc);border:1px solid #bfdbfe;border-radius:14px;padding:14px;margin:10px 0 4px}
.startzone .zh{font-weight:700;color:var(--accent2);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;align-items:center;justify-content:center;padding:18px}
.modal.open{display:flex}
.mbox{background:#fff;border-radius:14px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:20px 22px}
.mbox h3{margin:0 0 14px;color:var(--accent2)}
.mbox label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.mbox input,.mbox textarea,.mbox select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit}
.mbox textarea{height:60px;resize:vertical}
.mbox .macts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
pre.out{background:#0f172a;color:#e2e8f0;padding:12px;border-radius:8px;max-height:320px;overflow:auto;font-size:12px;white-space:pre-wrap;word-break:break-all}
.note{font-size:12px;color:var(--muted);background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:10px 18px}
.hint{font-size:12px;color:var(--muted);margin:6px 18px}
.backend-on{color:var(--green)!important} .backend-off{color:var(--amber)!important}
@media(max-width:640px){.bar input[type=text]{width:100%}.stat{flex:1}}
</style>
</head>
<body>
<div class="top">
  <h1>🗂️ WorkBuddy 自动化总面板</h1><span class="sub">统一版 · 真实数据 <span id="modeTag"></span></span>
  <div class="bar">
    <input type="text" id="search" placeholder="搜索名称/ID/用途…" oninput="render()">
    <select id="filterStatus" onchange="render()" class="btn"><option value="">全部状态</option><option value="ACTIVE">运行中</option><option value="PAUSED">已暂停</option></select>
    <button class="btn" id="btnRunAll" disabled onclick="runAll()">▶ 一键启动（启动区）</button>
    <button class="btn" id="btnRunSel" disabled onclick="runSelected()">▶ 选择性启动</button>
    <button class="btn" id="btnNewFolder" disabled onclick="addFolder()">＋ 新建文件夹</button>
    <button class="btn" id="btnExport" disabled onclick="exportCfg()">⤓ 导出配置</button>
    <button class="btn" id="btnImport" disabled onclick="importCfg()">⤒ 导入配置</button>
    <button class="btn sm" onclick="copyAllIds()">⧉ 复制全部ID</button>
    <button class="btn sm" id="btnRefresh" disabled onclick="refresh()">↻ 刷新</button>
  </div>
</div>

<div class="stats" id="stats"></div>
<div class="note" id="modeNote"></div>

<div class="tabs" id="tabs"></div>
<div class="wrap" id="wrap"></div>
<div class="hint">生成时间：<span id="gen"></span> · 总数：<span id="total"></span> · 来源：本机 workbuddy.db（automations + automation_runs）</div>

<div class="modal" id="editM"><div class="mbox">
  <h3>编辑自动化</h3>
  <label>显示名称</label><input id="e_name">
  <label>备注 / 介绍</label><textarea id="e_notes"></textarea>
  <label>分类标签</label><input id="e_cat">
  <label>归入文件夹</label><select id="e_folder"><option value="">（不归类）</option></select>
  <label style="display:flex;align-items:center;gap:8px;margin-top:12px"><input type="checkbox" id="e_zone" style="width:auto"> 加入一键启动区</label>
  <div class="macts"><button class="btn" onclick="closeM('editM')">取消</button><button class="btn primary" onclick="saveEdit()">保存</button></div>
</div></div>
<div class="modal" id="repM"><div class="mbox">
  <h3 id="repTitle">运行报告</h3><div id="repBody"></div>
  <div class="macts"><button class="btn primary" onclick="closeM('repM')">关闭</button></div>
</div></div>
<input type="file" id="impFile" accept=".json" style="display:none" onchange="doImport(this)">

async function api(u,m,body){const r=await fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});try{return await r.json();}catch(e){return {};}}
async function refresh(){if(!backend)return;try{AUTOS=await api('/api/automations');CONFIG=await api('/api/config');render();}catch(e){}}
function conflictBadge(g){const m={io_heavy:['重IO互斥','red'],shenlun_site:['站点重建竞态','amber'],bank_write:['题库写竞态','amber'],switch:['总闸·排除','red']};const x=m[g];return x?`<span class="tag ${x[1]}">${x[0]}</span>`:'';}

function gItem(id){return CONFIG.items[id]||{};}
function visible(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const fs=document.getElementById('filterStatus').value;
  const cat=window.__cat||'all';
  return AUTOS.filter(a=>{
    if(cat!=='all'&&a.cat!==cat)return false;
    if(fs&&a.status!==fs)return false;
    if(q&&!(a.name+a.id+(a.purpose||'')).toLowerCase().includes(q))return false;
    return true;});
}
function render(){
  const vis=visible();
  const active=AUTOS.filter(a=>a.status==='ACTIVE').length;
  const paused=AUTOS.length-active;
  document.getElementById('stats').innerHTML=
    stat(AUTOS.length,'总数')+stat(active,'运行中')+stat(paused,'已暂停')+stat([...new Set(AUTOS.map(a=>a.cat))].length,'分类');
  const grouped={};vis.forEach(a=>{const c=a.cat||'其他';(grouped[c]=grouped[c]||[]).push(a);});
  const wrap=document.getElementById('wrap');wrap.innerHTML='';
  if(backend){
    const sz=vis.filter(a=>gItem(a.id).inStartZone);
    if(sz.length){const z=document.createElement('div');z.className='startzone';
      z.innerHTML='<div class="zh"><span>🚀 一键启动区（'+sz.length+'）</span><button class="btn sm" onclick="runAll()">▶ 启动本区全部</button></div><div class="grid" id="szg"></div>';
      wrap.appendChild(z);const g=document.createElement('div');g.className='grid';z.querySelector('#szg').replaceWith(g);sz.forEach(a=>g.appendChild(card(a)));}
  }
  Object.keys(grouped).sort().forEach(cat=>{
    const sec=document.createElement('div');sec.className='sec-title';
    sec.innerHTML=cat+' <span class="badge">'+grouped[cat].length+'</span>';wrap.appendChild(sec);
    const grid=document.createElement('div');grid.className='grid';
    grouped[cat].forEach(a=>grid.appendChild(card(a)));wrap.appendChild(grid);
  });
  if(vis.length===0)wrap.innerHTML='<div class="hint">无匹配结果</div>';
}
function stat(n,l){return '<div class="stat"><b>'+n+'</b><span>'+l+'</span></div>';}
function card(a){
  const st=a.status==='ACTIVE'?'<span class="tag green">运行中</span>':'<span class="tag amber">已暂停</span>';
  const rep=a.report;let rh='';
  if(rep&&rep.status){const cls=rep.status==='success'?'ok':rep.status==='error'?'err':rep.status==='queued'?'q':'run';
    rh='<div class="rep '+cls+'">📊 '+(rep.status==='queued'?'已入队':rep.status==='running'?'运行中…':'上次 '+rep.status)+' · '+(rep.started_at||'')+(rep.duration_sec!=null?' · '+rep.duration_sec+'s':'')+'</div>';}
  const out=a.output?'<div class="meta">产出：<a class="tag blue" style="text-decoration:none" href="'+a.output+'" target="_blank">查看报告 ↗</a></div>':'';
  const acts=backend
    ? '<button class="btn sm primary" onclick="runOne(\''+a.id+'\')">▶ 运行</button><button class="btn sm" onclick="openEdit(\''+a.id+'\')">✎ 编辑</button><button class="btn sm" onclick="openRep(\''+a.id+'\')">📊 报告</button><button class="btn sm" onclick="toggleZone(\''+a.id+'\')">'+(gItem(a.id).inStartZone?'移出启动区':'加入启动区')+'</button><button class="btn sm" onclick="moveFolder(\''+a.id+'\')">📁 归组</button>'
    : '<button class="btn sm primary" onclick="alert(\'请在 WorkBuddy 对话中输入「运行 '+a.name.replace(/"/g,'')+'」来手动触发（本页只读）\')">运行</button><button class="btn sm" onclick="copyId(\''+a.id+'\')">⧉ 复制ID</button>'+(a.output?'<button class="btn sm" onclick="window.open(\''+a.output+'\')">📊 报告</button>':'');
  const d=document.createElement('div');d.className='card';
  d.innerHTML='<div class="nm">'+a.name+'<button class="btn sm" style="position:absolute;top:8px;right:8px;padding:2px 6px" onclick="copyId(\''+a.id+'\')">ID</button></div>'+
    '<div class="id">'+a.id+'</div>'+
    '<div class="row">'+st+'<span class="tag blue">'+a.cat+'</span>'+conflictBadge(a.conflict)+'</div>'+
    '<div class="meta">🕓 '+(a.last_run_at||'未运行')+' · '+(a.rrule||'')+'<br>用途: '+(a.purpose||'').slice(0,80)+'</div>'+
    out+rh+'<div class="acts">'+acts+'</div>';
  return d;
}
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

async function runOne(id){await api('/api/run/'+id,'POST');refresh();}

async function runSelected(){const ids=[...selected];if(!ids.length){alert('请先勾选卡片');return;}await api('/api/run_selected','POST',{ids});refresh();}
function toggleZone(id){const it=CONFIG.items[id]||(CONFIG.items[id]={});it.inStartZone=!it.inStartZone;saveCfg();}
async function saveCfg(){if(!backend)return;await api('/api/config','POST',CONFIG);refresh();}
function addFolder(){const f=prompt('文件夹名称:');if(!f)return;CONFIG.folders=CONFIG.folders||[];CONFIG.folders.push({id:'f'+Date.now(),name:f});saveCfg();}
function moveFolder(id){const f=prompt('输入文件夹名（已有则填同名）:');if(!f)return;let fob=(CONFIG.folders||[]).find(x=>x.name===f);if(!fob){fob={id:'f'+Date.now(),name:f};CONFIG.folders=CONFIG.folders||[];CONFIG.folders.push(fob);}const it=CONFIG.items[id]||(CONFIG.items[id]={});it.folder=fob.id;saveCfg();}

  else{h='<div class="rep '+(r.status==='success'?'ok':r.status==='error'?'err':r.status==='queued'?'q':'run')+'" style="border:0;padding:0">状态: <b>'+r.status+'</b> · 开始 '+(r.started_at||'')+' · 用时 '+(r.duration_sec??'-')+'s<br>摘要: '+(r.summary||'')+'</div>'+(r.errors?'<pre class="out">'+esc(r.errors)+'</pre>':'');}
  document.getElementById('repBody').innerHTML=h;document.getElementById('repM').classList.add('open');}
function exportCfg(){const b=JSON.stringify(CONFIG,null,2);const u=URL.createObjectURL(new Blob([b],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='自动化总控配置.json';a.click();}
function importCfg(){document.getElementById('impFile').click();}
async function doImport(inp){const f=inp.files[0];if(!f)return;try{CONFIG=JSON.parse(await f.text());await saveCfg();alert('导入成功');}catch(e){alert('导入失败: '+e);}}
function closeM(id){document.getElementById(id).classList.remove('open');}

function copyId(id){navigator.clipboard.writeText(id).then(()=>alert('已复制ID: '+id));}
function copyAllIds(){const ids=AUTOS.map(a=>a.id).join('\n');navigator.clipboard.writeText(ids).then(()=>alert('已复制全部 '+AUTOS.length+' 个ID'));}

const CATS=['考公提分','申论素材','赚钱副业','网盘工具','知识管理','公益','系统','其他'];
function buildTabs(){
  const t=document.getElementById('tabs');
  const all=['all',...CATS.filter(c=>AUTOS.some(a=>a.cat===c))];
  t.innerHTML=all.map((c,i)=>'<button class="tab-btn'+(i===0?' active':'')+'" onclick="showCat(\''+c+'\',this)">'+(c==='all'?'全部':c)+'</button>').join('');
}
function showCat(c,btn){window.__cat=c;document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');render();}

function init(){
  document.getElementById('gen').textContent=GEN_TIME;
  document.getElementById('total').textContent=AUTOS.length;
  buildTabs();render();probeBackend();
}
init();
</script>
</body>
</html>

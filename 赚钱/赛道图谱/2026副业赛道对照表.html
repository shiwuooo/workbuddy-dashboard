<style>
  :root{

    --line:#e5e7eb; --accent:#2563eb; --accent-soft:#eff6ff;
    --low:#16a34a; --mid:#d97706; --tag:#eef2ff;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
  header{padding:22px 24px 10px}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;margin:0}
  .wrap{padding:0 24px 40px}
  .bar{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 12px;align-items:center}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:999px;font-size:13px;cursor:pointer;transition:.15s}
  .chip:hover{border-color:var(--accent)}
  .chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .search{flex:1;min-width:200px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px;background:var(--card)}
  .count{color:var(--muted);font-size:12px;margin-left:4px}
  .scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
  table{border-collapse:collapse;width:100%;min-width:1080px;font-size:13px}
  th,td{padding:10px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
  th{background:var(--accent-soft);position:sticky;top:0;font-weight:600;white-space:nowrap}
  tr:hover td{background:#fafbff}
  td:last-child,border-right:0{}
  .cat{white-space:nowrap;color:var(--accent);font-weight:600}
  .track{font-weight:600;white-space:nowrap}
  .barrier{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600}
  .b-low{background:#dcfce7;color:var(--low)}
  .b-mid{background:#fef3c7;color:var(--mid)}
  .oss{color:#7c3aed;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
  .num{color:var(--muted);text-align:center;width:34px}
  footer{color:var(--muted);font-size:12px;padding:0 24px 30px}
  a{color:var(--accent);text-decoration:none}
</style>

const body=document.getElementById('body');
const cnt=document.getElementById('cnt');
const q=document.getElementById('q');
let curCat='全部';

function render(){
  const kw=q.value.trim().toLowerCase();
  const rows=DATA.filter(d=>{
    if(curCat!=='全部' && d.cat!==curCat) return false;
    if(!kw) return true;
    return [d.t,d.dom,d.ovs,d.ai,d.oss].join(' ').toLowerCase().includes(kw);
  });
  body.innerHTML=rows.map((d,i)=>{
    const b=d.bar==='低'?'<span class="barrier b-low">低</span>':'<span class="barrier b-mid">中</span>';
    return `<tr>
      <td class="num">${i+1}</td>
      <td class="track">${d.t}</td>
      <td>${d.dom}</td>
      <td>${d.ovs}</td>
      <td class="oss">${d.oss}</td>
      <td>${b}</td>
      <td>${d.ai}</td>
      <td>${d.f}</td>
    </tr>`;
  }).join('');
  cnt.textContent=`共 ${rows.length} 条`;
}

document.querySelectorAll('.chip').forEach(c=>{
  c.onclick=()=>{
    document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
    c.classList.add('active');
    curCat=c.dataset.cat;
    render();
  };
});
q.oninput=render;
render();

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小桃运营台 · 自媒体博主工作台</title>
<style>
  :root{
    --cream:#FFF6F2;
    --card:#FFFFFF;
    --coral:#FF7E9D;
    --coral-deep:#FF5C85;
    --coral-light:#FFD6E0;
    --pink-soft:#FFEAF0;
    --pink-deep:#FF9AB5;
    --text:#5C4A45;
    --text-light:#A08E88;
    --green:#3FB98E;
    --red:#FF5C6C;
    --yellow:#FFC861;
    --line:#FFE3EA;
    --shadow:0 8px 24px rgba(255,126,157,.14);
    --shadow-sm:0 4px 12px rgba(255,126,157,.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--cream);
    color:var(--text);
    font-size:15px;
    line-height:1.6;
  }
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;font-size:16px;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--coral-light);border-radius:8px;}

  /* layout */
  .app{display:flex;min-height:100vh;}
  .sidebar{
    width:208px;flex:0 0 208px;background:#fff;border-right:1px solid var(--line);
    padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;}
  .brand .logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--coral),var(--pink-deep));display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm);}
  .brand b{font-size:16px;color:var(--coral-deep);}
  .brand small{display:block;color:var(--text-light);font-size:11px;font-weight:400;}
  .nav-item{
    display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:14px;color:var(--text-light);
    font-size:14.5px;font-weight:600;border:none;background:transparent;width:100%;text-align:left;transition:.15s;
  }
  .nav-item svg{width:20px;height:20px;flex:0 0 20px;}
  .nav-item:hover{background:var(--pink-soft);color:var(--coral-deep);}
  .nav-item.active{background:linear-gradient(135deg,var(--coral),var(--pink-deep));color:#fff;box-shadow:var(--shadow-sm);}
  .nav-item .dot{margin-left:auto;background:var(--red);color:#fff;font-size:11px;border-radius:999px;padding:1px 7px;font-weight:700;}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{
    position:sticky;top:0;z-index:20;background:rgba(255,246,242,.92);backdrop-filter:blur(8px);
    padding:12px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);flex-wrap:wrap;
  }
  .topbar h1{font-size:17px;margin:0;color:var(--coral-deep);flex:1;min-width:120px;}
  .topbar .acts{display:flex;gap:8px;flex-wrap:wrap;}
  .btn{
    border:none;border-radius:999px;padding:9px 15px;font-size:13.5px;font-weight:700;color:#fff;
    background:linear-gradient(135deg,var(--coral),var(--pink-deep));box-shadow:var(--shadow-sm);transition:.15s;min-height:40px;
  }
  .btn:hover{transform:translateY(-1px);}
  .btn.ghost{background:#fff;color:var(--coral-deep);border:1.5px solid var(--coral-light);box-shadow:none;}
  .btn.sm{padding:7px 12px;font-size:12.5px;min-height:36px;}
  .btn.danger{background:#fff;color:var(--red);border:1.5px solid #FFC2C9;box-shadow:none;}
  .content{padding:18px;padding-bottom:96px;max-width:1080px;width:100%;margin:0 auto;}

  /* hero */
  .hero{
    background:linear-gradient(135deg,#FFB6C9 0%,#FF7E9D 55%,#FF9AB5 100%);
    border-radius:24px;padding:22px 22px;color:#fff;box-shadow:var(--shadow);position:relative;overflow:hidden;margin-bottom:16px;
  }
  .hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;background:rgba(255,255,255,.18);border-radius:50%;}
  .hero::before{content:"";position:absolute;right:60px;bottom:-50px;width:120px;height:120px;background:rgba(255,255,255,.12);border-radius:50%;}
  .hero h2{margin:0 0 6px;font-size:20px;position:relative;}
  .hero p{margin:0;opacity:.95;font-size:14px;position:relative;max-width:80%;}
  .hero .streak{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;position:relative;}
  .badge{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.4);border-radius:12px;padding:6px 11px;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px;}
  .badge.on{background:#fff;color:var(--coral-deep);}
  .badge .b-ic{width:16px;height:16px;}

  .grid{display:grid;gap:14px;}
  .card{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow);border:1px solid #FFF0F4;}
  .card h3{margin:0 0 12px;font-size:15.5px;display:flex;align-items:center;gap:8px;color:var(--coral-deep);}
  .card h3 svg{width:18px;height:18px;}
  .card .sub{color:var(--text-light);font-size:12.5px;font-weight:400;}

  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .row.tight{gap:6px;}
  .field{flex:1;min-width:140px;display:flex;flex-direction:column;gap:5px;}
  label.lab{font-size:12.5px;color:var(--text-light);font-weight:600;}
  input.in,select.in,textarea.in{
    border:1.5px solid var(--coral-light);border-radius:12px;padding:10px 12px;width:100%;background:#FFFDFC;color:var(--text);outline:none;transition:.15s;
  }
  input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--coral);box-shadow:0 0 0 3px var(--pink-soft);}
  textarea.in{resize:vertical;min-height:64px;line-height:1.5;}

  .chip{display:inline-flex;align-items:center;gap:5px;background:var(--pink-soft);color:var(--coral-deep);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:700;}
  .chip.green{background:#E6F7F0;color:var(--green);}
  .chip.red{background:#FFE9EB;color:var(--red);}
  .chip.gray{background:#F1ECEA;color:var(--text-light);}
  .chip.yellow{background:#FFF4DC;color:#C9962B;}

  .list{display:flex;flex-direction:column;gap:10px;}
  .item{background:#FFFDFC;border:1px solid var(--line);border-radius:16px;padding:12px 13px;display:flex;gap:10px;align-items:flex-start;}
  .item .body{flex:1;min-width:0;}
  .item .meta{font-size:12px;color:var(--text-light);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;}
  .item .acts{display:flex;gap:6px;flex-wrap:wrap;}
  .icon-btn{border:none;background:var(--pink-soft);color:var(--coral-deep);border-radius:10px;padding:7px 10px;font-size:12.5px;font-weight:700;min-height:36px;}
  .icon-btn:hover{background:var(--coral-light);}
  .icon-btn.red{background:#FFE9EB;color:var(--red);}
  .icon-btn.green{background:#E6F7F0;color:var(--green);}

  .remind{background:linear-gradient(135deg,#FFF1F4,#FFE9F0);border:1.5px solid var(--coral-light);border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:center;}
  .remind.red{background:#FFE9EB;border-color:#FFC2C9;}
  .remind .ric{width:30px;height:30px;flex:0 0 30px;}
  .remind .rtxt{flex:1;font-size:13.5px;}
  .remind .rtxt b{color:var(--coral-deep);}

  .quote{font-size:15px;line-height:1.7;color:#fff;font-weight:500;}

  table.tbl{width:100%;border-collapse:collapse;font-size:13px;}
  table.tbl th,table.tbl td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--line);}
  table.tbl th{color:var(--text-light);font-weight:700;font-size:12px;}
  .pill{padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;}
  .pill.viral{background:#FFE9F0;color:var(--coral-deep);}
  .pill.ok{background:#E6F7F0;color:var(--green);}
  .pill.low{background:#F1ECEA;color:var(--text-light);}

  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:760px){.two{grid-template-columns:1fr;}}

  .seg{display:inline-flex;background:var(--pink-soft);border-radius:999px;padding:3px;gap:2px;}
  .seg button{border:none;background:transparent;color:var(--text-light);font-weight:700;font-size:13px;padding:7px 14px;border-radius:999px;}
  .seg button.on{background:#fff;color:var(--coral-deep);box-shadow:var(--shadow-sm);}

  .mtag{display:inline-block;background:var(--pink-soft);color:var(--coral-deep);border-radius:8px;padding:2px 8px;font-size:11.5px;font-weight:700;margin:2px 4px 2px 0;}

  .out-box{background:#FFFDFC;border:1.5px dashed var(--coral-light);border-radius:14px;padding:12px;font-size:13px;white-space:pre-wrap;word-break:break-word;color:var(--text);min-height:90px;line-height:1.6;}

  /* mobile bottom tab */
  .bottomtab{display:none;}
  @media(max-width:860px){
    .sidebar{display:none;}
    .bottomtab{
      display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;
      background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);
      padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;
    }
    .bottomtab .nav-item{flex-direction:column;gap:3px;font-size:10.5px;padding:6px 4px;border-radius:12px;flex:1;}
    .bottomtab .nav-item svg{width:22px;height:22px;}
    .bottomtab .nav-item .dot{position:absolute;top:2px;right:50%;transform:translateX(14px);}
    .bottomtab .nav-item{position:relative;}
    .content{padding:14px;padding-bottom:92px;}
    .topbar{padding:10px 14px;}
    .topbar h1{font-size:15px;}
    .btn{padding:8px 12px;font-size:12.5px;}
  }

  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--text);color:#fff;padding:10px 18px;border-radius:999px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:99;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .empty{color:var(--text-light);font-size:13px;text-align:center;padding:18px 0;}
  .hint{font-size:12px;color:var(--text-light);margin-top:8px;line-height:1.5;}
  .star{color:var(--yellow);}
  .star.off{color:#EAD9D0;}
  .sec-title{font-size:13px;color:var(--text-light);font-weight:700;margin:4px 0 8px;display:flex;align-items:center;gap:6px;}
  .sec-title::before{content:"";width:4px;height:14px;background:var(--coral);border-radius:4px;display:inline-block;}
  .acc-banner{background:linear-gradient(135deg,#FFF4DC,#FFE9C7);border:1px solid #FFE0A8;border-radius:14px;padding:10px 14px;font-size:13px;color:#9a6b1a;margin-bottom:14px;font-weight:600;}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2C7 7 4 11 4 15a8 8 0 0 0 16 0c0-4-3-8-8-13z"/><path d="M9 15c1 1 5 1 6 0"/></svg>
      </div>
      <div><b>小桃运营台</b><small>自媒体博主专属</small></div>
    </div>
    <button class="nav-item active" data-tab="today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      今日
    </button>
    <button class="nav-item" data-tab="topic">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"/></svg>
      选题
    </button>
    <button class="nav-item" data-tab="script">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg>
      脚本
    </button>
    <button class="nav-item" data-tab="publish">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.3-2 5-2 5s3.7-.5 5-2c.7-.8.7-2 0-2.8a2 2 0 0 0-3 0zM12 15l-3-3a22 22 0 0 1 8-11c2.5 0 4 1.5 4 4a22 22 0 0 1-11 8zM9 12H4M12 15v5"/></svg>
      发布
    </button>
    <button class="nav-item" data-tab="review">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l3-4 3 2 5-7"/></svg>
      复盘
    </button>
  </aside>

  <div class="main">
    <div class="topbar">
      <h1 id="tabTitle">今日 ·  Overview</h1>
      <div class="acts">
        <button class="btn ghost sm" data-action="export-json">导出JSON</button>
        <button class="btn ghost sm" data-action="import-json">导入恢复</button>
        <button class="btn ghost sm" data-action="export-csv">导出CSV</button>
        <button class="btn danger sm" data-action="clear-sample">清空示例</button>
        <input type="file" id="importFile" accept="application/json" style="display:none">
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>

  <nav class="bottomtab">
    <button class="nav-item active" data-tab="today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>今日
    </button>
    <button class="nav-item" data-tab="topic">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"/></svg>选题
    </button>
    <button class="nav-item" data-tab="script">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg>脚本
    </button>
    <button class="nav-item" data-tab="publish">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.3-2 5-2 5s3.7-.5 5-2c.7-.8.7-2 0-2.8a2 2 0 0 0-3 0zM12 15l-3-3a22 22 0 0 1 8-11c2.5 0 4 1.5 4 4a22 22 0 0 1-11 8zM9 12H4M12 15v5"/></svg>发布
    </button>
    <button class="nav-item" data-tab="review">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l3-4 3 2 5-7"/></svg>复盘
    </button>
  </nav>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============ 基础工具 ============ */
const PREFIX="wb_fh_";
const $=s=>document.querySelector(s);
const $$=s=>document.querySelectorAll(s);
function uid(){return Math.random().toString(36).slice(2,9);}
function pad(n){return String(n).padStart(2,"0");}
function todayStr(){const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]));}
function daysBetween(a,b){const pa=new Date(a),pb=new Date(b);return Math.round((pb-pa)/86400000);}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1600);}
function copyText(t){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>toast("已复制到剪贴板")).catch(()=>fallbackCopy(t));}else fallbackCopy(t);}
function fallbackCopy(t){const ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("已复制到剪贴板");}catch(e){toast("复制失败，请手动选择");}ta.remove();}
function load(key,def){try{const v=localStorage.getItem(PREFIX+key);return v?JSON.parse(v):def;}catch(e){return def;}}
function save(key,val){localStorage.setItem(PREFIX+key,JSON.stringify(val));}

/* ============ 状态 ============ */
const S={
  ideas:load("ideas",[]),
  todos:load("todos",[]),
  topics:load("topics",[]),
  radar:load("radar",[]),
  assets:load("assets",[]),
  schedule:load("schedule",[]),
  reviews:load("reviews",[])
};
function persist(){Object.keys(S).forEach(k=>save(k,S[k]));}

/* ============ 静态知识库 ============ */
const OPEN_FORMULAS=[
  {id:"f1",name:"反常识",tpl:"你以为{话题}应该这样做，其实90%的人都做错了——真正有效的是…"},
  {id:"f2",name:"痛点直击",tpl:"是不是每次{场景}都让你崩溃？这3个坑我全踩过。"},
  {id:"f3",name:"结果前置",tpl:"我用{时间}把{结果}做到了，今天把方法全抖出来。"},
  {id:"f4",name:"设悬疑问",tpl:"为什么有人{条件A}却{结果B}？差别就在这一个动作。"},
  {id:"f5",name:"身份代入",tpl:"作为一个{身份}，这件事我必须提前告诉你。"},
  {id:"f6",name:"数字冲击",tpl:"{数字}个被低估的方法，第{数字2}个尤其重要。"},
  {id:"f7",name:"对比冲突",tpl:"同样在{领域}，为什么有人轻松{好结果}、有人一直{坏结果}？"},
  {id:"f8",name:"情绪共鸣",tpl:"累了吗？但你离{目标}只差这一步，别现在放弃。"}
];
const STRUCT_VIDEO=[
  {id:"v1",name:"黄金圈",steps:"钩子→痛点共鸣→方法拆解→真实案例→行动号召"},
  {id:"v2",name:"金字塔",steps:"核心结论→3个论据→反转/补充→总结升华"},
  {id:"v3",name:"故事线",steps:"背景铺垫→冲突出现→转折突破→圆满结局→个人感悟"},
  {id:"v4",name:"测评体",steps:"引入问题→多方案对比→打分维度→最终推荐"}
];
const STRUCT_TEXT=[
  {id:"t1",name:"清单体",steps:"吸睛标题→编号要点1-N→避坑提示→金句总结"},
  {id:"t2",name:"对比体",steps:"左右场景对比→差异拆解→适用人群→结论建议"},
  {id:"t3",name:"教程体",steps:"准备清单→分步操作→常见错误→进阶贴士"},
  {id:"t4",name:"种草体",steps:"使用场景→真实体验→购买理由→优惠/行动"}
];
const PLATFORM_TIMES=[
  {p:"小红书",t:"12:00–13:30 · 18:00–22:00",tip:"周三/四/五互动最佳，封面决定点击"},
  {p:"抖音",t:"12:00–13:00 · 18:00–19:00 · 21:00–23:00",tip:"晚高峰流量最大，前3秒定生死"},
  {p:"视频号",t:"12:00–14:00 · 19:00–21:00",tip:"依托微信社交裂变，适合转发私域"},
  {p:"B站",t:"11:00–13:00 · 18:00–23:00",tip:"中长视频友好，标题党慎用以伤完播"},
  {p:"微博",t:"08:00–09:00 · 12:00 · 21:00–22:00",tip:"热点借势快，话题标签要精准"}
];
const POST_CHECKLIST=[

function verdict(r){

    if(r.exposure>=8000||r.completion>=25) return {k:"viral",t:"爆了"};
    if(r.exposure>=2500) return {k:"ok",t:"达标"};

}

/* ============ SVG 图表 ============ */
function ring(percent,color,valTxt){
  const r=30,c=2*Math.PI*r,off=c*(1-Math.max(0,Math.min(100,percent))/100);
  return `<svg viewBox="0 0 80 80" width="80" height="80">
    <circle cx="40" cy="40" r="${r}" fill="none" stroke="#FFE3EA" stroke-width="8"/>
    <circle cx="40" cy="40" r="${r}" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 40 40)"/>
    <text x="40" y="38" text-anchor="middle" font-size="15" font-weight="700" fill="${color}">${valTxt}</text>
    <text x="40" y="52" text-anchor="middle" font-size="9" fill="#A08E88">${percent.toFixed(0)}%</text>
  </svg>`;
}
function donut(segs){
  const total=segs.reduce((a,b)=>a+b.value,0)||1;
  const r=46,c=2*Math.PI*r;let off=0;
  let parts=segs.map(s=>{
    const len=c*s.value/total;
    const seg=`<circle cx="60" cy="60" r="${r}" fill="none" stroke="${s.color}" stroke-width="16" stroke-dasharray="${len.toFixed(1)} ${(c-len).toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}" transform="rotate(-90 60 60)"/>`;
    off+=len;return seg;
  }).join("");
  return `<svg viewBox="0 0 120 120" width="120" height="120">${parts}<text x="60" y="56" text-anchor="middle" font-size="15" font-weight="700" fill="#5C4A45">${total}</text><text x="60" y="72" text-anchor="middle" font-size="9" fill="#A08E88">条选题</text></svg>`;
}
function lineChart(dates,exp,fol){
  const W=340,H=190,pl=38,pr=38,pt=14,pb=34;
  const iw=W-pl-pr,ih=H-pt-pb;
  const maxE=Math.max(...exp,1)*1.15, maxF=Math.max(...fol,1)*1.15;
  const n=dates.length;
  const x=i=>n<=1?pl+iw/2:pl+iw*i/(n-1);
  const yE=v=>pt+ih-(v/maxE)*ih;
  const yF=v=>pt+ih-(v/maxF)*ih;
  let g="";
  for(let i=0;i<=3;i++){const yy=pt+ih*i/3;g+=`<line x1="${pl}" y1="${yy}" x2="${W-pr}" y2="${yy}" stroke="#FFE3EA" stroke-width="1"/>`;}
  let pe="",pf="";
  dates.forEach((d,i)=>{pe+=`${i?"L":"M"}${x(i).toFixed(1)} ${yE(exp[i]).toFixed(1)} `;pf+=`${i?"L":"M"}${x(i).toFixed(1)} ${yF(fol[i]).toFixed(1)} `;});
  let dots="";
  dates.forEach((d,i)=>{dots+=`<circle cx="${x(i).toFixed(1)}" cy="${yE(exp[i]).toFixed(1)}" r="3" fill="#FF5C85"/>`;dots+=`<circle cx="${x(i).toFixed(1)}" cy="${yF(fol[i]).toFixed(1)}" r="3" fill="#3FB98E"/>`;});
  let xl="";
  dates.forEach((d,i)=>{if(n<=8||i%2===0){xl+=`<text x="${x(i).toFixed(1)}" y="${H-14}" text-anchor="middle" font-size="8" fill="#A08E88">${d.slice(5)}</text>`;}});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:520px">
    ${g}
    <path d="${pe}" fill="none" stroke="#FF5C85" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="${pf}" fill="none" stroke="#3FB98E" stroke-width="2.5" stroke-linejoin="round"/>
    ${dots}${xl}
    <text x="${pl}" y="${pt-2}" font-size="8" fill="#FF5C85">曝光</text>
    <text x="${W-pr}" y="${pt-2}" text-anchor="end" font-size="8" fill="#3FB98E">涨粉</text>
  </svg>`;
}
function barChart(items){
  if(!items.length) return '<div class="empty">暂无数据</div>';
  const W=340,H=190,pl=34,pr=10,pt=14,pb=40;
  const iw=W-pl-pr,ih=H-pt-pb;
  const max=Math.max(...items.map(i=>i.value),1);
  const bw=iw/items.length*0.6;
  const step=iw/items.length;
  let bars="",xl="";
  items.forEach((it,i)=>{
    const h=it.value/max*ih;
    const bx=pl+step*i+(step-bw)/2;
    const by=pt+ih-h;
    bars+=`<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="5" fill="${it.color||'#FF7E9D'}"/>`;
    bars+=`<text x="${(bx+bw/2).toFixed(1)}" y="${(by-4).toFixed(1)}" text-anchor="middle" font-size="8" font-weight="700" fill="#5C4A45">${it.value>=1000?(it.value/1000).toFixed(1)+'k':it.value}</text>`;
    xl+=`<text x="${(bx+bw/2).toFixed(1)}" y="${H-22}" text-anchor="middle" font-size="8" fill="#A08E88">${esc(it.label).slice(0,5)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:520px">${bars}${xl}</svg>`;
}

function computeStreak(){
  const dates=new Set(S.schedule.filter(s=>s.status==="已发").map(s=>s.publishedAt||s.date));
  if(!dates.size) return 0;
  let streak=0;const d=new Date();
  for(let i=0;i<400;i++){
    const ds=d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
    if(dates.has(ds)){streak++;d.setDate(d.getDate()-1);}else{if(i===0){d.setDate(d.getDate()-1);continue;}break;}
  }
  return streak;
}

  // 资产搜索
  const si=$("#asSearch");if(si)si.oninput=()=>{window._asSearch=si.value;renderScript();};
  // 回填 AI 指令生成器的选择（避免重渲染丢失）
  const _pg=window._pg||{};
  const setV=(id,v)=>{const el=$("#"+id);if(el&&v)el.value=v;};
  setV("pgTopic",_pg.t);setV("pgHook",_pg.h);setV("pgStruct",_pg.s);setV("pgFmt",_pg.f);setV("pgPlat",_pg.plat);
  const po=$("#pgPoints");if(po&&_pg.points!==undefined)po.value=_pg.points;
  ["pgTopic","pgHook","pgStruct","pgFmt","pgPlat"].forEach(id=>{const el=$("#"+id);if(el)el.onchange=()=>{window._pg=window._pg||{};const map={pgTopic:"t",pgHook:"h",pgStruct:"s",pgFmt:"f",pgPlat:"plat"};window._pg[map[id]]=el.value;};});
  const pi=$("#pgPoints");if(pi)pi.oninput=()=>{window._pg=window._pg||{};window._pg.points=pi.value;};
}

/* ============ 渲染：复盘 ============ */
function renderReview(){
  const fmt=window._revFmt||"视频";
  const list=S.reviews.filter(r=>r.format===fmt);
  // 四率
  const avg=(k)=>{const a=list.map(r=>r[k]||0);return a.length?a.reduce((x,y)=>x+y,0)/a.length:0;};
  const ringData=fmt==="视频"
    ?[["完播率",avg("completion"),"#FF5C85"],["互动率",avg("interaction"),"#FF9AB5"],["关注率",avg("follow"),"#FFC861"],["转化率",avg("conversion"),"#7FC8B0"]]
    :[["收藏率",avg("collection"),"#FF5C85"],["互动率",avg("interaction"),"#FF9AB5"],["关注率",avg("follow"),"#FFC861"],["转化率",avg("conversion"),"#7FC8B0"]];
  const rings=ringData.map(d=>`
    <div style="display:flex;flex-direction:column;align-items:center;gap:2px">
      ${ring(d[1],d[2],d[1].toFixed(1)+"%")}
      <div style="font-size:12.5px;font-weight:700;color:var(--text)">${d[0]}</div>
    </div>`).join("");

  // 趋势
  const sorted=S.reviews.slice().sort((a,b)=>a.date.localeCompare(b.date));
  const dates=sorted.map(r=>r.date);
  const exp=sorted.map(r=>r.exposure);
  const fol=sorted.map(r=>r.followers);

  // 归因
  const dim=window._revDim||"cat";
  const dimLabel={"cat":"选题库","hook":"钩子","slot":"时段","format":"形态","platform":"平台"};
  const agg={};
  S.reviews.forEach(r=>{const k=r[dim]||"未填";agg[k]=(agg[k]||0)+r.exposure;});
  const items=Object.keys(agg).map(k=>({label:k,value:agg[k],color:"#FF7E9D"})).sort((a,b)=>b.value-a.value).slice(0,8);

  // 明细
  const dimOpts=Object.keys(dimLabel).map(k=>`<option value="${k}" ${k===dim?'selected':''}>${dimLabel[k]}</option>`).join("");
  let revHtml=S.reviews.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(r=>{
    const v=verdict(r);
    return `<tr>
      <td>${esc(r.title)}</td>
      <td><span class="chip gray">${r.format}</span></td>
      <td>${r.date}</td>
      <td>${r.exposure.toLocaleString()}</td>
      <td>+${r.followers}</td>
      <td>${r.format==="视频"?(r.completion+"%"):(r.collection+"%")}</td>
      <td><span class="pill ${v.k}">${v.t}</span></td>
      <td><button class="icon-btn red" data-action="del-review" data-id="${r.id}">删</button></td>
    </tr>`;
  }).join("")||'<tr><td colspan="8" class="empty">还没有复盘数据</td></tr>';

  $("#content").innerHTML=`
  <div class="card" style="margin-bottom:14px">
    <h3>${icEye()} 四率看板
      <span class="seg" style="margin-left:auto">
        <button data-action="revfmt" data-v="视频" class="${fmt==='视频'?'on':''}">视频(看完播)</button>
        <button data-action="revfmt" data-v="图文" class="${fmt==='图文'?'on':''}">图文(看收藏)</button>
      </span>
    </h3>
    <div class="row" style="justify-content:space-around">${rings}</div>
    <div class="hint">视频看「完播率」，图文看「收藏率」，其余三率通用。当前展示 ${fmt} 形态 ${list.length} 条内容的平均值。</div>
  </div>

  <div class="two">
    <div class="card">
      <h3>${icTrend()} 曝光 × 涨粉 双轴趋势</h3>
      ${lineChart(dates,exp,fol)}
      <div class="row" style="justify-content:center;margin-top:6px;font-size:12px"><span class="chip red">● 曝光</span><span class="chip green">● 涨粉</span></div>
    </div>
    <div class="card">
      <h3>${icPie()} 归因图 · 什么最带曝光
        <select class="in" id="revDim" style="margin-left:auto;max-width:120px;padding:6px 8px;font-size:13px" data-action="revdim">${dimOpts}</select>
      </h3>
      ${barChart(items)}
      <div class="hint">按「${dimLabel[dim]}」聚合总曝光，柱越高代表越能带量。可切换维度找规律。</div>
    </div>
  </div>

  <div class="card" style="margin-top:14px">
    <h3>${icPlus()} 补录一条复盘</h3>
    <div class="row">
      <div class="field"><input class="in" id="rvTitle" placeholder="内容标题"></div>
      <div class="field" style="max-width:90px"><select class="in" id="rvFmt"><option value="视频">视频</option><option value="图文">图文</option></select></div>
      <div class="field" style="max-width:130px"><input class="in" id="rvDate" type="date" value="${todayStr()}"></div>
    </div>
    <div class="row" style="margin-top:8px">
      <div class="field" style="max-width:110px"><input class="in" id="rvExp" type="number" placeholder="曝光"></div>
      <div class="field" style="max-width:100px"><input class="in" id="rvFol" type="number" placeholder="涨粉"></div>
      <div class="field" style="max-width:100px"><input class="in" id="rvRate1" type="number" step="0.1" placeholder="完播/收藏%"></div>
      <div class="field" style="max-width:90px"><input class="in" id="rvCat" placeholder="选题库"></div>
      <div class="field" style="max-width:90px"><input class="in" id="rvHook" placeholder="钩子"></div>
    </div>
    <div class="row" style="margin-top:8px">
      <div class="field" style="max-width:90px"><input class="in" id="rvSlot" placeholder="时段"></div>
      <div class="field" style="max-width:90px"><input class="in" id="rvPlat" placeholder="平台"></div>
      <button class="btn" data-action="add-review">保存复盘</button>
    </div>
  </div>

  <div class="card" style="margin-top:14px">
    <h3>${icTable()} 内容明细 · 自动判定</h3>
    <div style="overflow-x:auto">
      <table class="tbl">
        <thead><tr><th>标题</th><th>形态</th><th>日期</th><th>曝光</th><th>涨粉</th><th>核心率</th><th>判定</th><th></th></tr></thead>
        <tbody>${revHtml}</tbody>
      </table>
    </div>
  </div>`;

  const dimSel=$("#revDim");if(dimSel)dimSel.onchange=()=>{window._revDim=dimSel.value;renderReview();};
}

/* ============ 图标 ============ */
function svgWrap(p){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;}
function icBolt(){return svgWrap('<path d="M13 2L3 14h7l-1 8 10-12h-7z"/>');}
function icCheck(){return svgWrap('<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>');}

/* ============ Tab 切换 ============ */
const TAB_TITLE={"today":"今日 · Overview","topic":"选题 · 主循环起点","script":"脚本 · 把想法落成稿","publish":"发布 · 排期与黄金1小时","review":"复盘 · 数据回流"};
let currentTab="today";
function showTab(name){
  currentTab=name;
  $$(".nav-item").forEach(b=>b.classList.toggle("active",b.dataset.tab===name));
  $("#tabTitle").textContent=TAB_TITLE[name]||"";
  if(name==="today")renderToday();
  else if(name==="topic")renderTopic();
  else if(name==="script")renderScript();
  else if(name==="publish")renderPublish();
  else   if(name==="review")renderReview();
  maybeAccBanner();
  window.scrollTo(0,0);
}

/* ============ 事件 ============ */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-action]");
  if(!el)return;
  const a=el.dataset.action,id=el.dataset.id;
  const t=todayStr();

  if(a==="goto"){showTab(el.dataset.tab);return;}
  if(a==="nav"||el.classList.contains("nav-item")&&!a){showTab(el.dataset.tab);return;}

  // 通用导航（sidebar/bottomtab 的 nav-item 没有 data-action，用下面处理）
  if(el.classList.contains("nav-item")){showTab(el.dataset.tab);return;}

  switch(a){
    /* 今日 */
    case "add-idea":{const v=$("#ideaInput").value.trim();if(!v){toast("先写点什么");return;}S.ideas.unshift({id:uid(),text:v,createdAt:t,converted:false});persist();renderToday();break;}
    case "convert-idea":{const it=S.ideas.find(x=>x.id===id);if(it){S.topics.unshift({id:uid(),title:it.text.slice(0,20),cat:"日常",outline:it.text,status:"规划中",createdAt:t,source:"灵感"});it.converted=true;persist();toast("已转为选题");renderToday();}break;}
    case "del-idea":{S.ideas=S.ideas.filter(x=>x.id!==id);persist();renderToday();break;}
    case "add-todo":{const v=$("#todoInput").value.trim();if(!v){toast("写点待办");return;}S.todos.unshift({id:uid(),text:v,due:$("#todoDue").value||"",done:false});persist();renderToday();break;}
    case "toggle-todo":{const tl=S.todos.find(x=>x.id===id);if(tl){tl.done=!tl.done;persist();renderToday();}break;}
    case "del-todo":{S.todos=S.todos.filter(x=>x.id!==id);persist();renderToday();break;}

    /* 选题 */
    case "add-topic":{const ti=$("#tpTitle").value.trim();if(!ti){toast("填标题");return;}S.topics.unshift({id:uid(),title:ti,cat:$("#tpCat").value,outline:$("#tpOutline").value.trim(),status:"规划中",createdAt:t,source:"自产"});persist();renderTopic();break;}
    case "del-topic":{S.topics=S.topics.filter(x=>x.id!==id);persist();renderTopic();break;}
    case "topic-todo":{const tp=S.topics.find(x=>x.id===id);if(tp){S.todos.unshift({id:uid(),text:"做选题："+tp.title,due:"",done:false});persist();toast("已加入待办");}break;}
    case "add-radar":{const ti=$("#rdTitle").value.trim();if(!ti){toast("填爆款标题");return;}S.radar.unshift({id:uid(),title:ti,platform:$("#rdPlat").value.trim(),track:$("#rdTrack").value.trim(),hook:$("#rdHook").value.trim(),views:$("#rdViews").value.trim(),note:$("#rdNote").value.trim(),converted:false});persist();renderTopic();break;}
    case "convert-radar":{const r=S.radar.find(x=>x.id===id);if(r){S.topics.unshift({id:uid(),title:r.title,cat:"爆款",outline:r.note||"",status:"规划中",createdAt:t,source:"雷达"});r.converted=true;persist();toast("已转选题");renderTopic();}break;}
    case "del-radar":{S.radar=S.radar.filter(x=>x.id!==id);persist();renderTopic();break;}

    /* 脚本 */
    case "fmt":{window._scriptFmt=el.dataset.v;renderScript();break;}
    case "use-hook":{const f=OPEN_FORMULAS.find(x=>x.id===id);if(f){window._pg=window._pg||{};window._pg.h=f.id;$("#pgHook").value=f.id;toast("已选钩子："+f.name);}break;}
    case "use-struct":{const s=(window._scriptFmt==="视频"?STRUCT_VIDEO:STRUCT_TEXT).find(x=>x.id===id);if(s){window._pg=window._pg||{};window._pg.s=s.id;$("#pgStruct").value=s.id;toast("已选结构："+s.name);}break;}
    case "gen-prompt":genPrompt();break;
    case "copy-prompt":{const o=$("#pgOut").textContent;if(o&&o.indexOf("填好")<0)copyText(o);else toast("先生成指令");break;}
    case "add-asset":{const n=$("#asName").value.trim();const c=$("#asCat").value.trim();const ct=$("#asContent").value.trim();if(!ct){toast("填内容");return;}S.assets.unshift({id:uid(),name:n||"未命名资产",cat:c||"其他",content:ct,stars:3});persist();renderScript();break;}
    case "star-asset":{const as=S.assets.find(x=>x.id===id);if(as){as.stars=(as.stars%5)+1;persist();renderScript();}break;}
    case "copy-asset":{const as=S.assets.find(x=>x.id===id);if(as)copyText(as.content);break;}
    case "del-asset":{S.assets=S.assets.filter(x=>x.id!==id);persist();renderScript();break;}

    /* 发布 */
    case "add-sch":{const p=$("#scPlat").value.trim();const d=$("#scDate").value;if(!p||!d){toast("平台+日期都要");return;}const tid=$("#scTopic").value;const tname=tid?S.topics.find(x=>x.id===tid):null;S.schedule.push({id:uid(),topicId:tid||null,topic:tname?tname.title:"未关联选题",platform:p,date:d,status:"待发"});persist();renderPublish();break;}
    case "publish-sch":{const s=S.schedule.find(x=>x.id===id);if(s){s.status="已发";s.publishedAt=t;persist();toast("已标记为发布");renderPublish();}break;}
    case "reschedule":{const s=S.schedule.find(x=>x.id===id);if(s){const nv=prompt("改到哪天？(YYYY-MM-DD)",s.date);if(nv&&/^\d{4}-\d{2}-\d{2}$/.test(nv)){s.date=nv;persist();renderPublish();}}break;}
    case "del-sch":{S.schedule=S.schedule.filter(x=>x.id!==id);persist();renderPublish();break;}

    /* 复盘 */
    case "revfmt":{window._revFmt=el.dataset.v;renderReview();break;}
    case "add-review":{
      const ti=$("#rvTitle").value.trim();if(!ti){toast("填标题");return;}
      const fmt=$("#rvFmt").value;const exp=+$("#rvExp").value||0;const fol=+$("#rvFol").value||0;
      const r1=+$("#rvRate1").value||0;
      const rec={id:uid(),title:ti,format:fmt,date:$("#rvDate").value||t,exposure:exp,followers:fol,completion:fmt==="视频"?r1:0,collection:fmt==="图文"?r1:0,interaction:0,follow:0,conversion:0,cat:$("#rvCat").value.trim(),hook:$("#rvHook").value.trim(),slot:$("#rvSlot").value.trim(),platform:$("#rvPlat").value.trim()};
      S.reviews.unshift(rec);persist();toast("已保存复盘");renderReview();break;
    }
    case "del-review":{S.reviews=S.reviews.filter(x=>x.id!==id);persist();renderReview();break;}
  }
});

/* 回车快速添加（今日） */
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    if(e.target.id==="ideaInput"){e.preventDefault();document.querySelector('[data-action="add-idea"]').click();}
    if(e.target.id==="todoInput"){e.preventDefault();document.querySelector('[data-action="add-todo"]').click();}
  }
});

function genPrompt(){
  const tid=$("#pgTopic").value;const hid=$("#pgHook").value;const sid=$("#pgStruct").value;
  const fmt=$("#pgFmt").value;const plat=$("#pgPlat").value.trim();
  const topic=tid?S.topics.find(x=>x.id===tid):null;
  const hook=OPEN_FORMULAS.find(x=>x.id===hid);
  const structs=fmt==="视频"?STRUCT_VIDEO:STRUCT_TEXT;
  const struct=structs.find(x=>x.id===sid);
  if(!topic&&!hook&&!struct){toast("至少选一个要素");return;}
  window._pg={t:tid,h:hid,s:sid,f:fmt,plat:plat,points:points};
  const points=$("#pgPoints").value.trim();
  const ptLines=points?points.split("\n").filter(Boolean).map((p,i)=>`  ${i+1}. ${p}`).join("\n"):"  （请补充你的核心要点）";
  const prompt=
`【角色】你是一位深耕${plat||"新媒体"}平台的爆款内容操盘手，擅长把普通选题写成高完播/高互动的成片脚本。
【选题】${topic?topic.title:"（未选，请补充）"}${topic&&topic.outline?"\n  一句话大纲："+topic.outline:""}
【内容形态】${fmt}
【黄金3秒钩子】${hook?hook.name+" —— "+hook.tpl:"（用强钩子抓住前3秒注意力）"}
【爆款结构】${struct?struct.name+"："+struct.steps:"（自选结构，保证节奏）"}
【核心要点】
${ptLines}
【任务】
1. 基于以上要素，写一版完整的${fmt}成片脚本：含画面/口播/字幕/转场提示，前3秒必须落地钩子。
2. 同步给出「拆解版」：把这个选题拆成可复用的选题公式+钩子库+结构模板，方便我后续批量生产。
3. 输出时标注预计完播/互动提升点，并给3条标题备选。
请直接输出可用的脚本与拆解，不要寒暄。`;
  $("#pgOut").textContent=prompt;
  toast("指令已生成，可复制");
}

/* ============ 备份 / 导入 / 清空 ============ */
function exportJSON(){
  const data={__type:"小桃运营台备份",__v:1,exportedAt:new Date().toISOString(),data:S};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="小桃运营台备份_"+todayStr()+".json";a.click();
  toast("JSON 已导出");
}
function importJSON(file){
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const d=JSON.parse(rd.result);
      const src=d.data||d;
      if(!src||typeof src!=="object")throw new Error("格式不对");
      Object.keys(S).forEach(k=>{if(src[k])S[k]=src[k];});
      persist();
      showTab(currentTab);
      toast("导入恢复成功");
    }catch(err){toast("导入失败：文件格式不正确");}
  };
  rd.readAsText(file);
}
function exportCSV(){
  const rows=S.reviews;
  if(!rows.length){toast("暂无复盘数据可导出");return;}
  const head=["标题","形态","日期","曝光","涨粉","完播率","收藏率","互动率","关注率","转化率","选题库","钩子","时段","平台","判定"];
  const lines=[head.join(",")];
  rows.forEach(r=>{const v=verdict(r);lines.push([r.title,r.format,r.date,r.exposure,r.followers,r.completion,r.collection,r.interaction,r.follow,r.conversion,r.cat,r.hook,r.slot,r.platform,v.t].map(x=>`"${String(x==null?'':x).replace(/"/g,'""')}"`).join(","));});
  const blob=new Blob(["\uFEFF"+lines.join("\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="小桃运营台复盘_"+todayStr()+".csv";a.click();
  toast("CSV 已导出");
}
function clearSample(){
  if(!confirm("确定清空全部示例与数据吗？此操作不可恢复，建议先导出 JSON 备份。"))return;
  Object.keys(S).forEach(k=>{S[k]=[];save(k,S[k]);});
  persist();
  showTab(currentTab);
  toast("已清空，可重新录入");
}

document.addEventListener("click",e=>{
  const a=e.target.closest("[data-action]");if(!a)return;
  const act=a.dataset.action;
  if(act==="export-json")exportJSON();
  else if(act==="import-json")$("#importFile").click();
  else if(act==="export-csv")exportCSV();
  else if(act==="clear-sample")clearSample();
});
$("#importFile").addEventListener("change",e=>{if(e.target.files[0])importJSON(e.target.files[0]);e.target.value="";});

// 侧边栏 / 底部导航（无 data-action，单独绑定）
$$(".nav-item").forEach(b=>b.addEventListener("click",()=>showTab(b.dataset.tab)));

/* ============ 启动 ============ */
function totalCount(){return Object.keys(S).reduce((a,k)=>a+S[k].length,0);}
function maybeAccBanner(){
  if(totalCount()>=30&&!$("#accBanner")){
    const b=document.createElement("div");b.id="accBanner";b.className="acc-banner";b.textContent="数据已积累 "+totalCount()+" 条，建议导出 JSON 备份，防止误清丢失。";
    $("#content").insertBefore(b,$("#content").firstChild);
  }
}
const _origShow=showTab;
// 启动
if(!localStorage.getItem(PREFIX+"init")){seedSample();}
showTab("today");
